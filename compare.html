<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>insectdraw compare</title>
<style>
  html, body { margin: 0; background: #fff; color: #000; }
  body { font: 14px/1.4 Georgia, "Times New Roman", serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 12px 16px; box-sizing: border-box; }
  header { display: flex; gap: 6px 18px; align-items: baseline; flex-wrap: wrap; justify-content: center; margin: 0 0 14px; text-align: center; }
  header h1 { font: inherit; font-size: 20px; margin: 0; letter-spacing: 0.04em; }
  header p { margin: 0; color: #444; }
  header nav { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
  header a { color: inherit; }
  #panes { display: flex; gap: 16px; justify-content: center; align-items: flex-start; flex-wrap: wrap; width: 100%; }
  .pane { display: flex; flex-direction: column; align-items: center; max-width: 100%; }   /* shrink-to-fit, but never wider than the viewport, so the controls wrap */
  .stage { width: min(92vw, 46vw, 600px); aspect-ratio: 1 / 1; }
  @media (max-width: 1000px) { .stage { width: min(92vw, 600px); } }   /* stacked panes go full width */
  .stage svg { width: 100%; height: 100%; display: block; }
  .controls { display: flex; gap: 8px; align-items: center; margin: 14px 0 6px; flex-wrap: wrap; justify-content: center; }
  input, button { font: inherit; padding: 4px 10px; border: 1px solid #000; background: #fff; color: #000; border-radius: 0; }
  input { width: 10em; }
  button { cursor: pointer; }
  button:active { background: #000; color: #fff; }
  button:disabled { opacity: 1; color: #888; border-color: #888; cursor: default; }
  button:disabled:active { background: #fff; color: #888; }
  .hint { color: #666; font-size: 12px; margin-top: 10px; text-align: center; }
</style>
</head>
<body>
<header>
  <h1>insectdraw compare</h1>
  <p>Two plates side by side, each with its own seed, controls and Back history.</p>
  <nav><a href="index.html">Plate</a><a href="parts.html">Parts</a><a href="https://github.com/Adroz/insectdraw">GitHub</a></nav>
</header>
<div id="panes"></div>
<p class="hint">The URL hash carries both seeds (<code>#1234|5678</code>). Serve this directory over HTTP (the page fetches the engine from <code>index.html</code>).</p>
<script>
fetch('index.html').then(r => r.text()).then(html => {
  const m = html.match(/<script id="engine">([\s\S]*?)<\/script>/);
  const sc = document.createElement('script'); sc.textContent = m[1]; document.head.appendChild(sc);
  init();
});
function init() {
  // Two independent panes, each with its own seed, controls and Back history. The URL hash carries
  // both seeds (#123|456); a single seed (#123) fills pane A and rolls pane B.
  const HISTORY_MAX = 100;
  const rnd = () => Math.floor(Math.random() * 4294967296);
  const panesEl = document.getElementById('panes');
  const panes = [];
  let hashLock = false;   // set while we write the hash ourselves (replaceState never fires hashchange, but keep it explicit)

  function makePane() {
    const el = document.createElement('div');
    el.className = 'pane';
    el.innerHTML = '<div class="stage"></div><div class="controls">' +
      '<button class="back" disabled>Back</button>' +
      '<label>Seed <input class="seed" type="number" value="1" min="0" step="1"></label>' +
      '<button class="gen">Generate</button><button class="rnd">Random</button><button class="daily">Daily</button></div>';
    panesEl.appendChild(el);
    const q = c => el.querySelector('.' + c);
    const pane = { stage: q('stage'), seedInput: q('seed'), backBtn: q('back'), history: [], seed: null, meta: null };

    // render(seed) pushes the previously displayed seed onto the pane's history;
    // render(seed, false) renders without recording (used by Back itself).
    pane.render = (seed, push = true) => {
      seed = Number(seed) >>> 0;
      if (push && pane.seed !== null && pane.seed !== seed) {
        pane.history.push(pane.seed);
        if (pane.history.length > HISTORY_MAX) pane.history.shift();
      }
      pane.seed = seed;
      pane.backBtn.disabled = pane.history.length === 0;
      pane.seedInput.value = seed;
      const r = generateInsectDetailed(seed);
      pane.stage.innerHTML = r.svg;
      pane.meta = r.meta;
      syncHash();
    };
    pane.goBack = () => { if (pane.history.length) pane.render(pane.history.pop(), false); };

    pane.backBtn.addEventListener('click', pane.goBack);
    q('gen').addEventListener('click', () => pane.render(pane.seedInput.value));
    pane.seedInput.addEventListener('keydown', e => { if (e.key === 'Enter') pane.render(pane.seedInput.value); });
    q('rnd').addEventListener('click', () => pane.render(rnd()));
    q('daily').addEventListener('click', () => pane.render(dailySeed()));
    return pane;
  }

  function syncHash() {
    if (panes.some(p => p.seed === null)) return;
    hashLock = true;
    history.replaceState(null, '', '#' + panes.map(p => p.seed).join('|'));
    hashLock = false;
    document.title = panes[0].meta.name.binomial + ' · ' + panes[1].meta.name.binomial + ' · insectdraw #' + panes.map(p => p.seed).join('|');
  }

  // #123 or #123|456 -> [123] / [123, 456]; anything else -> null
  function parseHash() {
    const m = location.hash.slice(1).match(/^(\d+)(?:\|(\d+))?$/);
    return m ? [m[1], m[2]].filter(x => x !== undefined) : null;
  }
  function applyHash(seeds) {
    if (seeds.length === 1) seeds = [seeds[0], panes[1].seed === null ? rnd() : panes[1].seed];
    seeds.forEach((s, i) => { if ((Number(s) >>> 0) !== panes[i].seed) panes[i].render(s); });
  }

  panes.push(makePane(), makePane());
  // External hash edits (a pasted #a|b) render and are back-able.
  window.addEventListener('hashchange', () => { if (hashLock) return; const s = parseHash(); if (s) applyHash(s); });

  const initial = parseHash();
  if (initial) applyHash(initial); else applyHash([dailySeed(), rnd()]);
  window.panes = panes;
}
</script>
</body>
</html>
