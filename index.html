<header>
  <h1>insectdraw</h1>
  <p>Procedural Victorian insect plates: one deterministic drawing per seed, today's plate by default.</p>
  <nav><a href="compare.html">Compare</a><a href="parts.html">Parts</a><a href="https://github.com/Adroz/insectdraw">GitHub</a></nav>

<div id="panes"></div>

<script id="engine">
'use strict';
/* ============================================================
   insectdraw — procedural Victorian-style insect plates
   Everything below the UI block is pure generation: no DOM.
   Coordinates: body axis is x = 0, head at top (y increasing
   downward). The RIGHT half (x >= 0) is generated and mirrored.
   ============================================================ */

// ---------- PRNG (mulberry32) ----------
let rng = null;
function mulberry32(seed) {
  let a = seed | 0;
  const f = function () {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  f.state = () => a;            // the stream position, for rngSync (a device plate's second pass re-synchronises on it)
  f.seek = v => { a = v | 0; };
  return f;
}
function randRange(min, max) { return min + (max - min) * rng(); }
function randInt(min, max) { return Math.floor(randRange(min, max + 1)); }
function pick(arr) { return arr[Math.floor(rng() * arr.length)]; }
function jitter(k) { return 1 + randRange(-k, k); }
function hashString(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
// Brisbane calendar day (YYYY-MM-DD) of an instant, now when omitted: UTC+10 with no daylight saving, so a fixed offset
// is exact and the day boundary is 14:00 UTC. The daily plate's seed hashes it (ADR 0002).
function brisbaneDay(date) { return new Date((date || new Date()).getTime() + 10 * 3600e3).toISOString().slice(0, 10); }
function dailySeed(date) { return hashString(brisbaneDay(date)); }

// ---------- vector helpers ----------
const D2R = Math.PI / 180;
function add(a, b) { return [a[0] + b[0], a[1] + b[1]]; }
function sub(a, b) { return [a[0] - b[0], a[1] - b[1]]; }
function mul(a, k) { return [a[0] * k, a[1] * k]; }
function vlen(a) { return Math.hypot(a[0], a[1]); }
function norm(a) { const l = vlen(a) || 1; return [a[0] / l, a[1] / l]; }
function perp(a) { return [-a[1], a[0]]; }
function rot(p, ang) { const c = Math.cos(ang), s = Math.sin(ang); return [p[0] * c - p[1] * s, p[0] * s + p[1] * c]; }
function lerp(a, b, t) { return a + (b - a) * t; }
function lerpP(a, b, t) { return [lerp(a[0], b[0], t), lerp(a[1], b[1], t)]; }
function dirv(deg) { return [Math.cos(deg * D2R), Math.sin(deg * D2R)]; }
function fmt(n) { return Math.round(n * 10) / 10; }

// ---------- bbox tracking (everything emitted passes through here) ----------
let bbox = null;
let wingPolys = [];   // body-coordinate outlines of every wing drawn for the current plate: a side effect of makeWing (and the elytron block), reset per plate in drawPlate, read by the antennae section (meta.wingOutlines)
function bb(p) {
  if (!bbox) return;   // the fit is done (assemblePlate, before it resolves the deferred elements): nothing more counts
  if (p[0] < bbox.minX) bbox.minX = p[0];
  if (p[0] > bbox.maxX) bbox.maxX = p[0];
  if (p[1] < bbox.minY) bbox.minY = p[1];
  if (p[1] > bbox.maxY) bbox.maxY = p[1];
}

// ---------- stroke classes (tokens replaced once final scale is known) ----------
const SW = { H: 'SW_H', O: 'SW_O', D: 'SW_D', F: 'SW_F' };   // heavy 2.2, outline 1.5, detail 0.8, fine 0.5
const SW_PX = { H: 2.2, O: 1.5, D: 0.8, F: 0.5 };             // the weights in plate px (the token substitution divides by the plate scale)

// ---------- device floors (ADR 0001) ----------
// The device contract, exported so the gates (tests/check.js, tests/eink.js) assert the numbers the engine draws to:
// a device plate (generateInsectDetailed(seed, { devicePx })) is the default plate's insect with every stroke weight
// clamped to >= strokePx device px and every hatch / mesh pitch to >= pitchPx device px, i.e. floor x 600 / devicePx
// in plate units; the caption subtitle (11 px) is dropped where it would fall under subtitleMinPx device px, and the
// binomial is floored at captionMinPx device px so it reads at arm's length on the panel (ticket #38).
const DEVICE = { strokePx: 1.0, pitchPx: 2.5, subtitleMinPx: 10, captionMinPx: 24 };
const CAPTION_H = 45;                 // band reserved at the foot of the plate for the caption (plate px)
const CAPTION_BASELINE_K = 0.75;      // how far the binomial's baseline drops per px of size over 16, keeping it in the band
// Strokes are clamped at the token substitution; pitches at draw time through floorPitch(v) (body units; the floor is
// pitchFloor, 0 on a default plate), which also records the smallest pitch drawn for meta.minPitch. Every repeated
// mark at a spacing (hatch bands, lattice, mesh cell, pile, fringe, limb shading / spines / comb rows, antenna rami
// and annuli, crossvein ladders, the stigma's lines) must go through floorPitch, never a literal step. A step given
// as a fraction of a length (a limb mark's step in s, a ladder's step in u) goes through floorFrac, marks at every
// k-th sample of a polyline through floorSamples; both are bit-identical on a default plate.
// The plate scale is only known once the insect is drawn, so a device plate is drawn twice: pass 1 is the default
// drawing and yields the scale, pass 2 redraws with the floors. Genes and rolls are untouched, but a clamped site may
// consume a different number of rng draws (stipple dots, mesh sites), so rngSync() closes every such site: pass 1
// records the stream position there and pass 2 restores it, keeping every roll outside the site identical.
// A second hatch family laid across a first (the lepidopteran cross-hatch in the darks) fills solid at 1 bit when both
// sit at the floor, so it takes k = 2: twice the floor keeps the two families separate.
let pitchFloor = 0, pitchMin = Infinity, syncRec = null, syncPlay = null, syncI = 0;
const floorPitch = (v, k) => { const p = Math.max(v, (k || 1) * pitchFloor); if (p < pitchMin) pitchMin = p; return p; };
// a fraction f of a length L (body units): the floor applies to f x L and the fraction is replaced only when the floor
// raises it, so a default plate's loop values are untouched
const floorFrac = (f, L) => { const v = f * L, p = floorPitch(v); return p > v ? p / L : f; };
// marks at every k-th sample of a polyline: the pitch is k x the closest sample spacing, and the floor raises k
const floorSamples = (k, pl) => {
  let d = Infinity;
  for (let i = 1; i < pl.length; i++) { const v = vlen(sub(pl[i], pl[i - 1])); if (v > 0 && v < d) d = v; }
  if (d === Infinity) return k;
  const p = floorPitch(k * d);
  return p > k * d ? Math.ceil(p / d) : k;
};
const rngSync = () => { if (syncRec) syncRec.push(rng.state()); else if (syncPlay) rng.seek(syncPlay[syncI]); syncI++; };

// ---------- curves ----------
// pts = [p0, c1, c2, p1, c3, c4, p2, ...]
function cubicBezierPath(pts, closed) {
  bb(pts[0]);
  let d = 'M' + fmt(pts[0][0]) + ',' + fmt(pts[0][1]);
  for (let i = 1; i + 2 < pts.length; i += 3) {
    bb(pts[i]); bb(pts[i + 1]); bb(pts[i + 2]);
    d += ' C' + fmt(pts[i][0]) + ',' + fmt(pts[i][1]) + ' ' + fmt(pts[i + 1][0]) + ',' + fmt(pts[i + 1][1]) + ' ' + fmt(pts[i + 2][0]) + ',' + fmt(pts[i + 2][1]);
  }
  return closed ? d + ' Z' : d;
}
// Catmull-Rom spline through pts -> cubic bezier control list
function catmullRomToBezier(pts, closed, tension) {
  tension = tension === undefined ? 1 : tension;
  const n = pts.length, out = [pts[0]];
  const segs = closed ? n : n - 1;
  for (let i = 0; i < segs; i++) {
    const p0 = pts[closed ? (i - 1 + n) % n : Math.max(i - 1, 0)];
    const p1 = pts[i];
    const p2 = pts[(i + 1) % n];
    const p3 = pts[closed ? (i + 2) % n : Math.min(i + 2, n - 1)];
    out.push(add(p1, mul(sub(p2, p0), tension / 6)), sub(p2, mul(sub(p3, p1), tension / 6)), p2);
  }

}
function smoothPath(pts, closed, tension) { return cubicBezierPath(catmullRomToBezier(pts, closed, tension), closed); }
function sampleBezier(bz, perSeg) {
  const out = [];
  for (let i = 1; i + 2 < bz.length; i += 3) {
    const p0 = bz[i - 1], c1 = bz[i], c2 = bz[i + 1], p1 = bz[i + 2];
    for (let k = 0; k < perSeg; k++) {
      const t = k / perSeg, u = 1 - t;
      out.push([u * u * u * p0[0] + 3 * u * u * t * c1[0] + 3 * u * t * t * c2[0] + t * t * t * p1[0],
                u * u * u * p0[1] + 3 * u * u * t * c1[1] + 3 * u * t * t * c2[1] + t * t * t * p1[1]]);
    }
  }
  out.push(bz[bz.length - 1]);
  return out;
}
function sampleSmooth(pts, closed, tension, perSeg) { return sampleBezier(catmullRomToBezier(pts, closed, tension), perSeg || 8); }
function ellipseBezier(c, rx, ry, rotDeg) {
  const k = 0.5523, a = (rotDeg || 0) * D2R;
  const T = p => add(c, rot(p, a));
  return [T([rx, 0]),
    T([rx, ry * k]), T([rx * k, ry]), T([0, ry]),
    T([-rx * k, ry]), T([-rx, ry * k]), T([-rx, 0]),
    T([-rx, -ry * k]), T([-rx * k, -ry]), T([0, -ry]),
    T([rx * k, -ry]), T([rx, -ry * k]), T([rx, 0])];
}
function ellipsePath(c, rx, ry, rotDeg) { return cubicBezierPath(ellipseBezier(c, rx, ry, rotDeg), true); }

// ---------- polygon helpers ----------
function pointInPoly(p, poly) {
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const a = poly[i], b = poly[j];
    if ((a[1] > p[1]) !== (b[1] > p[1]) && p[0] < (b[0] - a[0]) * (p[1] - a[1]) / (b[1] - a[1]) + a[0]) inside = !inside;
  }
  return inside;
}
function outlineYRange(poly, x) {
  let top = Infinity, bot = -Infinity;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const a = poly[i], b = poly[j];
    if ((a[0] <= x && x < b[0]) || (b[0] <= x && x < a[0])) {
      const y = a[1] + (b[1] - a[1]) * (x - a[0]) / (b[0] - a[0]);
      if (y < top) top = y;
      if (y > bot) bot = y;
    }
  }
  return top === Infinity ? null : [top, bot];
}
function plAt(pl, t) { return pl[Math.max(0, Math.min(pl.length - 1, Math.round(t * (pl.length - 1))))]; }
function plYAt(pl, x) {           // polyline monotonic in x
  if (x < pl[0][0] || x > pl[pl.length - 1][0]) return null;
  for (let i = 0; i + 1 < pl.length; i++) {
    const a = pl[i], b = pl[i + 1];
    if (x >= a[0] && x <= b[0]) return b[0] === a[0] ? a[1] : a[1] + (b[1] - a[1]) * (x - a[0]) / (b[0] - a[0]);
  }
  return null;
}

// ---------- element emitters ----------
function pathEl(d, sw, fill) { return '<path d="' + d + '" fill="' + (fill || 'none') + '" stroke-width="' + sw + '"/>'; }
function lineEl(a, b, sw) { bb(a); bb(b); return '<line x1="' + fmt(a[0]) + '" y1="' + fmt(a[1]) + '" x2="' + fmt(b[0]) + '" y2="' + fmt(b[1]) + '" stroke-width="' + sw + '"/>'; }
function polylineEl(pts, sw) { pts.forEach(bb); return polylineStr(pts, sw); }
function polylineStr(pts, sw) { return '<polyline points="' + pts.map(p => fmt(p[0]) + ',' + fmt(p[1])).join(' ') + '" fill="none" stroke-width="' + sw + '"/>'; }   // the element alone, no bbox (a deferred element resolved after the fit)
function polygonEl(pts, sw, fill) { pts.forEach(bb); return '<path d="M' + pts.map(p => fmt(p[0]) + ',' + fmt(p[1])).join(' L') + ' Z" fill="' + (fill || 'none') + '" stroke-width="' + sw + '"/>'; }
function circleEl(c, r, sw, fill) { bb([c[0] - r, c[1] - r]); bb([c[0] + r, c[1] + r]); return '<circle cx="' + fmt(c[0]) + '" cy="' + fmt(c[1]) + '" r="' + fmt(r) + '" fill="' + (fill || 'none') + '" stroke-width="' + sw + '"/>'; }
function bowLine(y, hw, bow, sw) {
  return pathEl(cubicBezierPath([[-hw, y], [-hw * 0.35, y + bow], [hw * 0.35, y + bow], [hw, y]], false), sw);
}

// ---------- body part from a half-width profile ----------
// anchors: [[t, f], ...]  t = 0..1 top->bottom, f = fraction of maxHw
function bodyPart(yTop, length, maxHw, anchors, tension) {
  const right = anchors.map(a => [a[1] * maxHw, yTop + a[0] * length]);
  const pts = right.slice();
  for (let i = right.length - 1; i >= 0; i--) if (right[i][0] > 0.01) pts.push([-right[i][0], right[i][1]]);
  const bz = catmullRomToBezier(pts, true, tension);
  const samples = sampleBezier(bz, 10);
  function hwAt(y) {
    let best = 0;
    for (let i = 0; i + 1 < samples.length; i++) {
      const a = samples[i], b = samples[i + 1];
      if ((a[1] <= y && y <= b[1]) || (b[1] <= y && y <= a[1])) {
        const x = b[1] === a[1] ? Math.max(a[0], b[0]) : a[0] + (b[0] - a[0]) * (y - a[1]) / (b[1] - a[1]);
        if (x > best) best = x;
      }
    }
    return best;
  }
  return { path: cubicBezierPath(bz, true), samples, hwAt, yTop, yBot: yTop + length, length, maxHw,
           yAt: t => yTop + t * length };
}
// shape with a straight inner edge on the centre line (elytron, tegmen)
function halfShield(pts) {
  const bz = catmullRomToBezier(pts, false, 1);
  return cubicBezierPath(bz, false) + ' Z';
}

// ---------- limb segment: tapered, bowed, rounded ends, white fill ----------
// Geometry is kept so hatching, spines and muscle patterns can be laid on the
// segment analytically (they are then masked by whatever is drawn next).
function limbGeom(A, B, w1, w2, bow) {
  const d = norm(sub(B, A)), n = perp(d), L = vlen(sub(B, A));
  const k = L * 0.35, bv = mul(n, bow);
  const edge = side => {
    const a = add(A, mul(n, side * w1 / 2)), b = add(B, mul(n, side * w2 / 2));
    return [a, add(add(a, mul(d, k)), bv), add(sub(b, mul(d, k)), bv), b];
  };
  return { A, B, d, n, L, w1, w2, bow, e1: edge(1), e2: edge(-1), wAt: s => lerp(w1, w2, s) };
}
// Saltatorial hind femur (#23, docs/ref/leg-orth-femur.jpg): a drumstick, not a carrot. Deepest at about a fifth of the
// length (wMax), 0.75 of that at the trochanter, down to 0.3 before the knee. One cubic per edge, fitted to the depths
// measured on the reference (FEMUR_PROFILE: control x as fractions of the length, control half-widths as fractions of
// wMax / 2), so bez3 on the edges, wAt and the herringbone's s all run on the same parameter as limbGeom's.
const FEMUR_PROFILE = { x: [0, 0.26, 0.898, 1], h: [0.75, 1.625, -0.13, 0.3] };
function femurGeom(A, B, wMax, bow) {
  const d = norm(sub(B, A)), n = perp(d), L = vlen(sub(B, A)), F = FEMUR_PROFILE, bv = mul(n, bow);
  const edge = side => F.x.map((x, i) => add(add(A, mul(d, x * L)), add(mul(n, side * F.h[i] * wMax / 2), i === 1 || i === 2 ? bv : [0, 0])));
  const wAt = s => { const u = 1 - s; return wMax * (u * u * u * F.h[0] + 3 * u * u * s * F.h[1] + 3 * u * s * s * F.h[2] + s * s * s * F.h[3]); };
  return { A, B, d, n, L, w1: wMax * F.h[0], w2: wMax * F.h[3], bow, e1: edge(1), e2: edge(-1), wAt };
}
function bez3(c, s) {
  const u = 1 - s;
  return [u * u * u * c[0][0] + 3 * u * u * s * c[1][0] + 3 * u * s * s * c[2][0] + s * s * s * c[3][0],

}
function limbPath(g) {
  const { e1, e2, d, w1, w2 } = g;
  const pts = [
    e1[0], e1[1], e1[2], e1[3],
    add(e1[3], mul(d, w2 * 0.55)), add(e2[3], mul(d, w2 * 0.55)), e2[3],
    e2[2], e2[1], e2[0],
    sub(e2[0], mul(d, w1 * 0.55)), sub(e1[0], mul(d, w1 * 0.55)), e1[0],

}
function limbSegment(A, B, w1, w2, bow) { return pathEl(limbPath(limbGeom(A, B, w1, w2, bow)), SW.O, '#fff'); }
// engraver's shading: short fine lines across the segment from the shaded edge
// inward, so the cylinder reads as round. side = +1 (e1) or -1 (e2).
function limbShade(g, side, spacing) {
  spacing = floorPitch(spacing);
  const els = [], edge = side > 0 ? g.e1 : g.e2;
  if (g.L < spacing * 3) return els;
  const s0 = Math.min(0.14, 3 / g.L), s1 = 1 - Math.min(0.14, 3 / g.L);
  let i = 0;
  for (let s = s0; s <= s1; s += spacing / g.L, i++) {
    const w = g.wAt(s);
    if (w < 3) continue;
    const base = bez3(edge, s);
    const fr = (i % 2 === 0 ? 0.58 : 0.4) * (0.75 + 0.25 * Math.sin(Math.PI * s));
    const dir = norm(add(mul(g.n, -side), mul(g.d, 0.3)));

// fixed spines in a row along one edge, leaning distad
function limbSpines(g, side, spacing, len, s0, s1, sw) {
  spacing = floorPitch(spacing);
  const els = [], edge = side > 0 ? g.e1 : g.e2;
  for (let s = s0; s <= s1; s += spacing / g.L) {
    const b = bez3(edge, s);
    const tip = add(b, add(mul(g.n, side * len), mul(g.d, len * 0.75)));

// n strong teeth on one edge of a segment (the cicada's fore femur beneath, #26): closed triangles leaning distad, spread
// over the middle of the swollen part, each about a third of the segment's greatest depth; returns one element per tooth
function limbTeeth(g, side, n) {

// chevron (herringbone) muscle pattern on a saltatorial femur
function femurHerringbone(g, side) {
  const els = [], step = floorPitch(Math.max(3.2, g.L / 18));   // about 15 chevrons, as on the reference
  const mid = s => lerpP(bez3(g.e1, s), bez3(g.e2, s), 0.5 - side * 0.08);
  const sm = 0.03, sM = 0.86;   // over the whole outer face, from the base to where it narrows before the knee (#23)
  els.push(pathEl(cubicBezierPath([mid(sm), mid(0.35), mid(0.65), mid(sM)], false), SW.D));

// to give: its abdominal marking (B.abd.mark; plain gives none) or an antenna kind its family draws on under half its
// plates, so a banded abdomen is "Banded" or "Ringed" and a bipectinate moth "Feathered". Otherwise it comes from the
// order's `adj` list (else COMMON_ADJ), from which every marking and antenna word is kept out: a plate is never named for
// a marking it does not draw. The qualifier (size, range, rarity) widens the pool so plates seldom share a name.
// tests/names.js MARK_CLAIMS / ANT_CLAIMS hold the claim vocabulary these must stay inside.

  'Alpine', 'Lowland', 'Upland', 'Dwarf', 'Giant', 'Island', 'Coastal', 'Continental'];

// two common-name parts repeat a stem: a word of one equals a word of the other ignoring case, or starts it when the
// shorter has 4+ letters (tests/names.js repeatedStem states the same rule independently)
function nameClash(a, b) {
  const words = s => (s || '').toLowerCase().split(/[ -]+/).filter(Boolean);
  const wb = words(b);
  return words(a).some(x => wb.some(y => x === y || (x.length >= 4 && y.startsWith(x)) || (y.length >= 4 && x.startsWith(y))));

// fam: the drawn family (meta.fam), which picks the noun (and base) from a table with famNouns (famBase); genes: the
// plate's { mark: B.abd.mark, ant: B.ant.kind }, which give the adjective (#28). Without them (a name by seed alone)
// the adjective comes from the general list.
function insectName(seed, type, variant, fam, genes) {
  const r = mulberry32((((seed >>> 0) ^ 0x9E3779B9) >>> 0));   // private PRNG: never touches the drawing's rng
  const pk = arr => arr[Math.floor(r() * arr.length)];
  const order = ORDERS[type] || ORDERS.beetle, names = (variant && order.variantNames && order.variantNames[variant]) || order.names;
  const tails = names.tails;

  // genus: capitalised prefix + order-appropriate tail; collapse doubled vowels ("Chryso" + "aeschna" -> "Chrysaeschna")
  const pre = pk(NAME_PREFIX);
  const [tail, gender] = pk(tails);
  let genus = pre + tail;
  if (/[aeiou]$/.test(pre) && /^[aeiou]/.test(tail)) genus = pre.slice(0, -1) + tail;
  genus = genus.charAt(0).toUpperCase() + genus.slice(1).toLowerCase();

  // species epithet: either a Latin adjective or one built from the same syllable tables; agree with genus gender
  let species;
  if (r() < 0.25) {
    let p2 = pk(NAME_PREFIX);
    if (p2 === pre) p2 = pk(NAME_PREFIX);
    const [t2, cls] = pk(EPITHET_TAIL);
    let stem = p2.toLowerCase();
    if (/[aeiou]$/.test(stem) && /^[aeiou]/.test(t2)) stem = stem.slice(0, -1);
    species = declineEpithet(stem + t2, cls, gender);
  } else {
    const [stem, cls] = pk(EPITHET);
    species = declineEpithet(stem, cls, gender);
  }

  // common name: [<Qualifier>] <Adjective> <Noun> [<Base>] (#28), drawn after the binomial so the binomial's draws are
  // unchanged. Never repeating a stem across the parts (#29): no word equal to another ignoring case, nor the start of
  // another when the shorter has 4+ letters ("Dark Darkling", "Blue-tailed Bluet"). The noun re-rolls, then is picked
  // from the nouns that clear, and the adjective too if none does; a qualifier that clashes is dropped. The name PRNG is
  // private, so none of this moves a drawing.
  const c = names.common, famNouns = (fam && c.famNouns) || {};
  const nouns = famNouns[fam] || c.nouns, base = (fam && c.famBase && c.famBase[fam]) || c.base;
  const otherNouns = new Set(Object.keys(famNouns).filter(f => f !== fam).flatMap(f => famNouns[f]));   // another family's noun is no adjective here
  const g = genes || {}, antT = order.ant, antKinds = Object.assign({}, antT.base, antT[fam] || {}).kinds;
  const antTot = Object.values(antKinds).reduce((x, w) => x + w, 0);
  const antRare = (antKinds[g.ant] || 0) < 0.5 * antTot;   // only a kind the family draws on under half its plates sets this one apart
  const geneAdj = [...(GENE_MARK_ADJ[g.mark] || []), ...(antRare ? GENE_ANT_ADJ[g.ant] || [] : [])];
  const adjs = geneAdj.length ? geneAdj : (c.adj || COMMON_ADJ).filter(a => !GENE_WORDS.has(a) && !otherNouns.has(a));
  const fits = (a, n) => !nameClash(a, n) && !nameClash(a, base) && !nameClash(n, base);
  let adj = pk(adjs), noun = pk(nouns);
  for (let i = 0; i < 8 && !fits(adj, noun); i++) noun = pk(nouns);
  if (!fits(adj, noun)) {
    const ok = nouns.filter(n => fits(adj, n));
    if (ok.length) noun = pk(ok);
    else { const pairs = adjs.flatMap(a => nouns.filter(n => fits(a, n)).map(n => [a, n])); if (pairs.length) [adj, noun] = pk(pairs); }
  }
  let qual = r() < NAME_QUAL_P ? pk(c.qual || NAME_QUAL) : '';
  if ([adj, noun, base].some(x => nameClash(qual, x))) qual = '';
  const common = [qual, adj, noun, base].filter(Boolean).join(' ');

  return { genus, species, common, binomial: genus + ' ' + species };
}

function generateInsectDetailed(seed, opts) {

  // construction; pass 2's own (a mesh order's sig counts its cells and a ladder its rungs, which the pitch floor
  // coarsens) stay on meta.device, where tests/check.js asserts the device venation on its own numbers
  r.meta.device.wingSig = r.meta.wingSig;

  // section adds to C what later ones need (layoutBody: P, B, thorax, abdomen ...) and draws into L / meta.
  const C = { seed, dev, replay, type, order, L, meta, outerBox: null };
  // per-part bounding boxes (right half, body coordinates) so a single part can be cropped out
  const partStart = () => { C.outerBox = bbox; bbox = freshBox(); };
  const partEnd = name => {
    const outerBox = C.outerBox;
    meta.partBox[name] = bbox;
    bbox = { minX: Math.min(outerBox.minX, bbox.minX), maxX: Math.max(outerBox.maxX, bbox.maxX), minY: Math.min(outerBox.minY, bbox.minY), maxY: Math.max(outerBox.maxY, bbox.maxY) };
  };

  C.P = rollProportions(type);
  layoutBody(C);
  partStart(); drawAbdomen(C); partEnd('abdomen');
  partStart(); drawThorax(C); drawHead(C); partEnd('head');
  drawTegulae(C);
  partStart(); drawLegs(C); partEnd('legs');
  partStart(); order.wings(C); partEnd('wings');
  partStart(); drawAntennae(C); partEnd('antennae');   // after the wings since #6: the pose is checked against their outlines
  return assemblePlate(C);
}

// ---------- proportions ----------
// The per-order size table and the family pick live in the registry (ORDERS[type].proportions); this rolls the
// order's entry into a fresh P.
function rollProportions(type) {
  const P = { variant: null, fam: null, abdOverlap: 8 };   // fam: the wing family for winged orders (read by the wing block), a body family for beetles and grasshoppers
  ORDERS[type].proportions(P);
  return P;
}

// ---------- body genes + layout ----------
// Rolls the body genes right after the proportions (rng order), lays the thorax and abdomen out, and records the
// forewing / hindwing roots on meta; adds B, thorax, abdomen, abdHW, headTop, headCy to C.
function layoutBody(C) {
  const { type, order, P, meta } = C;
  meta.variant = P.variant;
  const B = rollBodyGenes(type, P);
  meta.antenna = B.ant.kind;
  meta.recipe = P.fam;
  meta.fam = P.fam;   // the family as rolled (wing family of a winged order, body family of a beetle or grasshopper), for tests/check.js; the moth block overwrites recipe, never fam; the damselfly wing block sets it (its antenodal family, #17)
  meta.bodyGenes = B;
  P.abdAnchors = B.abd.anchors; P.abdW *= B.abd.wK;
  P.thoraxAnchors = B.thorax.anchors;
  // organic irregularity on profiles
  const wobble = a => a.map(([t, f]) => [t, f === 0 ? 0 : f * jitter(0.03)]);
  P.thoraxAnchors = wobble(P.thoraxAnchors);
  P.abdAnchors = wobble(P.abdAnchors);
  const headTop = 0, headCy = P.headH / 2;
  const thorax = bodyPart(P.headH * 0.8, P.thoraxLen, P.thoraxW / 2, P.thoraxAnchors);
  const abdomen = bodyPart(thorax.yBot - P.abdOverlap, P.abdLen, P.abdW / 2, P.abdAnchors);
  const abdHW = P.abdW / 2;
  // forewing / hindwing root positions along the thorax (the registry's; the wing block and the tegula read the same entry)
  meta.thorax = { yTop: thorax.yTop, yBot: thorax.yBot, wingRoots: order.wingRoots.map(t => prothoraxT(B.thorax, t)), profile: [], scutellum: [] };   // on the pterothorax behind a rolled pronotum (#51)
  for (let y = thorax.yTop; y < thorax.yBot; y += 2) meta.thorax.profile.push([Math.round(y * 10) / 10, Math.round(thorax.hwAt(y) * 10) / 10]);
  meta.thorax.profile.push([Math.round(thorax.yBot * 10) / 10, Math.round(thorax.hwAt(thorax.yBot - 0.05) * 10) / 10]);
  Object.assign(C, { B, thorax, abdomen, abdHW, headTop, headCy });
}

// ---------- abdomen + details ----------
const ABD_PITCH_PX = 3;   // #15: plate px between neighbouring marks inside an abdominal segment, and the abdomen's hatch pitch floor, at plate scale
const ABD_MEMBRANE_DY = 1.6;   // body units from a segment line down to its doubled membrane line (one joint, not a pair of marks)
const ABD_STEP_DY = 0.1, ABD_STEP_MAX = 400;   // the markings' walk to the next line clear of the floor: step (body units) and step count
// the kinds of transverse mark meta.abdMarks records per segment (tests/check.js reads them as these strings)
const ABD_MARK = Object.freeze({ EDGE: 'edge', MEMBRANE: 'membrane', CURVE: 'curve', HATCH: 'hatch', TICK: 'tick' });
function drawAbdomen(C) {
  const { L, P, B, abdomen } = C;
  L.abdomen.push(pathEl(abdomen.path, SW.O, '#fff'));
  {
    const A = B.abd, n = A.seg, startT = A.startT, bow = A.bow;
    const ys = [];
    for (let i = 0; i <= n; i++) ys.push(abdomen.yAt(startT + (1 - startT) * i / n));
    // Segment lines, optionally doubled (intersegmental membrane). Each segment keeps the lines drawn at its ends as
    // marks ({ y at the rim, mid: the bowed line's y on the midline, k: the ABD_MARK kind }) for the markings below.
    const midAt = (y, hwBow) => y + 0.75 * hwBow * bow;   // a bowLine's midpoint (both control points sit at y + bow)
    const edges = []; for (let i = 0; i < n; i++) edges.push([]);
    for (let i = 1; i < n; i++) {
      const y = ys[i], hw = abdomen.hwAt(y);
      if (hw < 2) continue;
      L.abdomen.push(bowLine(y, hw - 0.5, hw * bow, A.sw));
      const e = { y, mid: midAt(y, hw), k: ABD_MARK.EDGE }; edges[i - 1].push(e); edges[i].push(e);
      if (A.double && hw > 5) { L.abdomen.push(bowLine(y + ABD_MEMBRANE_DY, hw - 1.5, hw * bow, SW.F)); edges[i].push({ y: y + ABD_MEMBRANE_DY, mid: midAt(y + ABD_MEMBRANE_DY, hw), k: ABD_MARK.MEMBRANE }); }
    }
    // The markings are drawn at plate scale (#15): the genes are in body units but the plate scale runs 0.55-1.3, so one
    // deferred element, resolved by assemblePlate once the scale is known, holds every mark inside a segment (segment
    // lines, plain curves, the banded / tip-dark hatch, side ticks or pile) ABD_PITCH_PX plate px from its neighbours,
    // at the rim and on the midline (the lines bow), and keeps the families apart: the ticks stop short of the plain
    // curves, and a hatched segment draws none (they interleave at the rim into a crosshatch, as on the damselfly's
    // S1-S4). The spot and stripe hatch take the same pitch floor. meta.abdMarks records what was drawn for
    // tests/check.js (abdPitch). No rng is drawn here, so nothing outside the block moves.
    const meta = C.meta, marks = meta.abdMarks = { segs: [], pitches: [] };
    // The plate fit and the abdomen's part box are what the layout drawn before #15 gave: legacyMarksBox() replays its
    // bb() calls and draws nothing. layout(s) then draws at the real scale, after the fit (assemblePlate stops the bbox
    // first), and every mark it draws lies inside the outline.
    const legacyMarksBox = () => {
      const fp = v => Math.max(v, pitchFloor);   // floorPitch without recording: layout(s) records the drawn pitches
      for (let i = 0; i < n; i++) {
        const y0 = ys[i], y1 = ys[i + 1], segH = y1 - y0;
        const banded = A.mark === 'banded' && i % A.band.period === A.band.phase;
        const dark = A.mark === 'tipdark' && i >= n - A.tipDark;
        if (banded || dark) { const sp = fp(banded ? A.band.spacing : 2.6); for (let y = y0 + 3; y < y1 - 2; y += sp) { const hw = abdomen.hwAt(y) - 2; if (hw > 2) bowLine(y, hw, hw * bow, SW.F); } }
        else if (A.mark !== 'hairy' || segH > 10) {
          const k = Math.min(A.mark === 'striped' ? 1 : 3, Math.floor(segH / 4)), sp = fp(3);
          for (let j = 1; j <= k; j++) { const y = y1 - j * sp, hw = abdomen.hwAt(y) - 3; if (hw > 3 && y > y0 + 1) bowLine(y, hw, hw * bow, SW.F); }
        }
        if (A.mark === 'spotted' && i % A.spot.every === 0 && i > 0 && segH > 7) {
          const yc = (y0 + y1) / 2, hw = abdomen.hwAt(yc), rx = Math.max(2, hw * A.spot.rx), ry = Math.min(rx, segH * 0.28);
          if (hw * A.spot.pos + rx < hw - 1.5) for (const sgn of [-1, 1]) {
            const c = [sgn * hw * A.spot.pos, yc];
            ellipsePath(c, rx, ry, 0);
            for (let dy = -ry + 2, sp = fp(2.2); dy < ry - 1; dy += sp) { const w = rx * Math.sqrt(Math.max(0, 1 - (dy / ry) * (dy / ry))) - 0.8; if (w > 0.8) lineEl([c[0] - w, c[1] + dy], [c[0] + w, c[1] + dy], SW.F); }
          }
        }
        if (A.mark === 'hairy' || A.ticks) {
          const tk = A.mark === 'hairy' ? A.hair : A.ticks;
          for (let y = y0 + 4, sp = fp(tk.spacing); y < y1 - 3; y += sp) { const hw = abdomen.hwAt(y); if (hw > 6) for (const sgn of [-1, 1]) lineEl([sgn * (hw - 1), y], [sgn * (hw - tk.len), y + 0.6], SW.F); }
        }
      }
      if (A.mark === 'striped') {
        const yA = ys[0] + 3, yB = ys[n] - 4, wide = abdomen.hwAt(abdomen.yAt(A.peak)) > 18;
        const ks = A.stripe.n === 1 ? [0] : A.stripe.n === 2 ? [A.stripe.k] : wide ? [A.stripe.k, A.stripe.k * 0.5] : [A.stripe.k];
        for (const k of ks) for (const sgn of (k === 0 ? [1] : [-1, 1])) {
          const pts = []; for (let y = yA; y <= yB; y += 6) pts.push([sgn * k * (abdomen.hwAt(y) - 2), y]);
          if (pts.length > 2) { smoothPath(pts, false); if (A.stripe.hatch && wide) smoothPath(pts.map(p => [p[0] + sgn * 2.2, p[1]]), false); }
        }
      }
    };
    // layout(s) lays the marks out at plate scale s (assemblePlate calls it once) and records them on meta.abdMarks
    const layout = s => {
      const out = [], Pf = ABD_PITCH_PX / s;                 // the floor in body units
      marks.segs = []; marks.pitches = [];
      const line = (y, inset) => { const hw = abdomen.hwAt(y) - inset; return { y, hw, mid: midAt(y, hw) }; };
      // the next line at or past y (dir +1 down, -1 up) whose midline is Pf from prev's too: walked ABD_STEP_DY at a
      // time, at most ABD_STEP_MAX steps (40 body units, past any segment, so a runaway walk ends at the segment's end test)
      const step = (prev, y, inset, dir) => { let c = line(y, inset); for (let g = 0; prev && prev.mid !== null && dir * (c.mid - prev.mid) < Pf && g < ABD_STEP_MAX; g++) c = line(y += dir * ABD_STEP_DY, inset); return c; };
      const far = (a, b) => b.y - a.y >= Pf - 1e-9 && (a.mid === null || b.mid === null || b.mid - a.mid >= Pf - 1e-9);   // a above b by the floor at the rim and on the midline
      for (let i = 0; i < n; i++) {
        const y0 = ys[i], y1 = ys[i + 1], segH = y1 - y0, seg = edges[i].slice();
        // the last line at the segment's top (its segment line, or the membrane line under it) and the line at its end
        const sStart = edges[i].filter(e => e.y < y0 + ABD_MEMBRANE_DY + 0.01).pop() || null, sEnd = edges[i].find(e => e.y > y1 - 0.01) || null;
        const push = (c, k) => { out.push(bowLine(c.y, c.hw, c.hw * bow, SW.F)); const m = { y: c.y, mid: c.mid, k }; seg.push(m); return m; };
        const banded = A.mark === 'banded' && i % A.band.period === A.band.phase;
        const dark = A.mark === 'tipdark' && i >= n - A.tipDark;
        let firstCurve = null;
        if (banded || dark) {   // hatched band: bowed lines across the segment
          const sp = floorPitch(Math.max(banded ? A.band.spacing : 2.6, Pf));
          let prev = sStart, y = Math.max(y0 + 3, sStart ? sStart.y + Pf : -Infinity);
          for (;;) {
            const c = step(prev, y, 2, 1);
            if (!(c.y < y1 - Math.max(2, Pf)) || (sEnd && !far(c, sEnd))) break;
            if (banded && A.band.part && prev !== sStart && c.y > y0 + segH * A.band.part) break;   // the basal part of a tergite only (#24), never less than one line
            if (c.hw > 2) prev = push(c, ABD_MARK.HATCH);
            y = c.y + sp;
          }
        } else if (A.mark !== 'hairy' || segH > 10) {   // plain: fine curves parallel to the boundary (one only under stripes, or they read as a grid)
          const k = Math.min(A.mark === 'striped' ? 1 : 3, Math.floor(segH / 4)), sp = floorPitch(Math.max(3, Pf));
          let prev = sEnd, y = y1 - sp;
          for (let j = 1; j <= k; j++) {
            const c = step(prev, y, 3, -1);
            if (!(c.y > y0 + 1) || (sStart && !far(sStart, c))) break;
            if (c.hw > 3) prev = firstCurve = push(c, ABD_MARK.CURVE);
            y = c.y - sp;
          }
        }
        if (A.mark === 'spotted' && i % A.spot.every === 0 && i > 0 && segH > 7) {   // one hatched spot per side per segment
          const yc = (y0 + y1) / 2, hw = abdomen.hwAt(yc), rx = Math.max(2, hw * A.spot.rx), ry = Math.min(rx, segH * 0.28);
          if (hw * A.spot.pos + rx < hw - 1.5) {
            const sp = floorPitch(Math.max(2.2, Pf));
            marks.pitches.push(['spot hatch', sp]);
            for (const sgn of [-1, 1]) {
              const c = [sgn * hw * A.spot.pos, yc];
              out.push(pathEl(ellipsePath(c, rx, ry, 0), SW.D, '#fff'));
              for (let dy = -ry + Math.max(2, Pf); dy < ry - Math.max(1, Pf); dy += sp) { const w = rx * Math.sqrt(Math.max(0, 1 - (dy / ry) * (dy / ry))) - 0.8; if (w > 0.8) out.push(lineEl([c[0] - w, c[1] + dy], [c[0] + w, c[1] + dy], SW.F)); }
            }
          }
        }
        if ((A.mark === 'hairy' || A.ticks) && !(banded || dark)) {   // side ticks (pilosity), ahead of the plain curves
          const tk = A.mark === 'hairy' ? A.hair : A.ticks, sp = floorPitch(Math.max(tk.spacing, Pf));
          const yEnd = Math.min(y1 - Math.max(3, Pf), firstCurve ? firstCurve.y - Pf + 1e-9 : Infinity);
          for (let y = Math.max(y0 + 4, sStart ? sStart.y + Pf : -Infinity); y < yEnd; y += sp) {
            const hw = abdomen.hwAt(y);
            if (hw > 6) { seg.push({ y, mid: null, k: ABD_MARK.TICK }); for (const sgn of [-1, 1]) out.push(lineEl([sgn * (hw - 1), y], [sgn * (hw - tk.len), y + 0.6], SW.F)); }
          }
        }
        marks.segs.push(seg);
      }
      if (A.mark === 'striped') {   // longitudinal dark lines following the profile: a median line, or one / two pairs; hatched only on broad abdomens
        const yA = ys[0] + 3, yB = ys[n] - 4, wide = abdomen.hwAt(abdomen.yAt(A.peak)) > 18, off = Math.max(2.2, Pf);
        const ks = A.stripe.n === 1 ? [0] : A.stripe.n === 2 ? [A.stripe.k] : wide ? [A.stripe.k, A.stripe.k * 0.5] : [A.stripe.k];
        for (const k of ks) for (const sgn of (k === 0 ? [1] : [-1, 1])) {
          const pts = []; for (let y = yA; y <= yB; y += 6) pts.push([sgn * k * (abdomen.hwAt(y) - 2), y]);
          if (pts.length > 2) {
            out.push(pathEl(smoothPath(pts, false), SW.D));
            if (A.stripe.hatch && wide) { const sp = floorPitch(off); marks.pitches.push(['stripe hatch', sp]); out.push(pathEl(smoothPath(pts.map(p => [p[0] + sgn * sp, p[1]]), false), SW.F)); }
          }
        }
      }
      return out;
    };
    legacyMarksBox();
    L.abdomen.push(layout);
    if (A.keel && !(A.mark === 'striped' && A.stripe.n === 1)) L.abdomen.push(lineEl([0, abdomen.yTop + 4], [0, abdomen.yBot - 6], SW.F));   // dorsal keel / mid line
    // terminalia
    const tipY = abdomen.yBot;
    if (A.ovipositor) {
      const o = A.ovipositor;
      if (o.valves) { for (const sgn of [-1, 1]) L.abdomen.push(pathEl(cubicBezierPath([[sgn * 1.5, tipY - 4], [sgn * 2.5, tipY + o.len * 0.4], [sgn * 2, tipY + o.len * 0.8], [sgn * 0.6, tipY + o.len]], false), SW.D)); }
      else {
        const pts = shaftPoints([0, tipY - 2], 90, o.len, o.curve, 8);
        L.abdomen.push(pathEl(smoothPath(pts, false), SW.D));
        if (o.sheath) for (const sgn of [-1, 1]) L.abdomen.push(pathEl(smoothPath(pts.slice(0, 6).map(p => [p[0] + sgn * 1.3, p[1]]), false), SW.F));
      }
    }
    if (A.cerci) for (const sgn of [-1, 1]) L.abdomen.push(lineEl([sgn * 2.5, tipY - 5], [sgn * A.cerci.spread, tipY - 5 + A.cerci.len], SW.D));
    if (A.filaments && A.filaments.n === 3) L.abdomen.push(pathEl(smoothPath(shaftPoints([0, tipY - 2], 90, P.abdLen * A.filaments.len * 0.95, 0, 6), false), SW.D));   // middle tail filament
    if (A.appendages) for (const sgn of [-1, 1]) L.abdomen.push(lineEl([sgn * 2, tipY - 4], [sgn * A.appendages.spread, tipY - 4 + A.appendages.len], SW.D));
  }
}

// ---------- thorax ----------
function drawThorax(C) {
  const { L, meta, B, thorax } = C;
  L.thoraxHead.push(pathEl(thorax.path, SW.O, '#fff'));
  {
    // Everything here reads B.thorax (rolled in rollBodyGenes from docs/research-thorax.md). Order: surface (hatching,
    // punctation, vittae, pile) first, then the sclerite lines, then the scutellum with a white mask over the surface,
    // then the small sclerites (calli, patagia, foveae).
    const T = B.thorax, t0 = thorax.yTop, len = thorax.length, yBot = thorax.yBot, yAt = thorax.yAt, hwAt = thorax.hwAt;
    const TH = L.thoraxHead, both = f => { f(-1); f(1); };
    const maskEl = d => '<path d="' + d + '" fill="#fff" stroke="none"/>';
    // y offset of bowLine's curve at |x| (bisection on its bezier), so shapes can sit on a bowed suture
    const bowYAt = (hw, b, x) => { let lo = 0, hi = 1; for (let i = 0; i < 24; i++) { const s = (lo + hi) / 2, u = 1 - s, xx = hw * (-u * u * u - 1.05 * u * u * s + 1.05 * u * s * s + s * s * s); if (xx < x) lo = s; else hi = s; } const s = (lo + hi) / 2; return 3 * b * s * (1 - s); };
    const scutY = T.scut && T.scut.shape !== 'triangle' ? yAt(T.scut.t0) : yBot;   // nothing on the scutum runs past the scutellum
    // ---- surface ----
    if (T.hatch) {   // contour hatching: nested fine lines parallel to each side, shortening inward, the dorsal highlight left white
      const hsp = floorPitch(T.hatch.spacing);
      for (let k = 1; k <= T.hatch.n; k++) both(s => {
        const a = 0.1 + 0.12 * k, b = Math.min(0.92 - 0.1 * k, (scutY - t0) / len - 0.03), pts = [];
        for (let t = a; t <= b; t += 0.05) { const y = yAt(t), hw = hwAt(y) - k * hsp - 0.8; if (hw > 3) pts.push([s * hw, y]); }
        if (pts.length > 2) TH.push(pathEl(smoothPath(pts, false), SW.F));
      });
    }
    if (T.bead) both(s => {   // lateral bead of the beetle pronotum: one fine line just inside the margin
      const pts = []; for (let t = 0.08; t <= 0.94; t += 0.05) { const y = yAt(t), hw = hwAt(y) - 1.8; if (hw > 3) pts.push([s * hw, y]); }
      TH.push(pathEl(smoothPath(pts, false), SW.F));
    });
    if (T.punct) {   // punctation: dots on a staggered grid over the disc, the median line kept clear; coarse = sides only, denser
      const sp = floorPitch(T.punct.coarse ? T.punct.spacing * 0.75 : T.punct.spacing);
      let row = 0;
      for (let y = t0 + len * 0.12; y < Math.min(yBot, scutY) - 3; y += sp, row++) {
        const hw = hwAt(y) - Math.max(2.5, hwAt(y) * 0.12);
        for (let x = -hw + (row % 2) * sp / 2, col = 0; x <= hw; x += sp, col++) {
          if (T.median && Math.abs(x) < 2.2) continue;
          if (T.punct.coarse && Math.abs(x) < hw * 0.45) continue;
          const jx = ((row * 7 + col * 13) % 9 - 4) / 9 * sp * 0.35, jy = ((row * 5 + col * 11) % 7 - 3) / 7 * sp * 0.3;   // deterministic jitter breaks the grid
          TH.push(circleEl([x + jx, y + jy], T.punct.r, SW.F));
        }
      }
    }
    if (T.bands) {   // vittae: 2 or 4 longitudinal hatched strips between fine edges, optionally broken at the transverse suture
      const yA = yAt(T.lines[0].t) + 2, yB = scutY - 2.5, ts = yAt(T.lines[1].t);
      for (const k of (T.bands.n === 2 ? [T.bands.x1] : [T.bands.x1, T.bands.x2])) both(s => {
        const edge = d => { const pts = []; for (let y = yA; y <= yB; y += 4) pts.push([s * (k + d) * hwAt(y), y]); pts.push([s * (k + d) * hwAt(yB), yB]); return pts; };
        TH.push(pathEl(smoothPath(edge(-T.bands.w / 2), false), SW.F), pathEl(smoothPath(edge(T.bands.w / 2), false), SW.F));
        for (let y = yA + 1.5, bsp = floorPitch(T.bands.spacing); y < yB; y += bsp) {
          if (T.bands.interrupted && Math.abs(y - ts) < 3) continue;
          const hw = hwAt(y); TH.push(lineEl([s * ((k - T.bands.w / 2) * hw + 0.4), y], [s * ((k + T.bands.w / 2) * hw - 0.4), y], SW.F));
        }
      });
    }
    if (T.pile) {   // hair-like scales: ticks inward along the edge, optionally scattered over the disc too
      const psp = floorPitch(T.pile.spacing);
      for (let y = t0 + 5; y < yBot - 4; y += psp) { const hw = hwAt(y); if (hw > 5) both(s => TH.push(lineEl([s * (hw - 0.5), y], [s * (hw - T.pile.len), y + 1.2], SW.F))); }
      if (T.pile.interior) {
        let row = 0;
        for (let y = t0 + len * 0.2; y < yBot - 6; y += psp * 2.2, row++) {
          const hw = hwAt(y) - T.pile.len - 3, off = (row * 0.37) % 1;
          for (let x = -hw + off * psp * 3; x < hw; x += psp * 3) TH.push(lineEl([x, y], [x + (x < 0 ? -1 : 1) * T.pile.len * 0.5, y + T.pile.len * 0.45], SW.F));
        }
      }
    }
    // ---- sclerite lines ----
    for (const l of T.lines) {
      const y = yAt(l.t), hw = hwAt(y);
      if (hw < 3) continue;

// ---------- head ----------
// The weevil's rostrum seen from above (G = B.head.rostrum, head width W, depth H): its right side as one cubic Bezier
// from its root inside the capsule to the tip (the tube is drawn straight: its curvature is lateral). No rng: drawHead
// draws the tube from it and rostrumPoint finds the antennal insertion on it.
function rostrumSide(G, W, H, headTop) {
  const len = G.len * W, w = G.w * W / 2, tip = headTop - len;
  return [[w, headTop + H * 0.3], [w * 0.9, headTop - len * 0.45], [w * 0.8, tip + len * 0.3], [w * 0.7, tip]];

  for (let k = 0; k < 40; k++) { const m = (lo + hi) / 2; if (bez3(c, m)[1] > y) lo = m; else hi = m; }

function drawHead(C) {
  const { type, order, L, meta, P, B, headTop, headCy } = C;

  // capsule covers their roots, then the eyes, ocelli and face markings. Orders whose pronotum overlaps the back of the
  // head (beetle, grasshopper, cicada) get the head inserted under the thorax path.

    // --- mouthparts and projections in front of the capsule ---

      HE.push(lineEl([0, headTop - len * 0.3], [0, tip + len * 0.12], SW.F));   // dorsal carina
      for (const s of [-1, 1]) HE.push(lineEl([s * w * 0.35, tip - w * 0.3], [s * w * 0.15, tip - w * 0.3 - G.mand.len * W], SW.D));
    }
    if (G.mand && !G.rostrum) {   // prognathous mandibles (head-col-carabus, #25): stout sickles from the front corners that run
      // forward and hook inward to tips at the midline (crossing on some ground beetles), leaving an open space between the
      // jaws where the transverse labrum shows; never a closed leaf

      }

    }
    if (G.palps) {   // maxillary / labial palps: beaded rods sticking forward beside the mouth

        let p = [x0, y0];

      let n = G.bump.striae; while (n > 0 && span / (n + 1) < pitchFloor) n--;   // a device plate draws fewer ridges rather than closer ones

    }
    if (G.furrow) {   // frontal furrows (ground beetle) or the fastigium furrow (grasshopper)

    }

    const drawEyes = E => {
      for (const s of [-1, 1]) {

// ---------- tegulae over the forewing roots ----------
function drawTegulae(C) {
  const { order, L, B, thorax, meta } = C;
  if (B.thorax.tegula) {
    const G = B.thorax.tegula, ty = thorax.yAt(meta.thorax.wingRoots[0]), rootX = thorax.hwAt(ty) * order.wingRootX;   // the forewing root, the same entry fields the wing block reads
    const c = [rootX + G.rx * 0.3, ty];
    L.tegulae.push(pathEl(ellipsePath(c, G.rx, G.rx * G.k, G.tilt), SW.D, '#fff'));
    for (let i = 0; i < G.hairs; i++) {   // lepidopteran tegulae are beset with hair-like scales on their outer edge
      const a = (G.tilt - 70 + i * 140 / Math.max(1, G.hairs - 1)) * D2R, p = [c[0] + Math.cos(a) * G.rx * 0.95, c[1] + Math.sin(a) * G.rx * G.k * 0.95];
      L.tegulae.push(lineEl(p, [p[0] + Math.cos(a) * 3, p[1] + Math.sin(a) * 3], SW.F));
    }

}

// ---------- legs ----------
function drawLegs(C) {

  {

    // tucked folds the tibiae tight under the femora; raised lifts the forelegs toward the head (mantid-like);
    // basket is the odonate prey basket, all legs forward.
    // tib is the tibia's absolute direction (so it can never swing in across the body); fold is relative to the femur.
    const LEG_POSES = {
      spread:  [{ F: [-62, -32], tib: [-118, -82], T: [-22, -6] }, { F: [-15, 8], tib: [35, 70], T: [10, 28] }, { F: [22, 48], tib: [75, 105], T: [8, 22] }],
      walking: [{ F: [-75, -48], tib: [-115, -88], T: [-18, -4] }, { F: [-5, 18], tib: [55, 88], T: [8, 25] }, { F: [45, 65], tib: [72, 105], T: [5, 20] }],
      tucked:  [{ F: [-50, -28], tib: [-130, -100], T: [-22, -8] }, { F: [-12, 10], tib: [60, 95], T: [12, 30] }, { F: [35, 65], tib: [80, 110], T: [10, 28] }],
      raised:  [{ F: [-88, -64], fold: [125, 160], T: [5, 25] }, { F: [-15, 8], tib: [35, 70], T: [10, 28] }, { F: [22, 48], tib: [75, 105], T: [8, 22] }],   // mantid fold: tibia back along the femur
      basket:  [{ F: [-66, -45], tib: [-128, -100], T: [-15, -4] }, { F: [-35, -15], tib: [-110, -85], T: [-15, -4] }, { F: [-16, 2], tib: [-95, -70], T: [-18, -6] }],
    };
    const safeDirs = isOdo ? [[-60, -55, -120, -130], [-30, -25, -95, -105], [-12, -8, -75, -90]] : [[-50, -45, -105, -120], [-10, -5, 50, 70], [25, 35, 85, 100]];
    const attachOf = g => { const y = thorax.yAt(g.t), hw = thorax.hwAt(y); return { y, hw, p: [hw - Math.min(g.inset, hw * 0.45), y] }; };

        widths: [[6, 5], [7 * g.swell, 5], [5, 3.2 * g.flare], [3, 1.8]].map(w => [w[0] * wk, w[1] * wk]),
        curl: g.curl, tarsomeres: g.tarsomeres, bowSign: g.bowSign, spines: g.spines, spurs: g.spurs, spurLen: g.spurLen, spursOuter: g.spursOuter,
        fringe: g.fringe, pulvilli: g.pulvilli, padK: g.padK, clawK: g.clawK, herringbone: g.herringbone, femurTeeth: g.femurTeeth, shade: g.shade, corbicula: g.corbicula,
      };
      if (g.femStout) { spec.widths[1] = [spec.lens[1] / g.femStout, 6 * wk]; spec.stout = true; }   // a swollen femur (cicada foreleg): the drumstick profile at this depth
      if (g.femFrac) {   // saltatorial femur: deepest width as a fraction of its own final length, and never under 1.9x the mid femur's width (the jumping leg must read as the big one), nor stouter than 3.7x
        const midW = 7 * B.legs[1].swell * wk0 * B.legs[1].wk;
        spec.widths[1] = [Math.min(spec.lens[1] / 3.7, Math.max(spec.lens[1] * g.femFrac, 1.9 * midW)), 6 * wk];

      const F = randRange(R.F[0], R.F[1]), tib = R.tib ? randRange(R.tib[0], R.tib[1]) : F + randRange(R.fold[0], R.fold[1]), T = randRange(R.T[0], R.T[1]);

    // line, no femur tip / tibia / tarsus inside the abdomen outline below the thorax, no two legs within a femur
    // width of each other, and the legs alone must not push the plate scale under 0.62 (wings come later).
    const halfW = (sp, k) => (k <= 1 ? sp.widths[0][0] : k === 2 ? sp.widths[1][0] : k === 3 ? Math.max(sp.widths[2][0], sp.widths[2][1]) : sp.widths[3][0]) / 2;   // half width of joint segment k
    // ahead of the head a leg also stays off the antenna socket by the antenna clearance (#7: ANT_CLEAR + both half
    // widths, the antenna's at its base width) plus ANT_LEAN for the lean of a near-straight shaft, or no antenna pose
    // could clear it; the odonate basket is exempt like the midline rule below (a bristle antenna beside a wide head)
    const antX = P.headW * B.ant.socket[0] + (ANT_CLEAR + ANT_LEAN) + antBaseW(P.headW, B.ant.wK) / 2;
    const legsOk = (joints, specs) => {
      const fy = joints.map(j => j[3][1]);
      if (!(fy[0] < fy[1] && fy[1] < fy[2])) return 'order';
      let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
      for (const j of joints) for (const p of j) { minX = Math.min(minX, p[0]); maxX = Math.max(maxX, p[0]); minY = Math.min(minY, p[1]); maxY = Math.max(maxY, p[1]); }
      for (let i = 0; i < 3; i++) for (let k = 0; k < joints[i].length; k++) {   // nothing on the mirror line; forelegs stay apart in front of the head
        const p = joints[i][k], need = halfW(specs[i], Math.max(1, k)) + 2;
        if (p[0] < (p[1] < 0 && !isOdo ? Math.max(need, P.headW * 0.3) : need)) return 'midline';   // the odonate basket is tiny beside its wide head
        if (p[1] < 0 && !isOdo && p[0] < antX + halfW(specs[i], Math.max(1, k))) return 'socket';
      }
      if (!isOdo) for (let i = 0; i < 3; i++) for (let k = 2; k + 1 < joints[i].length; k++) {   // and where a segment crosses the head top
        const a = joints[i][k], b = joints[i][k + 1];
        if ((a[1] < 0) !== (b[1] < 0) && lerpP(a, b, (0 - a[1]) / (b[1] - a[1]))[0] < antX + halfW(specs[i], k)) return 'socket';
      }
      for (let i = 0; i < 3; i++) for (let k = 3; k + 1 < joints[i].length; k++) {
        const j = joints[i], a = j[k], b = j[k + 1], n = Math.max(1, Math.ceil(vlen(sub(b, a)) / 3)), m = halfW(specs[i], k) + 3.5;
        for (let q = 0; q <= n; q++) { const p = lerpP(a, b, q / n); if (p[1] > thorax.yBot + 1 && p[0] < abdomen.hwAt(p[1]) + m) return 'abdomen'; }
      }
      for (let a = 0; a < 3; a++) for (let b = a + 1; b < 3; b++)
        for (let k = 2; k + 1 < joints[a].length; k++) for (let m = 2; m + 1 < joints[b].length; m++)   // femur onward; coxae and trochanters sit under the thorax
          if (segDist(joints[a][k], joints[a][k + 1], joints[b][m], joints[b][m + 1]) < halfW(specs[a], k) + halfW(specs[b], m) + 2.5) return 'cross';
      const W = 2 * Math.max(maxX + 6, P.abdW / 2, P.thoraxW / 2, P.headW / 2) + 2 * 24, H = Math.max(maxY + 6, abdomen.yBot + 10) - Math.min(minY - 6, -10) + 2 * 24;
      if (Math.min(552 / W, 507 / H) < 0.62) return 'fit';
      return null;
    };
    let specs, joints, why = null, lenK = 1, pose = B.pose, attempt = 0;
    const reasons = [];
    for (; attempt < 48; attempt++) {
      pose = attempt < 16 ? B.pose : attempt < 32 ? (isOdo ? 'basket' : 'spread') : 'safe';
      specs = []; joints = [];
      for (let i = 0; i < 3; i++) {
        specs[i] = makeSpec(i, pose === 'safe' ? (B.legs[i].safe || safeDirs[i]).slice() : rollDirs(i, pose), lenK);   // a gene's own fallback (bee hind leg, wide of the broad abdomen, #12)
        joints[i] = legJoints(attachOf(B.legs[i]).p, specs[i]);
      }
      why = legsOk(joints, specs);
      if (!why) break;
      reasons.push(why);
      if (why === 'fit') lenK *= 0.92;   // long-legged family on a long body: clamp the splay rather than the plate scale
    }
    // mirror skew: the left legs are the right legs rotated about their coxae (each pair its own angle) and then mirrored.
    // The rotated set must pass every rule the right side passed (midline, abdomen, crossings, fit): as rolled, else with
    // every angle reversed, else no skew.
    const pivots = B.legs.map(g => attachOf(g).p);
    const rotAbout = (p, c, deg) => add(c, rot(sub(p, c), deg * D2R));
    let skewK = 1;   // 1 as rolled, -1 the other way round, 0 none: the realised skew stays in 2-6 degrees or is dropped
    for (const kTry of [1, -1, 0]) {
      skewK = kTry;
      const rj = joints.map((j, i) => j.map(p => rotAbout(p, pivots[i], B.legs[i].skew * skewK)));

    const skews = B.legs.map(g => g.skew * skewK);
    for (let i = 0; i < 3; i++) for (const p of joints[i]) { const q = rotAbout(p, pivots[i], skews[i]); bb(q); bb([q[0] + 5, q[1] + 5]); bb([q[0] - 5, q[1] - 5]); }   // the rotated copy may reach further than the right side
    meta.legSkew = skews;
    meta.legRoll = { attempts: attempt + 1, pose, why, lenK, reasons, skewK };
    B.sig.push(pose, ...specs.map(sp => Math.round(sp.dirs[1] / 12) + ':' + Math.round((sp.dirs[2] - sp.dirs[1]) / 12)));
    const legMeta = [];
    L.legPairs = [];
    for (let i = 2; i >= 0; i--) {     // hind first so front overlaps
      const at = attachOf(B.legs[i]);
      const els = legEls(at.p, specs[i], legMeta);
      L.legs.push(...els);
      L.legPairs.push({ els, pivot: at.p, skew: skews[i] });

      lm.femW = Math.max(...lm.fem.widths); lm.femLen = lm.fem.L;   // as drawn: the outline's widest point and the trochanter-to-knee length
      lm.segHw = joints[i].slice(0, -1).map((_, k) => halfW(specs[i], k));   // half width of segment k -> k+1, for the antenna clearance rule (#7) and tests/check.js
    }
    legMeta.reverse();   // front, mid, hind
    meta.legs = legMeta;
    const prof = [];
    for (let y = abdomen.yTop; y <= abdomen.yBot; y += 2) prof.push([Math.round(y * 10) / 10, Math.round(abdomen.hwAt(y) * 10) / 10]);

  }
}

// ---------- antennae ----------
// Genes come from rollAntGenes (B.ant); only the pose is rolled here, because it is checked against the mirror line
// (no point at x < m, the left antenna being the mirror image), the plate (the antenna alone must not push the
// scale under 0.6), the legs wherever they reach ahead of the thorax, in every pose (#7: no centre-line of the antenna
// within 3 px + both half widths of a leg segment there, right legs and the skewed left set; beside the body the
// antenna lies over the legs as on a plate), and the wings (no point of the antenna inside a wing, elytron or tegmen
// outline, #6); a bad pose is re-rolled, then replaced by a known-good forward pose.
// docs/research-antennae.md R-A, R-C, R-D. Drawn after the legs and the wings so their geometry is known; the layer
// order in the assembly is unchanged (antennae on top).
function drawAntennae(C) {
  const { L, meta, outerBox, P, B, thorax, abdomen, headTop, order } = C;
  {
    const A = B.ant, R = A.poseR;
    const fit = order.antFit;   // the order's own antenna fit, if any (#23: a grasshopper's never shrinks the plate under 1.0, nor reaches past 1.3x the body box)
    const base = [P.headW * A.socket[0], headTop + P.headH * A.socket[1]];
    const ob = outerBox;   // everything drawn so far: body, legs and wings
    const wings = meta.wingOutlines = wingPolys;   // every outline makeWing (and the elytron) pushed for this plate, right side, body coordinates
    const wingsHw = Math.max(0, ...wings.map(poly => Math.max(...poly.map(p => p[0]))));   // the covers' half width, the bound of a back sweep's tip
    // leg segments reaching ahead of the thorax (#7): every leg from the femur on, in every pose (spread and walking
    // forelegs reach ahead of the head too), the right side and the skewed left set (each pair rotated about its coxa
    // by its skew before mirroring), each with its half width
    const legSegs = [];
    for (const lg of meta.legs) for (const deg of lg.skew ? [0, lg.skew] : [0]) {
      const pts = deg ? lg.pts.map(p => add(lg.pivot, rot(sub(p, lg.pivot), deg * D2R))) : lg.pts;
      for (let k = 2; k + 1 < pts.length; k++) if (Math.min(pts[k][1], pts[k + 1][1]) < thorax.yTop + 4) {
        if (!(lg.segHw[k] >= 0)) throw new Error('drawAntennae: ' + lg.pair + ' leg segment ' + k + ' has no half width');   // antOk would pass a NaN by silence
        legSegs.push({ a: pts[k], b: pts[k + 1], hw: lg.segHw[k] });
      }
    }
    const antOk = G => {
      const m = Math.max(0.5, G.w0 * 0.6);
      let maxX = 0, minY = Infinity, maxY = -Infinity;
      for (const p of G.pts) { if (p[0] < m) return 'cross'; maxX = Math.max(maxX, p[0]); minY = Math.min(minY, p[1]); maxY = Math.max(maxY, p[1]); }
      // fit: the antenna alone must not push the plate scale under 0.6. The box already holds the wings, which on a
      // broad-winged plate set a scale under 0.6 by themselves, so the antenna is blamed only where it extends that box.
      // An order with antFit holds its antenna to antFit.scale the same way, and within antFit.width times the box's
      // half width (the arc pose's hoop, #23)
      const hw0 = Math.max(Math.abs(ob.minX), ob.maxX);
      const W = 2 * Math.max(hw0, maxX) + 48, H = Math.max(ob.maxY, maxY) - Math.min(ob.minY, minY) + 48;
      const W0 = 2 * hw0 + 48, H0 = ob.maxY - ob.minY + 48;
      const sc = Math.min(552 / W, 507 / H), sc0 = Math.min(552 / W0, 507 / H0);
      if (sc < 0.6 && sc < sc0 - 1e-9) return 'fit';
      if (fit) {   // the order's own bound, at assemblePlate's scale (the 0.6 rule above counts the margins twice)
        const ps = (hw, h) => Math.min(552 / (2 * hw), 507 / h, 1.3);
        const scA = ps(Math.max(hw0, maxX), H - 48), scA0 = ps(hw0, H0 - 48);
        if (scA < fit.scale && scA < scA0 - 1e-9) return 'fit';
        if (maxX > fit.width * hw0) return 'fit';
      }
      for (const poly of wings) for (const p of G.pts) if (pointInPoly(p, poly)) return 'wing';   // the left side is the mirror image
      if (R.back && G.tip[0] > ANT_BACK_OUT * wingsHw) return 'wide';   // a back sweep ends beside the covers (#25), not out past the legs

      G = antennaGeom(A, base, P.headW, pose);
      why = antOk(G);
      if (!why) break;
      reasons.push(why);
      const prev = pose;
      // a leg or wing hit is sticky: from then on every attempt is forward and nearly straight (a swept or arched antenna
      // can only lie across them) and walks a few degrees further toward straight ahead each time. A plume or bristle
      // beside a foreleg standing next to the head has no clear pose at full length (a bipectinate plume is held off the
      // midline on one side and the leg on the other), so from the 5th attempt overall (counting every reason), once
      // straightened, a leg hit, or a midline cross of a plume, also shortens it (not under ANT_SHRINK.floor).
      const shrink = straight && attempt >= ANT_SHRINK.from && (why === 'legs' || (why === 'cross' && G.rami));
      pose = { ang: rr(R.ang), curve: rr(R.curve), droop: rr(R.droop), lenK: why === 'fit' ? prev.lenK * 0.92 : shrink ? Math.max(ANT_SHRINK.floor, prev.lenK * ANT_SHRINK.step) : prev.lenK };
      if (why === 'cross') { pose.curve = Math.abs(pose.curve); A.hookSide = 1; }
      if (R.back) {   // a sweep that leaves the head turned back (#25) is never straightened forward: a leg hit turns it further back
        // at the root (clear of the forelegs ahead of the thorax) and turns less after it, so its run beside the body keeps its
        // heading; a wing hit keeps the root and turns less (clear of the elytra), or once it barely turns, leaves the root further out;
        // a tip out past ANT_BACK_OUT of the covers' half width ('wide') turns back sooner
        // From half the attempts on, the pose's alt (R.alt): a steep root (clear of the forelegs) that turns outward (curve < 0)
        // past the elytral shoulders, the droop bringing the tip back beside the elytra. Searched on a fixed grid (no rng) for
        // the clear pose whose tip stays nearest the body, within ANT_BACK_OUT of the covers' half width; none, the fallback
        if (R.alt && attempt >= 11) {
          let best = null;
          for (let ang = R.alt.ang[0]; ang <= R.alt.ang[1] + 1e-9; ang += 5) for (let curve = R.alt.curve[0]; curve <= R.alt.curve[1] + 1e-9; curve += 5)
            for (let droop = R.alt.droop[0]; droop <= R.alt.droop[1] + 1e-9; droop += 10) {

        if (why === 'wide') { pose.ang = prev.ang; pose.curve = prev.curve + randRange(4, 10); }   // turn back sooner
        continue;

      if (ANT_HIT[why]) straight = true;
      if (straight) {   // back off a little from the midline after a cross, else on toward straight ahead (a fit or cross hit while straightened keeps the wing's bound)
        pose.ang = why === 'cross' ? Math.min(-45, prev.ang + randRange(5, 15)) : Math.max((ANT_HIT[why] || ANT_HIT.wing).minAng, Math.min(prev.ang, -45) - randRange(5, 20));
        if (why === 'fit' && fit) pose.ang = Math.min(prev.ang, ANT_FIT_FB.ang);   // #23: a fit hit only shortens; walking it toward the midline would lay the pair side by side

      }
    }
    if (why) {   // known-good fallback: ANT_HIT's pose after a leg or wing hit, else forward at 40 deg from the midline with a little
      // outward curve (the face pose keeps its angle); shortened, then after a leg hit shortened again (and angled back out of
      // the midline, for a plume) until it clears; antOk draws no rng
      // An order with antFit whose antenna still does not fit (a katydid's, longer than the body, #23) is laid forward
      // (ANT_FIT_FB) from full length and shortened until it fits, never curled into a stub.
      const fitFb = why === 'fit' && !!fit;
      const fb = R.back ? { ang: 75, curve: -45, droop: 30 } : fitFb ? ANT_FIT_FB : ANT_HIT[why] || { ang: -50, curve: A.pose === 'swept' ? 120 : A.pose === 'arc' ? 40 : 12 };
      pose = { ang: A.pose === 'face' ? -86 : fb.ang, curve: fb.curve, droop: fb.droop || 0, lenK: fitFb ? 1 : Math.min(pose.lenK, 0.8) };
      A.hookSide = 1; G = antennaGeom(A, base, P.headW, pose);
      for (let k = 0, r; k < (fitFb ? 3 : 1) * ANT_SHRINK.fbSteps && ((r = antOk(G)) === 'legs' || r === 'cross' || (r === 'fit' && fit) || ((r === 'wing' || r === 'wide') && R.back)); k++) {
        if (r === 'wing') pose.curve -= 6;   // a back sweep into the elytra turns further out after its root
        else if (r === 'wide') pose.droop += 6;   // ... and one ending out past the covers turns its tip back
        else if (r === 'legs') { pose.ang = R.back ? Math.min(80, pose.ang + 4) : Math.max(-90, pose.ang - 4); pose.lenK *= ANT_SHRINK.fbStep; } else if (r === 'fit') pose.lenK *= ANT_SHRINK.fbStep; else { pose.ang = Math.min(-45, pose.ang + 8); if (G.rami) pose.lenK *= ANT_SHRINK.fbStep; }

    B.sig.push(A.kind, A.club || '-', A.pose, Math.round(A.nSeg / 4), A.kind === 'lamellate' ? A.lamellae.n : (A.kind === 'pectinate' || A.kind === 'bipectinate') ? Math.round(A.rami.n / 6) : 0,
      Math.round(pose.ang / 10), Math.round(pose.curve / 15), Math.round(G.len / P.headW * 2), Math.round(A.socket[0] * 20));

  }
}

// ---------- wings / covers ----------
// One function per order, named by the registry entry's `wings` (the elytra and the orthopteran tegmen draw into `covers`).
// A block roots its wings at the entry's wingRoots and wingRootX (C.order), never at a literal t or x factor.

function wingsLepidoptera(C) {   // (type === 'moth')
  const { order, L, meta, P, B, thorax } = C;
  const isB = P.variant === 'butterfly';
  const fam = P.fam;
  meta.recipe = fam;
  // ---- wing-shape genes. The family biases the silhouette (rounded pierid, angular nymphalid, tailed

// compared side by side without the mirror doubling them.
const PARTS = ['wings', 'legs', 'antennae', 'head', 'abdomen', 'body'];
const PART_LAYERS = { wings: ['covers', 'wings', 'tegulae'], legs: ['legs'], antennae: ['antennae'], head: ['thoraxHead'], abdomen: ['abdomen'], body: ['abdomen', 'thoraxHead', 'tegulae', 'antennae'] };
const PART_BOXES = { wings: ['wings'], legs: ['legs'], antennae: ['antennae'], head: ['head'], abdomen: ['abdomen'], body: ['abdomen', 'head', 'antennae'] };
function generatePart(seed, type, part, size) {
  part = PARTS.includes(part) ? part : 'wings';
  size = size || 300;
  const r = generateInsectDetailed(seed, { type });
  const L = r.meta.layers, boxes = PART_BOXES[part].map(k => r.meta.partBox[k]).filter(b => b && b.minX < Infinity);
  if (!boxes.length) return { svg: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + size + ' ' + size + '"></svg>', meta: r.meta };
  const box = { minX: Math.min(...boxes.map(b => b.minX)), maxX: Math.max(...boxes.map(b => b.maxX)), minY: Math.min(...boxes.map(b => b.minY)), maxY: Math.max(...boxes.map(b => b.maxY)) };
  const margin = size * 0.05, bw = Math.max(1, box.maxX - box.minX), bh = Math.max(1, box.maxY - box.minY);
  const s = Math.min((size - 2 * margin) / bw, (size - 2 * margin) / bh);
  const tx = size / 2 - (box.minX + box.maxX) / 2 * s, ty = size / 2 - (box.minY + box.maxY) / 2 * s;
  let svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + size + ' ' + size + '" width="' + size + '" height="' + size + '">' +
    '<rect width="' + size + '" height="' + size + '" fill="#fff"/>' +
    '<g transform="translate(' + fmt(tx) + ' ' + fmt(ty) + ') scale(' + (Math.round(s * 1000) / 1000) + ')" stroke="#000" stroke-linecap="round" stroke-linejoin="round" fill="none">' +
    PART_LAYERS[part].map(k => '<g>' + L[k].join('') + '</g>').join('') + '</g></svg>';
  const sw = v => String(Math.round(v / s * 1000) / 1000);
  svg = svg.replace(/SW_H/g, sw(SW_PX.H)).replace(/SW_O/g, sw(SW_PX.O)).replace(/SW_D/g, sw(SW_PX.D)).replace(/SW_F/g, sw(SW_PX.F));
  return { svg, meta: Object.assign({}, r.meta, { part, partScale: s }) };
}

if (typeof module !== 'undefined' && module.exports) {
  module.exports = { generateInsect, generateInsectDetailed, generatePart, insectName, EPITHETS, dailySeed, brisbaneDay, hashString, mulberry32, TYPES, ORDERS, PARTS, DEVICE, SW_PX, CAPTION_H };
}
</script>

<script>
(function () {
  // One pane: the plate, its controls and a Back history. The URL hash carries the seed (#123). A two-seed
  // hash (#123|456, the old Compare link format) is handed to compare.html, which keeps that format.
  const HISTORY_MAX = 100;
  // A two-seed hash belongs to the compare page: hand it over (true) before drawing anything.
  const redirectTwoSeeds = () => {
    const h = location.hash.slice(1);
    if (!/^\d+\|\d+$/.test(h)) return false;
    location.replace('compare.html#' + h);
    return true;
  };
  if (redirectTwoSeeds()) return;

  const el = document.getElementById('panes');
  el.innerHTML = '<div class="pane"><div class="stage"></div><div class="controls">' +
    '<button class="back" disabled>Back</button>' +
    '<label>Seed <input class="seed" type="number" value="1" min="0" step="1"></label>' +
    '<button class="gen">Generate</button><button class="rnd">Random</button><button class="daily">Daily</button></div></div>';
  const q = c => el.querySelector('.' + c);
  const pane = { stage: q('stage'), seedInput: q('seed'), backBtn: q('back'), history: [], seed: null, meta: null };
  let hashLock = false;   // set while we write the hash ourselves (replaceState never fires hashchange, but keep it explicit)

  // render(seed) pushes the previously displayed seed onto the history; render(seed, false) renders
  // without recording (used by Back itself).
  pane.render = (seed, push = true) => {
    seed = Number(seed) >>> 0;
    if (push && pane.seed !== null && pane.seed !== seed) {
      pane.history.push(pane.seed);
      if (pane.history.length > HISTORY_MAX) pane.history.shift();
    }
    pane.seed = seed;
    pane.backBtn.disabled = pane.history.length === 0;
    pane.seedInput.value = seed;
    const r = generateInsectDetailed(seed);
    pane.stage.innerHTML = r.svg;
    pane.meta = r.meta;
    hashLock = true;
    history.replaceState(null, '', '#' + seed);
    hashLock = false;
    document.title = r.meta.name.binomial + ' \u00b7 insectdraw #' + seed;
  };
  pane.goBack = () => { if (pane.history.length) pane.render(pane.history.pop(), false); };

  pane.backBtn.addEventListener('click', pane.goBack);
  q('gen').addEventListener('click', () => pane.render(pane.seedInput.value));
  pane.seedInput.addEventListener('keydown', e => { if (e.key === 'Enter') pane.render(pane.seedInput.value); });
  q('rnd').addEventListener('click', () => pane.render(Math.floor(Math.random() * 4294967296)));
  q('daily').addEventListener('click', () => pane.render(dailySeed()));

  // #123 -> '123'; anything else -> null
  const parseHash = () => { const h = location.hash.slice(1); return /^\d+$/.test(h) ? h : null; };
  // External hash edits (a pasted #seed) render and are back-able; a pasted #a|b goes to the compare page.
  window.addEventListener('hashchange', () => {
    if (hashLock || redirectTwoSeeds()) return;
    const s = parseHash();
    if (s !== null && (Number(s) >>> 0) !== pane.seed) pane.render(s);
  });

  const initial = parseHash();
  if (initial !== null) pane.render(initial); else pane.render(dailySeed());
  window.render = pane.render;
  window.goBack = pane.goBack;
  window.pane = pane;
})();
</script>
