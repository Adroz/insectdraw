<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>insectdraw</title>
<style>
  html, body { margin: 0; background: #fff; color: #000; }
  body { font: 14px/1.4 Georgia, "Times New Roman", serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 12px 16px; box-sizing: border-box; }
  #stage { width: min(92vw, 600px); aspect-ratio: 1 / 1; }
  #stage svg { width: 100%; height: 100%; display: block; }
  .controls { display: flex; gap: 8px; align-items: center; margin: 14px 0 6px; flex-wrap: wrap; justify-content: center; }
  input, button { font: inherit; padding: 4px 10px; border: 1px solid #000; background: #fff; color: #000; border-radius: 0; }
  input { width: 10em; }
  button { cursor: pointer; }
  button:active { background: #000; color: #fff; }
  #info { font-size: 13px; letter-spacing: 0.02em; }
  #info i { font-style: italic; }
</style>
</head>
<body>
<div id="stage"></div>
<div class="controls">
  <label>Seed <input id="seed" type="number" value="1" min="0" step="1"></label>
  <button id="gen">Generate</button>
  <button id="rnd">Random</button>
  <button id="daily">Daily</button>
</div>
<div id="info"></div>

<script id="engine">
'use strict';
/* ============================================================
   insectdraw — procedural Victorian-style insect plates
   Everything below the UI block is pure generation: no DOM.
   Coordinates: body axis is x = 0, head at top (y increasing
   downward). The RIGHT half (x >= 0) is generated and mirrored.
   ============================================================ */

// ---------- PRNG (mulberry32) ----------
let rng = null;
function mulberry32(seed) {
  let a = seed | 0;
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function randRange(min, max) { return min + (max - min) * rng(); }
function randInt(min, max) { return Math.floor(randRange(min, max + 1)); }
function pick(arr) { return arr[Math.floor(rng() * arr.length)]; }
function jitter(k) { return 1 + randRange(-k, k); }
function hashString(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function dailySeed(date) { return hashString((date || new Date()).toISOString().slice(0, 10)); }

// ---------- vector helpers ----------
const D2R = Math.PI / 180;
function add(a, b) { return [a[0] + b[0], a[1] + b[1]]; }
function sub(a, b) { return [a[0] - b[0], a[1] - b[1]]; }
function mul(a, k) { return [a[0] * k, a[1] * k]; }
function vlen(a) { return Math.hypot(a[0], a[1]); }
function norm(a) { const l = vlen(a) || 1; return [a[0] / l, a[1] / l]; }
function perp(a) { return [-a[1], a[0]]; }
function rot(p, ang) { const c = Math.cos(ang), s = Math.sin(ang); return [p[0] * c - p[1] * s, p[0] * s + p[1] * c]; }
function lerp(a, b, t) { return a + (b - a) * t; }
function lerpP(a, b, t) { return [lerp(a[0], b[0], t), lerp(a[1], b[1], t)]; }
function dirv(deg) { return [Math.cos(deg * D2R), Math.sin(deg * D2R)]; }
function fmt(n) { return Math.round(n * 10) / 10; }

// ---------- bbox tracking (everything emitted passes through here) ----------
let bbox = null;
function bb(p) {
  if (p[0] < bbox.minX) bbox.minX = p[0];
  if (p[0] > bbox.maxX) bbox.maxX = p[0];
  if (p[1] < bbox.minY) bbox.minY = p[1];
  if (p[1] > bbox.maxY) bbox.maxY = p[1];
}

// ---------- stroke classes (tokens replaced once final scale is known) ----------
const SW = { H: 'SW_H', O: 'SW_O', D: 'SW_D', F: 'SW_F' };   // heavy 2.2, outline 1.5, detail 0.8, fine 0.5

// ---------- curves ----------
// pts = [p0, c1, c2, p1, c3, c4, p2, ...]
function cubicBezierPath(pts, closed) {
  bb(pts[0]);
  let d = 'M' + fmt(pts[0][0]) + ',' + fmt(pts[0][1]);
  for (let i = 1; i + 2 < pts.length; i += 3) {
    bb(pts[i]); bb(pts[i + 1]); bb(pts[i + 2]);
    d += ' C' + fmt(pts[i][0]) + ',' + fmt(pts[i][1]) + ' ' + fmt(pts[i + 1][0]) + ',' + fmt(pts[i + 1][1]) + ' ' + fmt(pts[i + 2][0]) + ',' + fmt(pts[i + 2][1]);
  }
  return closed ? d + ' Z' : d;
}
// Catmull-Rom spline through pts -> cubic bezier control list
function catmullRomToBezier(pts, closed, tension) {
  tension = tension === undefined ? 1 : tension;
  const n = pts.length, out = [pts[0]];
  const segs = closed ? n : n - 1;
  for (let i = 0; i < segs; i++) {
    const p0 = pts[closed ? (i - 1 + n) % n : Math.max(i - 1, 0)];
    const p1 = pts[i];
    const p2 = pts[(i + 1) % n];
    const p3 = pts[closed ? (i + 2) % n : Math.min(i + 2, n - 1)];
    out.push(add(p1, mul(sub(p2, p0), tension / 6)), sub(p2, mul(sub(p3, p1), tension / 6)), p2);
  }
  return out;
}
function smoothPath(pts, closed, tension) { return cubicBezierPath(catmullRomToBezier(pts, closed, tension), closed); }
function sampleBezier(bz, perSeg) {
  const out = [];
  for (let i = 1; i + 2 < bz.length; i += 3) {
    const p0 = bz[i - 1], c1 = bz[i], c2 = bz[i + 1], p1 = bz[i + 2];
    for (let k = 0; k < perSeg; k++) {
      const t = k / perSeg, u = 1 - t;
      out.push([u * u * u * p0[0] + 3 * u * u * t * c1[0] + 3 * u * t * t * c2[0] + t * t * t * p1[0],
                u * u * u * p0[1] + 3 * u * u * t * c1[1] + 3 * u * t * t * c2[1] + t * t * t * p1[1]]);
    }
  }
  out.push(bz[bz.length - 1]);
  return out;
}
function sampleSmooth(pts, closed, tension, perSeg) { return sampleBezier(catmullRomToBezier(pts, closed, tension), perSeg || 8); }
function ellipseBezier(c, rx, ry, rotDeg) {
  const k = 0.5523, a = (rotDeg || 0) * D2R;
  const T = p => add(c, rot(p, a));
  return [T([rx, 0]),
    T([rx, ry * k]), T([rx * k, ry]), T([0, ry]),
    T([-rx * k, ry]), T([-rx, ry * k]), T([-rx, 0]),
    T([-rx, -ry * k]), T([-rx * k, -ry]), T([0, -ry]),
    T([rx * k, -ry]), T([rx, -ry * k]), T([rx, 0])];
}
function ellipsePath(c, rx, ry, rotDeg) { return cubicBezierPath(ellipseBezier(c, rx, ry, rotDeg), true); }

// ---------- polygon helpers ----------
function pointInPoly(p, poly) {
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const a = poly[i], b = poly[j];
    if ((a[1] > p[1]) !== (b[1] > p[1]) && p[0] < (b[0] - a[0]) * (p[1] - a[1]) / (b[1] - a[1]) + a[0]) inside = !inside;
  }
  return inside;
}
function outlineYRange(poly, x) {
  let top = Infinity, bot = -Infinity;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const a = poly[i], b = poly[j];
    if ((a[0] <= x && x < b[0]) || (b[0] <= x && x < a[0])) {
      const y = a[1] + (b[1] - a[1]) * (x - a[0]) / (b[0] - a[0]);
      if (y < top) top = y;
      if (y > bot) bot = y;
    }
  }
  return top === Infinity ? null : [top, bot];
}
function plAt(pl, t) { return pl[Math.max(0, Math.min(pl.length - 1, Math.round(t * (pl.length - 1))))]; }
function plYAt(pl, x) {           // polyline monotonic in x
  if (x < pl[0][0] || x > pl[pl.length - 1][0]) return null;
  for (let i = 0; i + 1 < pl.length; i++) {
    const a = pl[i], b = pl[i + 1];
    if (x >= a[0] && x <= b[0]) return b[0] === a[0] ? a[1] : a[1] + (b[1] - a[1]) * (x - a[0]) / (b[0] - a[0]);
  }
  return null;
}

// ---------- element emitters ----------
function pathEl(d, sw, fill) { return '<path d="' + d + '" fill="' + (fill || 'none') + '" stroke-width="' + sw + '"/>'; }
function lineEl(a, b, sw) { bb(a); bb(b); return '<line x1="' + fmt(a[0]) + '" y1="' + fmt(a[1]) + '" x2="' + fmt(b[0]) + '" y2="' + fmt(b[1]) + '" stroke-width="' + sw + '"/>'; }
function polylineEl(pts, sw) { pts.forEach(bb); return '<polyline points="' + pts.map(p => fmt(p[0]) + ',' + fmt(p[1])).join(' ') + '" fill="none" stroke-width="' + sw + '"/>'; }
function circleEl(c, r, sw, fill) { bb([c[0] - r, c[1] - r]); bb([c[0] + r, c[1] + r]); return '<circle cx="' + fmt(c[0]) + '" cy="' + fmt(c[1]) + '" r="' + fmt(r) + '" fill="' + (fill || 'none') + '" stroke-width="' + sw + '"/>'; }
function bowLine(y, hw, bow, sw) {
  return pathEl(cubicBezierPath([[-hw, y], [-hw * 0.35, y + bow], [hw * 0.35, y + bow], [hw, y]], false), sw);
}

// ---------- body part from a half-width profile ----------
// anchors: [[t, f], ...]  t = 0..1 top->bottom, f = fraction of maxHw
function bodyPart(yTop, length, maxHw, anchors, tension) {
  const right = anchors.map(a => [a[1] * maxHw, yTop + a[0] * length]);
  const pts = right.slice();
  for (let i = right.length - 1; i >= 0; i--) if (right[i][0] > 0.01) pts.push([-right[i][0], right[i][1]]);
  const bz = catmullRomToBezier(pts, true, tension);
  const samples = sampleBezier(bz, 10);
  function hwAt(y) {
    let best = 0;
    for (let i = 0; i + 1 < samples.length; i++) {
      const a = samples[i], b = samples[i + 1];
      if ((a[1] <= y && y <= b[1]) || (b[1] <= y && y <= a[1])) {
        const x = b[1] === a[1] ? Math.max(a[0], b[0]) : a[0] + (b[0] - a[0]) * (y - a[1]) / (b[1] - a[1]);
        if (x > best) best = x;
      }
    }
    return best;
  }
  return { path: cubicBezierPath(bz, true), samples, hwAt, yTop, yBot: yTop + length, length, maxHw,
           yAt: t => yTop + t * length };
}
// shape with a straight inner edge on the centre line (elytron, tegmen)
function halfShield(pts) {
  const bz = catmullRomToBezier(pts, false, 1);
  return cubicBezierPath(bz, false) + ' Z';
}

// ---------- limb segment: tapered, bowed, rounded ends, white fill ----------
function limbSegment(A, B, w1, w2, bow) {
  const d = norm(sub(B, A)), n = perp(d), L = vlen(sub(B, A));
  const a1 = add(A, mul(n, w1 / 2)), a2 = sub(A, mul(n, w1 / 2));
  const b1 = add(B, mul(n, w2 / 2)), b2 = sub(B, mul(n, w2 / 2));
  const k = L * 0.35, bv = mul(n, bow);
  const pts = [
    a1,
    add(add(a1, mul(d, k)), bv), add(sub(b1, mul(d, k)), bv), b1,
    add(b1, mul(d, w2 * 0.55)), add(b2, mul(d, w2 * 0.55)), b2,
    add(sub(b2, mul(d, k)), bv), add(add(a2, mul(d, k)), bv), a2,
    sub(a2, mul(d, w1 * 0.55)), sub(a1, mul(d, w1 * 0.55)), a1,
  ];
  return pathEl(cubicBezierPath(pts, true), SW.O, '#fff');
}

// ---------- eyes ----------
function eyeEls(c, rx, ry) {
  const els = [pathEl(ellipsePath(c, rx, ry, 0), SW.D, '#fff')];
  const step = 2.4 / ((rx + ry) / 2);
  for (const ang of [50 * D2R, -50 * D2R]) {
    const t = [Math.cos(ang), Math.sin(ang)], n = [-Math.sin(ang), Math.cos(ang)];
    for (let d = -1 + step * 0.6; d < 1; d += step) {
      const h = Math.sqrt(1 - d * d) * 0.93;
      const p1 = add(mul(n, d), mul(t, -h)), p2 = add(mul(n, d), mul(t, h));
      els.push(lineEl([c[0] + rx * p1[0], c[1] + ry * p1[1]], [c[0] + rx * p2[0], c[1] + ry * p2[1]], SW.F));
    }
  }
  return els;
}

// ---------- antennae (right side) ----------
function shaftPoints(base, dirDeg, length, curveDeg, n) {
  const pts = []; let p = base, a = dirDeg;
  for (let i = 0; i <= n; i++) { pts.push(p); p = add(p, mul(dirv(a), length / n)); a += curveDeg / n; }
  return pts;
}
function antennaEls(kind, base, len) {
  const els = [];
  if (kind === 'filiform' || kind === 'beaded') {
    const pts = shaftPoints(base, randRange(-65, -45), len, randRange(-45, -5), 14);
    els.push(pathEl(smoothPath(pts, false), SW.D));
    if (kind === 'beaded') {
      const pl = sampleSmooth(pts, false, 1, 6);
      for (let i = 4; i < pl.length - 1; i += 3) {
        const d = norm(sub(pl[i + 1], pl[i - 1])), n = perp(d);
        els.push(lineEl(add(pl[i], mul(n, 1.6)), sub(pl[i], mul(n, 1.6)), SW.F));
      }
    }
  } else if (kind === 'clubbed') {
    const pts = shaftPoints(base, randRange(-70, -50), len, randRange(-35, -10), 14);
    els.push(pathEl(smoothPath(pts, false), SW.D));
    const tip = pts[pts.length - 1], d = norm(sub(tip, pts[pts.length - 2]));
    const ang = Math.atan2(d[1], d[0]) / D2R;
    els.push(pathEl(ellipsePath(add(tip, mul(d, 3)), 5.5, 2.6, ang), SW.D, '#fff'));
  } else if (kind === 'feathered') {
    const pts = shaftPoints(base, randRange(-80, -55), len, randRange(-30, -5), 14);
    els.push(pathEl(smoothPath(pts, false), SW.D));
    const pl = sampleSmooth(pts, false, 1, 8);
    const maxB = len * randRange(0.16, 0.24), bothSides = rng() < 0.5;
    let side = 1;
    for (let i = 2; i < pl.length - 1; i += 2) {
      const u = i / pl.length;
      const d = norm(sub(pl[i + 1], pl[i - 1])), n = perp(d);
      const bl = maxB * Math.pow(1 - u, 0.6) * Math.min(1, u * 6 + 0.15);
      const dir = norm(add(mul(n, side), mul(d, 0.45)));   // swept toward the tip
      els.push(lineEl(pl[i], add(pl[i], mul(dir, bl)), SW.F));
      if (bothSides) { const dir2 = norm(add(mul(n, -side), mul(d, 0.45))); els.push(lineEl(pl[i], add(pl[i], mul(dir2, bl * 0.9)), SW.F)); }
      side = -side;
    }
  } else if (kind === 'elbowed') {
    const d0 = randRange(-45, -25), L1 = len * 0.42;
    const elbow = add(base, mul(dirv(d0), L1));
    els.push(limbSegment(base, elbow, 3, 2.6, 0));
    const d1 = d0 - randRange(65, 85);
    const pts = shaftPoints(elbow, d1, len * 0.58, randRange(-25, 5), 10);
    const pl = sampleSmooth(pts, false, 1, 5);
    // flagellum as a thin tapered (clubbed) outline following the curve
    const left = [], right = [];
    for (let i = 0; i < pl.length; i++) {
      const u = i / (pl.length - 1), w = lerp(2.4, 4.2, u) * (u > 0.92 ? (1 - u) / 0.08 * 0.6 + 0.4 : 1);
      const d = norm(sub(pl[Math.min(i + 1, pl.length - 1)], pl[Math.max(i - 1, 0)])), n = perp(d);
      left.push(add(pl[i], mul(n, w / 2))); right.push(sub(pl[i], mul(n, w / 2)));
    }
    els.push(pathEl(smoothPath(left.concat(right.reverse()), true, 0.8), SW.D, '#fff'));
    for (let i = 2; i < pl.length - 1; i += 2) {
      const d = norm(sub(pl[i + 1], pl[i - 1])), n = perp(d), w = lerp(2.4, 4.2, i / pl.length);
      els.push(lineEl(add(pl[i], mul(n, w / 2)), sub(pl[i], mul(n, w / 2)), SW.F));
    }
  }
  return els;
}

// ---------- legs (right side) ----------
function legEls(attach, spec, meta) {
  const els = []; let p = attach;
  const dirs = spec.dirs, lens = spec.lens, ws = spec.widths;
  for (let k = 0; k < 3; k++) {                       // coxa, femur, tibia
    const q = add(p, mul(dirv(dirs[k]), lens[k]));
    const bow = k === 0 ? 0 : lens[k] * 0.07 * (spec.bowSign || 1);
    els.push(limbSegment(p, q, ws[k][0], ws[k][1], bow));
    if (k === 2 && spec.spines) {
      const d = dirv(dirs[k]), n = perp(d);
      const outer = Math.abs(add(p, mul(n, 5))[0]) > Math.abs(sub(p, mul(n, 5))[0]) ? 1 : -1;
      const kk = lens[k] * 0.35, bowV = mul(n, bow);
      const e0 = add(p, mul(n, outer * ws[k][0] / 2)), e3 = add(q, mul(n, outer * ws[k][1] / 2));
      const e1 = add(add(e0, mul(d, kk)), bowV), e2 = add(sub(e3, mul(d, kk)), bowV);
      for (let s = 0.25; s < 0.95; s += 7 / lens[k]) {
        const u = 1 - s;
        const base = [u * u * u * e0[0] + 3 * u * u * s * e1[0] + 3 * u * s * s * e2[0] + s * s * s * e3[0],
                      u * u * u * e0[1] + 3 * u * u * s * e1[1] + 3 * u * s * s * e2[1] + s * s * s * e3[1]];
        els.push(lineEl(base, add(base, add(mul(n, outer * 3.5), mul(d, 2.5))), SW.D));
      }
    }
    p = q;
  }
  // tarsus: 4 tarsomeres curling, then claws
  let a = dirs[3]; const tl = lens[3];
  const fr = [0.3, 0.27, 0.23, 0.2];
  for (let k = 0; k < 4; k++) {
    const q = add(p, mul(dirv(a), tl * fr[k]));
    els.push(limbSegment(p, q, ws[3][0] - k * 0.35, ws[3][0] - (k + 1) * 0.35, 0));
    p = q; a += spec.curl;
  }
  for (const s of [-28, 28]) els.push(lineEl(p, add(p, mul(dirv(a + s), 4)), SW.D));
  if (meta) meta.push({ x: attach[0], y: attach[1], tip: p });
  return els;
}

// ---------- wings ----------
function makeWing(base, thetaDeg, localPts, tension) {
  const th = thetaDeg * D2R;
  const T = p => add(base, rot(p, th));
  const worldPts = localPts.map(T);
  const localPoly = sampleSmooth(localPts, true, tension, 8);
  return {
    path: smoothPath(worldPts, true, tension),
    T, localPoly, localPts,
    inside: p => pointInPoly(p, localPoly),
    yRange: x => outlineYRange(localPoly, x),
  };
}
function marginTargets(poly, origin, N, xMin) {
  const cands = poly.filter(p => p[0] >= xMin)
    .map(p => ({ p, a: Math.atan2(p[1] - origin[1], p[0] - origin[0]) }))
    .sort((a, b) => a.a - b.a);
  const out = [];
  if (!cands.length) return out;
  for (let i = 0; i < N; i++) out.push(cands[Math.floor((i + 0.5) / N * (cands.length - 1))].p);
  return out;
}
// radiating veins: returns array of local polylines
function radiatingVeins(wing, origin, N, xMin, bow) {
  return marginTargets(wing.localPoly, origin, N, xMin).map(tg => {
    const mid = lerpP(origin, tg, 0.5), n = perp(norm(sub(tg, origin)));
    return sampleSmooth([origin, add(mid, mul(n, randRange(-bow, bow))), tg], false, 1, 10);
  });
}
function emitLocalPolyline(wing, pl, sw) { return polylineEl(pl.map(wing.T), sw); }
function scatterDots(wing, n, rMin, rMax, margin) {
  const els = [], poly = wing.localPoly;
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (const p of poly) { minX = Math.min(minX, p[0]); maxX = Math.max(maxX, p[0]); minY = Math.min(minY, p[1]); maxY = Math.max(maxY, p[1]); }
  let tries = 0, made = 0;
  while (made < n && tries < n * 20) {
    tries++;
    const p = [randRange(minX, maxX), randRange(minY, maxY)];
    if (!wing.inside(p)) continue;
    const yr = wing.yRange(p[0]);
    if (yr && (p[1] - yr[0] < margin || yr[1] - p[1] < margin)) continue;
    els.push(circleEl(wing.T(p), randRange(rMin, rMax), SW.F));
    made++;
  }
  return els;
}


// ---------- secondary venation: Voronoi cells between primary veins ----------
// After Hoffmann et al. 2018 (PNAS): inhibitory centres scattered between the
// primary veins repel each other; secondary veins form the boundaries between
// them, i.e. a (near-)Voronoi tessellation of each inter-vein strip.
function clipHalfPlane(poly, a, b) {   // keep the part of poly closer to a than to b
  const f = p => (p[0] - a[0]) * (p[0] - a[0]) + (p[1] - a[1]) * (p[1] - a[1]) - (p[0] - b[0]) * (p[0] - b[0]) - (p[1] - b[1]) * (p[1] - b[1]);
  const out = [];
  for (let i = 0; i < poly.length; i++) {
    const P = poly[i], Q = poly[(i + 1) % poly.length], fp = f(P), fq = f(Q);
    if (fp <= 0) out.push(P);
    if ((fp <= 0) !== (fq <= 0)) out.push(lerpP(P, Q, fp / (fp - fq)));
  }
  return out;
}
function poissonInPoly(poly, rFn, maxTries) {
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (const p of poly) { minX = Math.min(minX, p[0]); maxX = Math.max(maxX, p[0]); minY = Math.min(minY, p[1]); maxY = Math.max(maxY, p[1]); }
  const pts = [];
  for (let t = 0; t < maxTries; t++) {

      L.thoraxHead.push(pathEl(cubicBezierPath([[-7, thorax.yBot - 3], [-3, thorax.yBot + 9], [3, thorax.yBot + 9], [7, thorax.yBot - 3], [4, thorax.yBot - 4], [-4, thorax.yBot - 4], [-7, thorax.yBot - 3]], true), SW.D, '#fff'));
    }
  }
  // head
  const hr = { x: P.headW / 2, y: P.headH / 2 };
  L.thoraxHead.push(pathEl(ellipsePath([0, headCy], hr.x, hr.y, 0), SW.O, '#fff'));
  {
    const E = { beetle: [0.36, 0.12, 0.24], moth: [0.34, 0.14, 0.27], fly: [0.3, 0.2, 0.4], bee: [0.34, 0.13, 0.33], dragonfly: [0.25, 0.24, 0.42], grasshopper: [0.33, 0.13, 0.28], cranefly: [0.32, 0.14, 0.3], lacewing: [0.34, 0.15, 0.3], cicada: [0.42, 0.08, 0.3], wasp: [0.33, 0.13, 0.33], damselfly: [0.4, 0.1, 0.42], mayfly: [0.3, 0.2, 0.4] }[type];
    for (const s of [-1, 1]) L.thoraxHead.push(...eyeEls([s * P.headW * E[0], headCy - P.headH * 0.03], P.headW * E[1], P.headH * E[2]));
    if (type !== 'beetle' && type !== 'moth') {   // ocelli
      L.thoraxHead.push(circleEl([0, headCy - P.headH * 0.18], 1.3, SW.D));
      L.thoraxHead.push(circleEl([-P.headW * 0.09, headCy - P.headH * 0.08], 1.3, SW.D));
      L.thoraxHead.push(circleEl([P.headW * 0.09, headCy - P.headH * 0.08], 1.3, SW.D));
    }
    if (type === 'beetle' || type === 'grasshopper') {   // mandibles
      for (const s of [-1, 1]) L.thoraxHead.push(pathEl(cubicBezierPath([[s * P.headW * 0.16, headTop + 2], [s * P.headW * 0.14, headTop - 4], [s * P.headW * 0.07, headTop - 7], [s * P.headW * 0.02, headTop - 6]], false), SW.D));
    }
    if (type === 'bee' || type === 'fly') {   // clypeus line
      L.thoraxHead.push(bowLine(headCy - P.headH * 0.28, P.headW * 0.16, -P.headH * 0.08, SW.F));
    }
  }

  // ---------- tegulae over the forewing roots ----------
  if (['moth', 'bee', 'wasp', 'lacewing', 'cicada'].includes(type)) {
    const ty = thorax.yAt(type === 'moth' || type === 'lacewing' ? 0.35 : 0.4), tx = thorax.hwAt(ty) - 1;
    L.thoraxHead.push(pathEl(ellipsePath([tx, ty], 5, 3.5, 30), SW.D, '#fff'));
    L.thoraxHead.push(pathEl(ellipsePath([-tx, ty], 5, 3.5, -30), SW.D, '#fff'));
  }

  // ---------- antennae ----------
  {
    const base = [P.headW * (type === 'dragonfly' || type === 'damselfly' ? 0.12 : 0.2), headTop + P.headH * (type === 'grasshopper' ? 0.35 : 0.28)];
    L.antennae.push(...antennaEls(P.antenna, base, P.antLen));
    if (type === 'mayfly') L.antennae.push(pathEl(smoothPath(shaftPoints([3, abdomen.yBot - 2], 72, P.abdLen * 0.85, 14, 8), false), SW.D));   // outer tail filaments
  }

  // ---------- legs ----------
  {
    const u = P.legScale * (thorax.length / 60);
    const widths = type === 'beetle' ? [[7, 6], [8.5, 6], [6, 3.5], [3.4, 2]] : [[6, 5], [7, 5], [5, 3], [3, 1.8]];
    let specs;
    if (type === 'dragonfly' || type === 'damselfly') {
      specs = [
        { t: 0.16, dirs: [-60, -55, -120, -130], lens: [8, 36, 36, 18] },
        { t: 0.3, dirs: [-30, -25, -95, -105], lens: [8, 42, 42, 20] },
        { t: 0.44, dirs: [-12, -8, -75, -90], lens: [8, 48, 48, 22] },
      ];
    } else {
      specs = [
        { t: 0.25, dirs: [-50, -45, -105, -120], lens: [10, 42, 40, 22] },
        { t: 0.55, dirs: [-10, -5, 50, 70], lens: [10, 48, 46, 24] },
        { t: 0.85, dirs: [25, 35, 85, 100], lens: [10, 55, 55, 26] },
      ];
      if (type === 'grasshopper') specs[2] = { t: 0.85, dirs: [30, 55, 92, 100], lens: [12, 95, 95, 30] };
    }
    const legMeta = [];
    for (let i = specs.length - 1; i >= 0; i--) {     // hind first so front overlaps
      const s = specs[i];
      const y = thorax.yAt(s.t), hw = thorax.hwAt(y);
      const attach = [hw - 5, y];   // coxa starts under the thorax edge
      const dirJ = randRange(-6, 6);
      const spec = {
        dirs: s.dirs.map(d => d + dirJ),
        lens: s.lens.map((l, k) => l * (k === 0 ? 1 : u) * jitter(0.08)),
        widths: widths.map(w => w.slice()),
        curl: randRange(8, 14), spines: false, bowSign: 1,
      };
      if (type === 'grasshopper' && i === 2) { spec.widths[1] = [16, 7]; spec.widths[2] = [5.5, 3]; spec.spines = true; spec.lens[0] = 12; }
      if (type === 'bee' && i === 2) { spec.widths[2] = [8, 6]; spec.spines = true; }
      if (type === 'bee' && i === 1) spec.spines = true;
      if (type === 'fly') spec.widths = spec.widths.map(w => [w[0] * 0.8, w[1] * 0.8]);
      if (type === 'cranefly') spec.widths = spec.widths.map(w => [w[0] * 0.5, w[1] * 0.5]);
      if (type === 'mayfly' && i === 0) spec.lens = spec.lens.map((l, k) => k === 0 ? l : l * 1.6);
      if (type === 'wasp' && i === 2) spec.spines = true;
      L.legs.push(...legEls(attach, spec, legMeta));
      legMeta[legMeta.length - 1].hw = hw;
      legMeta[legMeta.length - 1].pair = ['front', 'mid', 'hind'][i];
    }
    meta.legs = legMeta;
  }

  // ---------- wings / covers ----------
  if (type === 'moth') {
    const isB = P.variant === 'butterfly';
    const W = P.wingSpan, H = W * (isB ? 0.95 : 0.8);
    const by = thorax.yAt(0.35), bx = thorax.hwAt(by) * 0.5;
    const j = () => jitter(0.04);
    let fwPts, hwPts;
    if (isB) {
      fwPts = [[0, 0], [W * 0.45 * j(), -H * 0.5 * j()], [W * 0.78 * j(), -H * 0.62 * j()], [W * 0.95, -H * 0.58 * j()], [W * 1.0 * j(), -H * 0.3 * j()],
        [W * 0.93 * j(), -H * 0.02], [W * 0.78 * j(), H * 0.25 * j()], [W * 0.52 * j(), H * 0.42 * j()], [W * 0.25, H * 0.33]];
      hwPts = [[0, 8], [W * 0.4 * j(), H * 0.02], [W * 0.68 * j(), H * 0.15 * j()], [W * 0.7 * j(), H * 0.45 * j()], [W * 0.5 * j(), H * 0.68 * j()], [W * 0.28 * j(), H * 0.74 * j()], [W * 0.06, H * 0.5]];
    } else {
      fwPts = [[0, 0], [W * 0.5 * j(), -H * 0.38 * j()], [W * 0.85 * j(), -H * 0.48 * j()], [W * 1.0, -H * 0.42 * j()], [W * 0.95 * j(), -H * 0.15 * j()],
        [W * 0.82 * j(), H * 0.15 * j()], [W * 0.58 * j(), H * 0.38 * j()], [W * 0.3, H * 0.3]];
      hwPts = [[0, 8], [W * 0.4 * j(), -H * 0.02], [W * 0.68 * j(), H * 0.12 * j()], [W * 0.66 * j(), H * 0.42 * j()], [W * 0.45 * j(), H * 0.65 * j()], [W * 0.22 * j(), H * 0.7 * j()], [W * 0.05, H * 0.5]];
    }
    if (rng() < (isB ? 0.6 : 0.3)) {   // scalloped outer margin
      const out = [];
      for (let i = 0; i < fwPts.length; i++) {
        out.push(fwPts[i]);
        if (i >= 3 && i <= 6) { const m = lerpP(fwPts[i], fwPts[(i + 1) % fwPts.length], 0.5); out.push(mul(m, 0.975)); }
      }
      fwPts = out;
    }
    const base = [bx, by];
    const fore = makeWing(base, 0, fwPts, 1), hind = makeWing(base, 0, hwPts, 1);

    // Comstock-Needham layout: a closed discal cell near the wing centre; Sc+R1 runs
    // along the costa; R2-R5 fan from the cell's upper corner to the apex; M1-M3 leave
    // the discocellular crossvein; Cu1/Cu2 leave the lower edge; 1A runs to the inner margin.
    function lepVeins(wing, b, U, D, nR, scX, aX, xMin) {
      const vs = [];
      const bowed = (p, q, k) => { const n = perp(norm(sub(q, p))); return vein([p, add(lerpP(p, q, 0.5), mul(n, k)), q]); };
      const cellTop = bowed(b, U, -W * 0.015), cellBot = bowed(b, D, W * 0.012);
      const dcv = bowed(U, D, W * 0.02);          // discocellular, concave toward the base
      vs.push(cellTop, cellBot, dcv);
      vs.push(bowed([b[0] + W * 0.03, b[1] - H * 0.04], [scX, topAt(wing, scX, 0.5)], -W * 0.01));
      const nT = nR + 3 + 2;
      const tg = marginTargets(wing.localPoly, U, nT, xMin);
      if (tg.length < nT) return vs;
      // R branches: R2 from the corner, the rest from a short stem continuing the cell's top edge
      const stemDir = norm(sub(tg[0], U));
      for (let i = 0; i < nR; i++) {
        const start = i === 0 ? U : add(U, mul(stemDir, W * 0.05 * Math.min(i, 2)));
        if (i > 0 && i <= 2) vs.push([U, start]);
        vs.push(bowed(start, tg[i], randRange(-1, 1) * W * 0.01));
      }
      for (let i = 0; i < 3; i++) vs.push(bowed(plAt(dcv, 0.15 + i * 0.35), tg[nR + i], randRange(-1, 1) * W * 0.012));
      vs.push(bowed(D, tg[nR + 3], W * 0.01));
      vs.push(bowed(plAt(cellBot, 0.68), tg[nR + 4], W * 0.012));
      vs.push(bowed([b[0], b[1] + H * 0.03], [aX, botAt(wing, aX, 0.5)], W * 0.012));
      return vs;
    }

    // hindwing
    L.wings.push(pathEl(hind.path, SW.O, '#fff'));
    L.wings.push(...fringe(hind, 2.2, 1.5, SW.F, p => p[0] > W * 0.2 || p[1] > H * 0.4));
    for (const v of lepVeins(hind, [W * 0.01, H * 0.1], [W * 0.4, H * 0.12], [W * 0.36, H * 0.3], 2, W * 0.42, W * 0.28, W * 0.45)) L.wings.push(emitLocalPolyline(hind, v, SW.D));
    L.wings.push(...scatterDots(hind, randInt(6, 18), 0.7, 1.4, 4));
    // forewing
    L.wings.push(pathEl(fore.path, SW.O, '#fff'));
    L.wings.push(...costaEls(fore, W * 0.0, W * 0.9));
    L.wings.push(...fringe(fore, 2.2, 1.5, SW.F, p => p[0] > W * 0.3 || p[1] > H * 0.2));
    const nR = randInt(3, 5);
    const veins = lepVeins(fore, [W * 0.01, H * 0.02], [W * 0.52, -H * 0.26], [W * 0.47, H * 0.06], nR, W * 0.62, W * 0.42, W * 0.62);
    for (const v of veins) L.wings.push(emitLocalPolyline(fore, v, SW.D));
    // bands: wavy lines roughly parallel to the outer margin, threaded through the marginal veins
    const marginal = veins.slice(4).filter(v => v.length > 2).slice(0, -1);   // R, M, Cu veins in fan order (drop 1A)
    const nb = randInt(1, 2);
    for (let b = 0; b < nb && marginal.length > 2; b++) {
      const tb = 0.5 + b * 0.25 + randRange(-0.04, 0.04);
      const pts = marginal.map(v => plAt(v, tb + randRange(-0.04, 0.04)));
      const yr0 = fore.yRange(pts[0][0]), yr1 = fore.yRange(pts[pts.length - 1][0]);
      const full = [];
      if (yr0) full.push([pts[0][0], yr0[0] + 1]);
      full.push(...pts);
      if (yr1) full.push([pts[pts.length - 1][0], yr1[1] - 1]);
      L.wings.push(pathEl(smoothPath(full.map(fore.T), false, 1), SW.F));
    }
    if (rng() < 0.55 && marginal.length > 3) {   // eyespot in a cell between marginal veins
      const c = lerpP(plAt(marginal[2], 0.55), plAt(marginal[3], 0.55), 0.5);
      const r = randRange(4, 8);
      if ([[r + 2, 0], [-r - 2, 0], [0, r + 2], [0, -r - 2]].every(d => fore.inside(add(c, d)))) {
        L.wings.push(pathEl(ellipsePath(fore.T(c), r, r * 0.8, 0), SW.D));
        L.wings.push(pathEl(ellipsePath(fore.T(c), r * 0.5, r * 0.4, 0), SW.D));
      }
    }
    L.wings.push(...scatterDots(fore, randInt(15, 50), 0.7, 1.5, 4));
  }

  if (type === 'fly' || type === 'cranefly') {
    // Dipteran wing: long fused stalk, veins hugging the costa then sweeping to the margin.
    // Nematoceran plan (M forked, as in crane flies) or Muscid (single M1+2 with a bend).
    const nemato = type === 'cranefly' || rng() < 0.35;
    const by = thorax.yAt(0.42), bx = thorax.hwAt(by) * 0.6;
    const theta = type === 'cranefly' ? randRange(50, 62) : randRange(30, 45);
    const Lw = (abdomen.yBot - by) / Math.sin(theta * D2R) * (type === 'cranefly' ? randRange(0.95, 1.05) : randRange(1.1, 1.25));
    const ky = type === 'cranefly' ? 0.62 : 1;         // crane-fly wings are narrower
    const X = f => f * Lw, Y = f => f * Lw * ky;
    const o = [[0, 0], [0.08, -0.05], [0.18, -0.14], [0.35, -0.27], [0.55, -0.33], [0.78, -0.3], [0.93, -0.17], [1.0, 0.02], [0.93, 0.17], [0.75, 0.3], [0.5, 0.37], [0.3, 0.35], [0.16, 0.22], [0.08, 0.08]]
      .map(p => [X(p[0]), Y(p[1]) * jitter(0.03)]);
    const wing = makeWing([bx, by], theta, o, 0.9);
    L.wings.push(pathEl(wing.path, SW.O, '#fff'));
    L.wings.push(...fringe(wing, 2.2, 1.8, SW.F, p => p[0] > X(0.08)));
    L.wings.push(...costaEls(wing, X(0), X(0.97)));
    L.wings.push(...costalSpines(wing, X(0.2), X(0.75), 3.2, 2.6));
    const V = [];
    const put = (pl, sw) => { V.push({ pl, sw }); return pl; };
    put(sweep([X(0.01), Y(-0.02)], onTop(wing, X(0.5)), -5, 0.55, 0.3, -32), SW.O);              // Sc
    const rSplit = [X(0.25), Y(-0.14)];
    put(sweep([X(0.01), Y(-0.01)], rSplit, -25, 0.5, 0.3, -30), SW.O);                            // R stem
    put(sweep(rSplit, onTop(wing, X(0.66)), -6, 0.55, 0.3, -22), SW.O);                            // R1
    const rsFork = [X(0.58), Y(-0.09)];
    const rs = put(sweep(rSplit, rsFork, 4, 0.55, 0.3, -8), SW.O);                                 // Rs
    put(sweep(rsFork, onTop(wing, X(0.86)), -20, 0.5, 0.3, -6), SW.O);                             // R2+3
    put(sweep(rsFork, onTip(wing, X(0.985)), 5, 0.5, 0.3, 2), SW.O);                               // R4+5
    const mFork = [X(0.6), Y(0.06)];
    let m;
    if (nemato) {
      m = put(sweep([X(0.01), Y(0.0)], mFork, 8, 0.55, 0.3, -12), SW.D);                            // M stem
      put(sweep(mFork, onBot(wing, X(0.95)), 25, 0.5, 0.3, 6), SW.D);                              // M1
      put(sweep(mFork, onBot(wing, X(0.86)), 45, 0.5, 0.3, 12), SW.D);                             // M2
    } else {
      m = put(vein([[X(0.01), Y(0)], [X(0.3), Y(-0.02)], [X(0.5), Y(0.05)], mFork, [X(0.72), Y(0.08)], [X(0.8), Y(0.01)], onBot(wing, X(0.955))], 10), SW.D);   // M1+2, bent forward
    }
    const cu1 = put(sweep([X(0.01), Y(0.01)], onBot(wing, X(0.66)), 55, 0.5, 0.35, -2), SW.D);     // CuA1 (M3+4)
    const cu2 = put(sweep([X(0.01), Y(0.02)], onBot(wing, X(0.34)), 65, 0.45, 0.35, 12), SW.D);    // CuA2
    put(sweep([X(0.01), Y(0.03)], onBot(wing, X(0.2)), 75, 0.4, 0.35, 28), SW.F);                   // A1
    for (const v of V) L.wings.push(emitLocalPolyline(wing, v.pl, v.sw));
    const cross = (va, xa, vb, xb, sw) => { const ya = plYAt(va, xa), yb = plYAt(vb, xb); if (ya !== null && yb !== null) L.wings.push(lineEl(wing.T([xa, ya]), wing.T([xb, yb]), sw)); };
    L.wings.push(lineEl(wing.T(onTop(wing, X(0.14))), wing.T([X(0.14), plYAt(V[0].pl, X(0.14)) || Y(-0.04)]), SW.D));   // h
    cross(rs, X(0.45), m, X(0.47), SW.D);                                                       // r-m
    cross(m, X(0.5), cu1, X(0.5), SW.D);                                                        // m-cu
    cross(cu1, X(0.32), cu2, X(0.3), SW.D);                                                     // bm-cu
    // halteres
    const hy = thorax.yAt(0.8), hx = thorax.hwAt(hy) * 0.8;
    const hd = dirv(theta + 20);
    L.wings.push(lineEl([hx, hy], add([hx, hy], mul(hd, 11)), SW.D));
    L.wings.push(circleEl(add([hx, hy], mul(hd, 13)), 2.4, SW.D, '#fff'));
  }

  if (type === 'lacewing') {
    // Neuroptera: costal crossvein ladder, many parallel Rs branches, two gradate series, twigged margins
    const theta = randRange(36, 46);
    const by0 = thorax.yAt(0.35);
    const Lw = (abdomen.yBot - by0) / Math.sin(theta * D2R) * randRange(1.0, 1.12);
    const defs = [{ L: Lw * 0.9, k: 0.9, th: theta + 16, t: 0.65 }, { L: Lw, k: 1, th: theta, t: 0.35 }];
    for (const d of defs) {
      const by = thorax.yAt(d.t), bx = thorax.hwAt(by) * 0.6;
      const X = f => f * d.L, Y = f => f * d.L * 0.19 * d.k;    // half-width 0.19 L
      const o = [[0, 0], [0.08, -0.45], [0.3, -0.8], [0.6, -0.96], [0.85, -0.8], [0.97, -0.4], [1, 0.04], [0.9, 0.5], [0.7, 0.84], [0.45, 1], [0.2, 0.8], [0.06, 0.36]]
        .map(p => [X(p[0]), Y(p[1]) * jitter(0.03)]);
      const wing = makeWing([bx, by], d.th, o, 0.9);
      L.wings.push(pathEl(wing.path, SW.O, '#fff'));
      L.wings.push(...fringe(wing, 2.4, 1.6, SW.F, p => p[0] > X(0.06)));
      L.wings.push(...costaEls(wing, X(0), X(0.96)));
      // Sc and R1 run parallel just inside the costa; costal crossveins ladder between C and Sc
      const edge = leadingEdge(wing, X(0.06), X(0.93));
      const sc = edge.map(p => [p[0], p[1] + 4.5]).concat([onTop(wing, X(0.95))]);
      const r1 = edge.filter(p => p[0] < X(0.9)).map(p => [p[0], p[1] + 9]).concat([onTop(wing, X(0.98))]);
      L.wings.push(emitLocalPolyline(wing, sc, SW.O), emitLocalPolyline(wing, r1, SW.D));
      for (let x = X(0.08); x < X(0.9); x += X(0.028)) { const ys = plYAt(sc, x); if (ys !== null) L.wings.push(lineEl(wing.T(onTop(wing, x)), wing.T([x, ys]), SW.F)); }
      // Rs runs below R1; its branches peel off in turn and sweep to the margin, trailing edge first, apex last
      const rs = sweep([X(0.01), Y(0.0)], [X(0.85), Y(-0.45)], -8, 0.55, 0.3, -10);
      L.wings.push(emitLocalPolyline(wing, rs, SW.D));
      const nB = randInt(8, 11);
      const cands = wing.localPoly.filter(p => p[0] > X(0.5) && p[1] > Y(-0.9))
        .map(p => ({ p, a: Math.atan2(p[1] - Y(0.2), p[0] - X(0.3)) })).sort((a, b) => b.a - a.a);   // trailing edge -> apex
      const branches = [];
      for (let i = 0; i < nB && cands.length; i++) {
        const sx = X(0.15 + 0.62 * i / nB), sy = plYAt(rs, sx);
        if (sy === null) continue;
        const target = cands[Math.floor((i + 0.5) / nB * (cands.length - 1))].p;
        const pl = sweep([sx, sy], target, lerp(72, 12, i / (nB - 1)), 0.5, 0.3, -6);
        branches.push(pl);
        L.wings.push(emitLocalPolyline(wing, pl, SW.D), ...twigEnd(wing, pl, 2.5));
      }
      for (const g of [0.5, 0.74]) for (let i = 0; i + 1 < branches.length; i++) {
        L.wings.push(lineEl(wing.T(plAt(branches[i], g + i * 0.015)), wing.T(plAt(branches[i + 1], g + (i + 1) * 0.015)), SW.F));
      }
      const m = sweep([X(0.01), Y(0.05)], onBot(wing, X(0.4)), 60, 0.4, 0.35), cu = sweep([X(0.01), Y(0.1)], onBot(wing, X(0.25)), 70, 0.4, 0.35);
      L.wings.push(emitLocalPolyline(wing, m, SW.D), emitLocalPolyline(wing, cu, SW.F), ...twigEnd(wing, m, 2), ...twigEnd(wing, cu, 2));
      for (let x = X(0.1); x < X(0.22); x += X(0.05)) { const ya = plYAt(m, x), yb = plYAt(cu, x); if (ya !== null && yb !== null) L.wings.push(lineEl(wing.T([x, ya]), wing.T([x, yb]), SW.F)); }
    }
  }

  if (type === 'cicada') {
    // Hemiptera: heavy costa, basal cells closed by a nodal line of crossveins, 8 apical cells, ambient vein inside the margin
    const theta = randRange(32, 42);
    const by0 = thorax.yAt(0.4);
    const Lw = (abdomen.yBot - by0) / Math.sin(theta * D2R) * randRange(1.15, 1.3);
    const defs = [{ L: Lw * 0.55, k: 1.3, th: theta + 18, t: 0.68, hind: true }, { L: Lw, k: 1, th: theta, t: 0.4, hind: false }];
    for (const d of defs) {
      const by = thorax.yAt(d.t), bx = thorax.hwAt(by) * 0.6;
      const X = f => f * d.L, Y = f => f * d.L * 0.165 * d.k;    // half-width 0.165 L
      const o = [[0, 0], [0.06, -0.5], [0.3, -0.85], [0.6, -1], [0.85, -0.85], [0.97, -0.45], [1, 0.0], [0.94, 0.45], [0.75, 0.85], [0.45, 1], [0.2, 0.85], [0.06, 0.36]]
        .map(p => [X(p[0]), Y(p[1]) * jitter(0.03)]);
      const wing = makeWing([bx, by], d.th, o, 0.9);
      L.wings.push(pathEl(wing.path, SW.O, '#fff'));
      L.wings.push(...costaEls(wing, X(0), X(0.97)));
      // ambient vein: a line just inside the margin from the apex round the trailing edge
      const poly = wing.localPoly;
      let cx = 0, cy = 0; for (const p of poly) { cx += p[0]; cy += p[1]; } cx /= poly.length; cy /= poly.length;
      const amb = poly.filter(p => p[0] > X(0.45) || (p[1] > 0 && p[0] > X(0.2))).map(p => add(p, mul(norm(sub([cx, cy], p)), 3)));
      let tipI = 0; for (let i = 1; i < poly.length; i++) if (poly[i][0] > poly[tipI][0]) tipI = i;
      const ambPl = poly.slice(tipI - Math.floor(poly.length * 0.08), tipI + Math.floor(poly.length * 0.42)).map(p => add(p, mul(norm(sub([cx, cy], p)), 3)));
      if (ambPl.length > 2) L.wings.push(emitLocalPolyline(wing, ambPl, SW.D));
      // basal longitudinals to the nodal line, then apical veins to the margin
      const nA = d.hind ? 5 : 8;
      const nodal = [];
      for (let i = 0; i < nA; i++) nodal.push([X(0.6 - 0.22 * i / (nA - 1)), Y(lerp(-0.72, 0.75, i / (nA - 1)))]);
      const basal = [sweep([X(0.01), Y(-0.08)], nodal[0], -5, 0.6, 0.3), sweep([X(0.01), Y(0.0)], nodal[Math.floor(nA * 0.4)], 10, 0.6, 0.3), sweep([X(0.01), Y(0.08)], nodal[nA - 2], 30, 0.5, 0.3)];
      for (const b of basal) L.wings.push(emitLocalPolyline(wing, b, SW.O));
      L.wings.push(emitLocalPolyline(wing, nodal, SW.D));
      const tg = marginTargets(poly, [X(0.5), 0], nA + 2, X(0.62));
      for (let i = 0; i < nA && i + 1 < tg.length; i++) {
        const pl = sweep(nodal[i], tg[i + 1], lerp(-10, 65, i / (nA - 1)), 0.4, 0.35);
        L.wings.push(emitLocalPolyline(wing, pl, SW.D));
      }
      L.wings.push(lineEl(wing.T([X(0.3), plYAt(basal[0], X(0.3)) || 0]), wing.T([X(0.3), plYAt(basal[1], X(0.3)) || 0]), SW.D));
      L.wings.push(lineEl(wing.T([X(0.25), plYAt(basal[1], X(0.25)) || 0]), wing.T([X(0.25), plYAt(basal[2], X(0.25)) || 0]), SW.D));
      L.wings.push(emitLocalPolyline(wing, sweep([X(0.01), Y(0.14)], onBot(wing, X(0.3)), 70, 0.4, 0.35), SW.D));
    }
  }

  if (type === 'mayfly') {
    // Ephemeroptera: triangular forewing with many fanning longitudinals and dense crossveins; tiny hindwing
    const by = thorax.yAt(0.45), bx = thorax.hwAt(by) * 0.8;
    const Lw = P.abdLen * randRange(0.9, 1.05);
    const defs = [{ L: Lw * 0.3, th: randRange(14, 24), t: 0.78, hind: true }, { L: Lw, th: randRange(-14, -2), t: 0.45, hind: false }];
    for (const d of defs) {
      const byy = thorax.yAt(d.t), bxx = thorax.hwAt(byy) * 0.6;
      const X = f => f * d.L, Y = f => f * d.L * 0.8;
      const o = d.hind
        ? [[0, 0], [0.1, -0.3], [0.5, -0.45], [0.9, -0.25], [1, 0.05], [0.8, 0.35], [0.4, 0.45], [0.1, 0.3]].map(p => [X(p[0]), Y(p[1])])
        : [[0, 0.01], [0.04, -0.12], [0.3, -0.3], [0.6, -0.36], [0.85, -0.3], [0.97, -0.15], [1, 0], [0.9, 0.15], [0.7, 0.3], [0.45, 0.42], [0.2, 0.45], [0.05, 0.3]].map(p => [X(p[0]), Y(p[1]) * jitter(0.03)]);
      const wing = makeWing([bxx, byy], d.th, o, 0.9);
      L.wings.push(pathEl(wing.path, SW.O, '#fff'));
      L.wings.push(...costaEls(wing, X(0), X(0.97)));
      const nV = d.hind ? 3 : randInt(10, 14);
      const tg = marginTargets(wing.localPoly, [X(0.1), 0], nV + 2, X(d.hind ? 0.5 : 0.3));
      const veins = [];
      const yr = wing.yRange(X(0.06)) || [-2, 2];
      for (let i = 0; i < nV && i + 1 < tg.length; i++) {
        const pl = sweep([X(0.04), lerp(yr[0] + 1, yr[1] - 1, i / (nV - 1))], tg[i + 1], lerp(-5, 80, i / (nV - 1)), 0.35, 0.3);
        veins.push(pl);
        L.wings.push(emitLocalPolyline(wing, pl, i % 2 === 0 ? SW.D : SW.F));
      }
      if (!d.hind) for (let i = 0; i + 1 < veins.length; i++) {
        const xEnd = Math.min(veins[i][veins[i].length - 1][0], veins[i + 1][veins[i + 1].length - 1][0]);
        for (let x = X(0.12) + (i % 2) * 3; x < xEnd - 2; x += 6 + randRange(-1.5, 1.5)) {
          const ya = plYAt(veins[i], x), yb = plYAt(veins[i + 1], x);
          if (ya !== null && yb !== null && Math.abs(yb - ya) > 2) L.wings.push(lineEl(wing.T([x, ya]), wing.T([x, yb]), SW.F));
        }
      }
    }
  }

  if (type === 'bee' || type === 'wasp') {
    const theta = randRange(38, 50);
    const by = thorax.yAt(0.4), bx = thorax.hwAt(by) * 0.6;
    const Lw = (abdomen.yBot - by) / Math.sin(theta * D2R) * randRange(0.92, 1.0);
    const w = Lw * (type === 'wasp' ? 0.26 : 0.3);
    const fPts = [[0, 0], [Lw * 0.3, -w * 0.35], [Lw * 0.7, -w * 0.45], [Lw * 0.95, -w * 0.25], [Lw, w * 0.05], [Lw * 0.8, w * 0.4], [Lw * 0.45, w * 0.5], [Lw * 0.12, w * 0.25]];
    const fore = makeWing([bx, by], theta, fPts, 1);
    const hy = thorax.yAt(0.62), hx = thorax.hwAt(hy) * 0.6;
    const Lh = Lw * 0.62, wh = w * 0.75;
    const hPts = [[0, 0], [Lh * 0.3, -wh * 0.35], [Lh * 0.7, -wh * 0.45], [Lh, -wh * 0.05], [Lh * 0.8, wh * 0.4], [Lh * 0.45, wh * 0.5], [Lh * 0.12, wh * 0.25]];
    const hind = makeWing([hx, hy], theta + 14, hPts, 1);
    const cross = (wg, va, xa, vb, xb) => { const ya = plYAt(va, xa), yb = plYAt(vb, xb); if (ya !== null && yb !== null) L.wings.push(lineEl(wg.T([xa, ya]), wg.T([xb, yb]), SW.D)); };
    // hindwing: R, M, Cu plus a row of hamuli (hooks) on the leading edge
    L.wings.push(pathEl(hind.path, SW.O, '#fff'));
    {
      const b = [Lh * 0.01, 0];
      const r = vein([b, [Lh * 0.4, -wh * 0.2], [Lh * 0.9, topAt(hind, Lh * 0.9, 0.5)]]);
      const m = vein([b, [Lh * 0.5, wh * 0.05], [Lh * 0.985, (topAt(hind, Lh * 0.985) + botAt(hind, Lh * 0.985)) / 2]]);
      const cu = vein([b, [Lh * 0.25, wh * 0.25], [Lh * 0.5, botAt(hind, Lh * 0.5, 0.5)]]);
      for (const v of [r, m, cu]) L.wings.push(emitLocalPolyline(hind, v, SW.D));
      cross(hind, r, Lh * 0.42, m, Lh * 0.45); cross(hind, r, Lh * 0.62, m, Lh * 0.65); cross(hind, m, Lh * 0.35, cu, Lh * 0.33);
      for (let x = Lh * 0.42; x < Lh * 0.62; x += Lh * 0.045) { const p = [x, topAt(hind, x, 0.3)]; L.wings.push(lineEl(hind.T(p), hind.T([p[0] + 1.2, p[1] - 2.2]), SW.D)); }
    }
    // forewing: costal vein to the stigma, marginal cell, three submarginal cells, discoidal cells
    L.wings.push(pathEl(fore.path, SW.O, '#fff'));
    L.wings.push(...costaEls(fore, 0, Lw * 0.5));
    {
      const b1 = [Lw * 0.01, -w * 0.03], b2 = [Lw * 0.01, w * 0.0], b3 = [Lw * 0.01, w * 0.03];
      const sc = vein([b1, [Lw * 0.25, -w * 0.3], [Lw * 0.47, topAt(fore, Lw * 0.47, 0.5)]]);
      const r1 = vein([[Lw * 0.56, topAt(fore, Lw * 0.56, w * 0.09)], [Lw * 0.75, topAt(fore, Lw * 0.75, w * 0.16)], [Lw * 0.93, topAt(fore, Lw * 0.93, 0.5)]]);
      const rs = vein([b1, [Lw * 0.4, -w * 0.06], [Lw * 0.7, -w * 0.02], [Lw * 0.97, (topAt(fore, Lw * 0.97) + botAt(fore, Lw * 0.97)) / 2]], 12);
      const m = vein([b2, [Lw * 0.35, w * 0.12], [Lw * 0.7, w * 0.12], [Lw * 0.88, botAt(fore, Lw * 0.88, 0.5)]]);
      const cu = vein([b3, [Lw * 0.25, w * 0.27], [Lw * 0.55, botAt(fore, Lw * 0.55, 0.5)]]);
      const a = vein([b3, [Lw * 0.12, w * 0.36], [Lw * 0.28, botAt(fore, Lw * 0.28, 0.5)]]);
      for (const v of [sc, r1, rs, m, cu, a]) L.wings.push(emitLocalPolyline(fore, v, SW.D));
      // pterostigma: small hatched cell on the costa between Sc's end and the marginal cell
      for (let x = Lw * 0.48; x <= Lw * 0.56; x += 1.3) L.wings.push(lineEl(fore.T([x, topAt(fore, x, 0.4)]), fore.T([x, topAt(fore, x, w * 0.08)]), SW.F));
      cross(fore, r1, Lw * 0.6, rs, Lw * 0.58); cross(fore, r1, Lw * 0.7, rs, Lw * 0.69); cross(fore, r1, Lw * 0.82, rs, Lw * 0.8);   // submarginal cells
      cross(fore, rs, Lw * 0.35, m, Lw * 0.33); cross(fore, rs, Lw * 0.5, m, Lw * 0.5); cross(fore, rs, Lw * 0.69, m, Lw * 0.7);     // discoidal cells
      cross(fore, m, Lw * 0.3, cu, Lw * 0.28); cross(fore, m, Lw * 0.5, cu, Lw * 0.48);
      cross(fore, cu, Lw * 0.2, a, Lw * 0.2);
    }
  }

  if (type === 'dragonfly' || type === 'damselfly') {
    const Lw = P.wingLen, dam = type === 'damselfly';
    const nodusX = Lw * (dam ? randRange(0.38, 0.45) : randRange(0.42, 0.5));
    const wingDefs = dam
      ? [{ t: 0.5, theta: randRange(-12, -4), w: Lw * 0.16, baseW: 0.05, hind: false }, { t: 0.78, theta: randRange(4, 12), w: Lw * 0.16, baseW: 0.05, hind: true }]
      : [{ t: 0.5, theta: randRange(-10, -3), w: Lw * 0.19, baseW: 0.14, hind: false }, { t: 0.8, theta: randRange(6, 14), w: Lw * 0.24, baseW: 0.3, hind: true }];
    for (const wd of wingDefs) {
      const by = thorax.yAt(wd.t), bx = thorax.hwAt(by) * 0.6;
      const w = wd.w;
      // costa with a small notch at the nodus
      const pts = dam   // damselfly wings are petiolate: a long narrow stalk
        ? [[0, -w * 0.05], [Lw * 0.18, -w * 0.36], [nodusX - 3, -w * 0.5], [nodusX + 1, -w * 0.45], [Lw * 0.7, -w * 0.48], [Lw * 0.9, -w * 0.38], [Lw, -w * 0.05], [Lw * 0.92, w * 0.33], [Lw * 0.65, w * 0.5], [Lw * 0.35, w * 0.4], [Lw * 0.18, w * 0.12], [0, w * 0.05]]
        : [[0, -w * 0.05], [Lw * 0.06, -w * 0.42], [Lw * 0.25, -w * 0.5], [nodusX - 3, -w * 0.5], [nodusX + 1, -w * 0.45], [Lw * 0.7, -w * 0.47], [Lw * 0.9, -w * 0.38], [Lw, -w * 0.05],
        [Lw * 0.92, w * 0.33], [Lw * 0.6, w * 0.5], [Lw * 0.25, w * (wd.hind ? 0.55 : 0.5)], [Lw * 0.06, w * (wd.hind ? 0.45 : 0.3)], [0, w * wd.baseW]];
      const wing = makeWing([bx, by], wd.theta, pts, 0.8);
      const poly = wing.localPoly;
      L.wings.push(pathEl(wing.path, SW.O, '#fff'));
      L.wings.push(...costaEls(wing, 0, Lw * 0.97));
      // primary longitudinal veins, all fused at the base. Sc ends at the nodus; R1 runs
      // under the costa to the tip; the rest (R2-R4, MA, MP, CuA, CuP) fan to the margin.
      const x0 = Lw * 0.01, yr0 = wing.yRange(x0 + Lw * 0.02) || [-w * 0.3, w * 0.1];
      const nV = randInt(5, 7);
      const tipTargets = marginTargets(poly, [Lw * 0.05, 0], nV + 1, Lw * 0.55);
      const scTarget = nearestOutlinePoint(poly, [nodusX, topAt(wing, nodusX)]);
      const makeVein = (y0, tg, pow) => {
        const pl = [], steps = 40;
        for (let k = 0; k <= steps; k++) { const x = x0 + (tg[0] - x0) * k / steps; pl.push([x, y0 + (tg[1] - y0) * Math.pow(k / steps, pow)]); }
        pl[pl.length - 1] = tg;          // exact outline point, so strips can walk the margin
        return pl;
      };
      const veins = [];
      veins.push(makeVein(yr0[0] + 1.5, scTarget, 1.0));                                  // Sc
      veins.push(makeVein(yr0[0] + 3.5, tipTargets[0], 1.6));                             // R1
      for (let i = 1; i <= nV; i++) veins.push(makeVein(lerp(yr0[0] + 5, yr0[1] - 1.5, i / nV), tipTargets[i], 1.5));
      for (const v of veins) L.wings.push(emitLocalPolyline(wing, v, SW.D));
      // antenodal crossveins (C-Sc and Sc-R1, aligned), postnodals (C-R1), pterostigma
      const stepA = Lw * 0.035;
      for (let x = Lw * (dam ? 0.2 : 0.09); x < nodusX - 2; x += stepA) {
        const t = topAt(wing, x, 0.3), ys = plYAt(veins[0], x), yr = plYAt(veins[1], x);
        if (ys !== null) L.wings.push(lineEl(wing.T([x, t]), wing.T([x, ys]), SW.F));
        if (ys !== null && yr !== null) L.wings.push(lineEl(wing.T([x, ys]), wing.T([x, yr]), SW.F));
      }
      const psx0 = Lw * 0.78, psx1 = Lw * 0.86;
      for (let x = nodusX + Lw * 0.02; x < Lw * 0.97; x += Lw * 0.028) {
        if (x > psx0 - 2 && x < psx1 + 2) continue;
        const yr = plYAt(veins[1], x);
        if (yr !== null) L.wings.push(lineEl(wing.T([x, topAt(wing, x, 0.3)]), wing.T([x, yr]), SW.F));
      }
      for (let x = psx0; x <= psx1; x += 1.3) { const yr = plYAt(veins[1], x); if (yr !== null) L.wings.push(lineEl(wing.T([x, topAt(wing, x, 0.4)]), wing.T([x, yr]), SW.F)); }
      L.wings.push(lineEl(wing.T([psx0, topAt(wing, psx0, 0.3)]), wing.T([psx0, plYAt(veins[1], psx0) || 0]), SW.D));
      L.wings.push(lineEl(wing.T([psx1, topAt(wing, psx1, 0.3)]), wing.T([psx1, plYAt(veins[1], psx1) || 0]), SW.D));
      // secondary venation: Voronoi cells in each strip from R1 down to the trailing edge;
      // cells about one strip-width across, shrinking toward the tip and the hind margin
      const basePt = nearestOutlinePoint(poly, [0, w * wd.baseW]);
      for (let i = 1; i < veins.length; i++) {
        const a = veins[i], b = i + 1 < veins.length ? veins[i + 1] : [basePt];
        const rFn = p => {
          const ya = plYAt(a, p[0]), yb = i + 1 < veins.length ? plYAt(b, p[0]) : botAt(wing, p[0]);
          const width = (ya !== null && yb !== null) ? Math.abs(yb - ya) : 8;
          return Math.max(4.5, Math.min(11, width * 0.9)) * (1 - 0.25 * p[0] / Lw);
        };
        L.wings.push(...emitEdges(wing, voronoiStrip(poly, a, b, rFn), SW.F));
      }
    }
  }

  if (type === 'beetle') {
    const top = thorax.yBot - 4;
    const elen = P.abdLen * randRange(0.86, 1.0) + 4;
    const eBot = top + elen;
    const ew = abdHW * 1.03;
    L.thoraxHead.push(lineEl([0, thorax.yBot + 10], [0, eBot - 3], SW.D));   // suture, drawn once above the elytra
    if (eBot < abdomen.yBot - 8) {   // hindwing tips peeking out from under the elytra
      const hwT = abdomen.hwAt(eBot + 4) * 0.9;
      const t = [[hwT * 0.1, eBot - 12], [hwT * 0.95, eBot - 8], [hwT * 0.8, eBot + 5], [hwT * 0.15, eBot + 7]];
      L.covers.push(pathEl(smoothPath(t, true, 1), SW.D, '#fff'));
      for (let k = 1; k <= 2; k++) L.covers.push(pathEl(cubicBezierPath([[hwT * 0.2, eBot - 10 + k * 5], [hwT * 0.5, eBot - 9 + k * 5], [hwT * 0.75, eBot - 7 + k * 5], [hwT * 0.85, eBot - 3 + k * 5]], false), SW.F));
    }
    const outer = [[0, top], [ew * 0.5, top + 1], [ew * 0.98, top + elen * 0.1], [ew, top + elen * 0.45], [ew * 0.74, top + elen * 0.84], [ew * 0.28, top + elen * 0.985], [0, eBot]];
    L.covers.push(pathEl(halfShield(outer), SW.O, '#fff'));
    // striae (ridges) converging toward the apex
    const nR = randInt(3, 5);
    for (let k = 1; k <= nR; k++) {
      const f = 1 - k / (nR + 1);
      const pts = [[ew * 0.5 * f, top + 5], [ew * 0.98 * f, top + elen * 0.1], [ew * f, top + elen * 0.45], [ew * 0.74 * f, top + elen * 0.84], [ew * 0.28 * f, top + elen * 0.975]];
      L.covers.push(pathEl(smoothPath(pts, false, 1), SW.F));
    }
    if (rng() < 0.5) {   // puncture rows between striae
      const nPts = randInt(14, 22);
      for (let k = 0; k <= nR; k++) {
        const f = 1 - (k + 0.5) / (nR + 1);
        const pts = [[ew * 0.5 * f, top + 8], [ew * 0.98 * f, top + elen * 0.1], [ew * f, top + elen * 0.45], [ew * 0.74 * f, top + elen * 0.84], [ew * 0.28 * f, top + elen * 0.95]];
        const pl = sampleSmooth(pts, false, 1, 6);
        for (let i = 0; i < nPts; i++) L.covers.push(circleEl(plAt(pl, (i + 0.5) / nPts), 0.8, SW.F));
      }
    }
  }

  if (type === 'grasshopper') {
    const by = thorax.yBot - 6;
    const Lt = P.abdLen * randRange(1.05, 1.18), wt = abdHW * 1.15;
    if (rng() < 0.7) {   // folded hindwing fan peeking out
      const fan = [[abdHW * 0.25, by + 4], [abdHW * 1.15, by + Lt * 0.25], [abdHW * 1.3, by + Lt * 0.5], [abdHW * 1.0, by + Lt * 0.72], [abdHW * 0.6, by + Lt * 0.82], [abdHW * 0.3, by + Lt * 0.6]];
      L.covers.push(pathEl(smoothPath(fan, true, 1), SW.D, '#fff'));
      for (let k = 1; k <= 6; k++) {
        const tg = lerpP([abdHW * 1.3, by + Lt * 0.5], [abdHW * 0.6, by + Lt * 0.82], k / 7);
        L.covers.push(lineEl([abdHW * 0.3, by + 6], tg, SW.F));
      }
    }
    const teg = [[0, by], [wt * 0.55, by + 3], [wt * 0.75, by + Lt * 0.12], [wt * 0.78, by + Lt * 0.5], [wt * 0.55, by + Lt * 0.85], [wt * 0.2, by + Lt * 0.99], [0, by + Lt]];
    L.covers.push(pathEl(halfShield(teg), SW.O, '#fff'));
    const vs = [];
    for (let k = 0; k <= 3; k++) {   // k = 0 is the outer edge itself, used only as a strip boundary
      const f = 1 - k / 4;
      const pts = [[wt * 0.55 * f, by + 6], [wt * 0.75 * f, by + Lt * 0.12], [wt * 0.78 * f, by + Lt * 0.5], [wt * 0.55 * f, by + Lt * 0.85], [wt * 0.2 * f, by + Lt * 0.97]];
      vs.push(sampleSmooth(pts, false, 1, 8));
      if (k > 0) L.covers.push(pathEl(smoothPath(pts, false, 1), SW.D));
    }
    const ident = { T: p => p };
    for (let i = 0; i + 1 < vs.length; i++) {   // irregular reticulation between the longitudinal veins
      const strip = vs[i].concat(vs[i + 1].slice().reverse());
      L.covers.push(...emitEdges(ident, voronoiEdges(poissonInPoly(strip, () => randRange(6, 9), 400), strip), SW.F));
    }
  }

  // ---------- assemble ----------
  const mirrored = k => '<g>' + L[k].join('') + '</g><g transform="scale(-1,1)">' + L[k].join('') + '</g>';
  const single = k => '<g>' + L[k].join('') + '</g>';
  // legs sprout from under the body; wings sit over the legs; body masks both
  const order = [mirrored('legs'), mirrored('wings'), single('abdomen'), mirrored('covers'), single('thoraxHead'), mirrored('antennae')];

  // symmetric bbox (right half generated, left mirrored)
  const halfW = Math.max(Math.abs(bbox.minX), Math.abs(bbox.maxX));
  const bw = halfW * 2, bh = bbox.maxY - bbox.minY;
  const margin = 24;
  const s = Math.min((600 - 2 * margin) / bw, (600 - 2 * margin) / bh, 1.3);
  const tx = 300, ty = 300 - (bbox.minY + bbox.maxY) / 2 * s;
  meta.scale = s;
  meta.bbox = { minX: -halfW, maxX: halfW, minY: bbox.minY, maxY: bbox.maxY };
  meta.fitted = { minX: tx - halfW * s, maxX: tx + halfW * s, minY: ty + bbox.minY * s, maxY: ty + bbox.maxY * s };

  let svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">' +
    '<rect width="600" height="600" fill="#fff"/>' +
    '<g transform="translate(' + fmt(tx) + ' ' + fmt(ty) + ') scale(' + (Math.round(s * 1000) / 1000) + ')" stroke="#000" stroke-linecap="round" stroke-linejoin="round" fill="none">' +
    order.join('') + '</g></svg>';
  const sw = v => String(Math.round(v / s * 1000) / 1000);
  svg = svg.replace(/SW_H/g, sw(2.2)).replace(/SW_O/g, sw(1.5)).replace(/SW_D/g, sw(0.8)).replace(/SW_F/g, sw(0.5));
  return { svg, meta };
}

function generateInsect(seed) { return generateInsectDetailed(seed).svg; }

if (typeof module !== 'undefined' && module.exports) {
  module.exports = { generateInsect, generateInsectDetailed, dailySeed, hashString, mulberry32, TYPES };
}
</script>

<script>
(function () {
  const seedInput = document.getElementById('seed');
  const stage = document.getElementById('stage');
  const info = document.getElementById('info');
  const NAMES = { beetle: 'Coleoptera', moth: 'Lepidoptera', fly: 'Diptera', bee: 'Hymenoptera', dragonfly: 'Odonata', grasshopper: 'Orthoptera', cranefly: 'Diptera (Tipulidae)', lacewing: 'Neuroptera', cicada: 'Hemiptera', wasp: 'Hymenoptera', damselfly: 'Odonata (Zygoptera)', mayfly: 'Ephemeroptera' };

  function render(seed) {
    seed = Number(seed) >>> 0;
    seedInput.value = seed;
    const r = generateInsectDetailed(seed);
    stage.innerHTML = r.svg;
    const label = r.meta.variant === 'butterfly' ? 'butterfly' : r.meta.type;
    info.innerHTML = 'seed <b>' + seed + '</b> &middot; <i>' + NAMES[r.meta.type] + '</i> (' + label + ')';
    history.replaceState(null, '', '#' + seed);
    document.title = 'insectdraw #' + seed;
  }

  document.getElementById('gen').addEventListener('click', () => render(seedInput.value));
  seedInput.addEventListener('keydown', e => { if (e.key === 'Enter') render(seedInput.value); });
  document.getElementById('rnd').addEventListener('click', () => render(Math.floor(Math.random() * 4294967296)));
  document.getElementById('daily').addEventListener('click', () => render(dailySeed()));

  const fromHash = location.hash.slice(1);
  render(/^\d+$/.test(fromHash) ? fromHash : dailySeed());
  window.render = render;
})();
</script>
