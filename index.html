<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>insectdraw</title>
<style>
  html, body { margin: 0; background: #fff; color: #000; }
  body { font: 14px/1.4 Georgia, "Times New Roman", serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 12px 16px; box-sizing: border-box; }
  #panes { display: flex; gap: 16px; justify-content: center; align-items: flex-start; flex-wrap: wrap; width: 100%; }
  .pane { display: flex; flex-direction: column; align-items: center; }
  .stage { width: min(92vw, 600px); aspect-ratio: 1 / 1; }
  body.compare .stage { width: min(92vw, 46vw, 600px); }
  .stage svg { width: 100%; height: 100%; display: block; }
  .controls { display: flex; gap: 8px; align-items: center; margin: 14px 0 6px; flex-wrap: wrap; justify-content: center; }
  #topbar { margin-bottom: 10px; }
  input, button { font: inherit; padding: 4px 10px; border: 1px solid #000; background: #fff; color: #000; border-radius: 0; }
  input { width: 10em; }
  button { cursor: pointer; }
  button:active, button.on { background: #000; color: #fff; }
  button:disabled { opacity: 1; color: #888; border-color: #888; cursor: default; }
  button:disabled:active { background: #fff; color: #888; }
</style>
</head>
<body>
<div class="controls" id="topbar"><button id="compare">Compare</button></div>
<div id="panes"></div>

<script id="engine">
'use strict';
/* ============================================================
   insectdraw — procedural Victorian-style insect plates
   Everything below the UI block is pure generation: no DOM.
   Coordinates: body axis is x = 0, head at top (y increasing
   downward). The RIGHT half (x >= 0) is generated and mirrored.
   ============================================================ */

// ---------- PRNG (mulberry32) ----------
let rng = null;
function mulberry32(seed) {
  let a = seed | 0;
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function randRange(min, max) { return min + (max - min) * rng(); }
function randInt(min, max) { return Math.floor(randRange(min, max + 1)); }
function pick(arr) { return arr[Math.floor(rng() * arr.length)]; }
function jitter(k) { return 1 + randRange(-k, k); }
function hashString(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function dailySeed(date) { return hashString((date || new Date()).toISOString().slice(0, 10)); }

// ---------- vector helpers ----------
const D2R = Math.PI / 180;
function add(a, b) { return [a[0] + b[0], a[1] + b[1]]; }
function sub(a, b) { return [a[0] - b[0], a[1] - b[1]]; }
function mul(a, k) { return [a[0] * k, a[1] * k]; }
function vlen(a) { return Math.hypot(a[0], a[1]); }
function norm(a) { const l = vlen(a) || 1; return [a[0] / l, a[1] / l]; }
function perp(a) { return [-a[1], a[0]]; }
function rot(p, ang) { const c = Math.cos(ang), s = Math.sin(ang); return [p[0] * c - p[1] * s, p[0] * s + p[1] * c]; }
function lerp(a, b, t) { return a + (b - a) * t; }
function lerpP(a, b, t) { return [lerp(a[0], b[0], t), lerp(a[1], b[1], t)]; }
function dirv(deg) { return [Math.cos(deg * D2R), Math.sin(deg * D2R)]; }
function fmt(n) { return Math.round(n * 10) / 10; }

// ---------- bbox tracking (everything emitted passes through here) ----------
let bbox = null;
function bb(p) {
  if (p[0] < bbox.minX) bbox.minX = p[0];
  if (p[0] > bbox.maxX) bbox.maxX = p[0];
  if (p[1] < bbox.minY) bbox.minY = p[1];
  if (p[1] > bbox.maxY) bbox.maxY = p[1];
}

// ---------- stroke classes (tokens replaced once final scale is known) ----------
const SW = { H: 'SW_H', O: 'SW_O', D: 'SW_D', F: 'SW_F' };   // heavy 2.2, outline 1.5, detail 0.8, fine 0.5

// ---------- curves ----------
// pts = [p0, c1, c2, p1, c3, c4, p2, ...]
function cubicBezierPath(pts, closed) {
  bb(pts[0]);
  let d = 'M' + fmt(pts[0][0]) + ',' + fmt(pts[0][1]);
  for (let i = 1; i + 2 < pts.length; i += 3) {
    bb(pts[i]); bb(pts[i + 1]); bb(pts[i + 2]);
    d += ' C' + fmt(pts[i][0]) + ',' + fmt(pts[i][1]) + ' ' + fmt(pts[i + 1][0]) + ',' + fmt(pts[i + 1][1]) + ' ' + fmt(pts[i + 2][0]) + ',' + fmt(pts[i + 2][1]);
  }
  return closed ? d + ' Z' : d;
}
// Catmull-Rom spline through pts -> cubic bezier control list
function catmullRomToBezier(pts, closed, tension) {
  tension = tension === undefined ? 1 : tension;
  const n = pts.length, out = [pts[0]];
  const segs = closed ? n : n - 1;
  for (let i = 0; i < segs; i++) {
    const p0 = pts[closed ? (i - 1 + n) % n : Math.max(i - 1, 0)];
    const p1 = pts[i];
    const p2 = pts[(i + 1) % n];
    const p3 = pts[closed ? (i + 2) % n : Math.min(i + 2, n - 1)];
    out.push(add(p1, mul(sub(p2, p0), tension / 6)), sub(p2, mul(sub(p3, p1), tension / 6)), p2);
  }
  return out;
}
function smoothPath(pts, closed, tension) { return cubicBezierPath(catmullRomToBezier(pts, closed, tension), closed); }
function sampleBezier(bz, perSeg) {
  const out = [];
  for (let i = 1; i + 2 < bz.length; i += 3) {
    const p0 = bz[i - 1], c1 = bz[i], c2 = bz[i + 1], p1 = bz[i + 2];
    for (let k = 0; k < perSeg; k++) {
      const t = k / perSeg, u = 1 - t;
      out.push([u * u * u * p0[0] + 3 * u * u * t * c1[0] + 3 * u * t * t * c2[0] + t * t * t * p1[0],
                u * u * u * p0[1] + 3 * u * u * t * c1[1] + 3 * u * t * t * c2[1] + t * t * t * p1[1]]);
    }
  }
  out.push(bz[bz.length - 1]);
  return out;
}
function sampleSmooth(pts, closed, tension, perSeg) { return sampleBezier(catmullRomToBezier(pts, closed, tension), perSeg || 8); }
function ellipseBezier(c, rx, ry, rotDeg) {
  const k = 0.5523, a = (rotDeg || 0) * D2R;
  const T = p => add(c, rot(p, a));
  return [T([rx, 0]),
    T([rx, ry * k]), T([rx * k, ry]), T([0, ry]),
    T([-rx * k, ry]), T([-rx, ry * k]), T([-rx, 0]),
    T([-rx, -ry * k]), T([-rx * k, -ry]), T([0, -ry]),
    T([rx * k, -ry]), T([rx, -ry * k]), T([rx, 0])];
}
function ellipsePath(c, rx, ry, rotDeg) { return cubicBezierPath(ellipseBezier(c, rx, ry, rotDeg), true); }

// ---------- polygon helpers ----------
function pointInPoly(p, poly) {
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const a = poly[i], b = poly[j];
    if ((a[1] > p[1]) !== (b[1] > p[1]) && p[0] < (b[0] - a[0]) * (p[1] - a[1]) / (b[1] - a[1]) + a[0]) inside = !inside;
  }
  return inside;
}
function outlineYRange(poly, x) {
  let top = Infinity, bot = -Infinity;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const a = poly[i], b = poly[j];
    if ((a[0] <= x && x < b[0]) || (b[0] <= x && x < a[0])) {
      const y = a[1] + (b[1] - a[1]) * (x - a[0]) / (b[0] - a[0]);
      if (y < top) top = y;
      if (y > bot) bot = y;
    }
  }
  return top === Infinity ? null : [top, bot];
}
function plAt(pl, t) { return pl[Math.max(0, Math.min(pl.length - 1, Math.round(t * (pl.length - 1))))]; }
function plYAt(pl, x) {           // polyline monotonic in x
  if (x < pl[0][0] || x > pl[pl.length - 1][0]) return null;
  for (let i = 0; i + 1 < pl.length; i++) {
    const a = pl[i], b = pl[i + 1];
    if (x >= a[0] && x <= b[0]) return b[0] === a[0] ? a[1] : a[1] + (b[1] - a[1]) * (x - a[0]) / (b[0] - a[0]);
  }
  return null;
}

// ---------- element emitters ----------
function pathEl(d, sw, fill) { return '<path d="' + d + '" fill="' + (fill || 'none') + '" stroke-width="' + sw + '"/>'; }
function lineEl(a, b, sw) { bb(a); bb(b); return '<line x1="' + fmt(a[0]) + '" y1="' + fmt(a[1]) + '" x2="' + fmt(b[0]) + '" y2="' + fmt(b[1]) + '" stroke-width="' + sw + '"/>'; }
function polylineEl(pts, sw) { pts.forEach(bb); return '<polyline points="' + pts.map(p => fmt(p[0]) + ',' + fmt(p[1])).join(' ') + '" fill="none" stroke-width="' + sw + '"/>'; }
function polygonEl(pts, sw, fill) { pts.forEach(bb); return '<path d="M' + pts.map(p => fmt(p[0]) + ',' + fmt(p[1])).join(' L') + ' Z" fill="' + (fill || 'none') + '" stroke-width="' + sw + '"/>'; }
function circleEl(c, r, sw, fill) { bb([c[0] - r, c[1] - r]); bb([c[0] + r, c[1] + r]); return '<circle cx="' + fmt(c[0]) + '" cy="' + fmt(c[1]) + '" r="' + fmt(r) + '" fill="' + (fill || 'none') + '" stroke-width="' + sw + '"/>'; }
function bowLine(y, hw, bow, sw) {
  return pathEl(cubicBezierPath([[-hw, y], [-hw * 0.35, y + bow], [hw * 0.35, y + bow], [hw, y]], false), sw);
}

// ---------- body part from a half-width profile ----------
// anchors: [[t, f], ...]  t = 0..1 top->bottom, f = fraction of maxHw
function bodyPart(yTop, length, maxHw, anchors, tension) {
  const right = anchors.map(a => [a[1] * maxHw, yTop + a[0] * length]);
  const pts = right.slice();
  for (let i = right.length - 1; i >= 0; i--) if (right[i][0] > 0.01) pts.push([-right[i][0], right[i][1]]);
  const bz = catmullRomToBezier(pts, true, tension);
  const samples = sampleBezier(bz, 10);
  function hwAt(y) {
    let best = 0;
    for (let i = 0; i + 1 < samples.length; i++) {
      const a = samples[i], b = samples[i + 1];
      if ((a[1] <= y && y <= b[1]) || (b[1] <= y && y <= a[1])) {
        const x = b[1] === a[1] ? Math.max(a[0], b[0]) : a[0] + (b[0] - a[0]) * (y - a[1]) / (b[1] - a[1]);
        if (x > best) best = x;
      }
    }
    return best;
  }
  return { path: cubicBezierPath(bz, true), samples, hwAt, yTop, yBot: yTop + length, length, maxHw,
           yAt: t => yTop + t * length };
}
// shape with a straight inner edge on the centre line (elytron, tegmen)
function halfShield(pts) {
  const bz = catmullRomToBezier(pts, false, 1);
  return cubicBezierPath(bz, false) + ' Z';
}

// ---------- limb segment: tapered, bowed, rounded ends, white fill ----------
// Geometry is kept so hatching, spines and muscle patterns can be laid on the
// segment analytically (they are then masked by whatever is drawn next).
function limbGeom(A, B, w1, w2, bow) {
  const d = norm(sub(B, A)), n = perp(d), L = vlen(sub(B, A));
  const k = L * 0.35, bv = mul(n, bow);
  const edge = side => {
    const a = add(A, mul(n, side * w1 / 2)), b = add(B, mul(n, side * w2 / 2));
    return [a, add(add(a, mul(d, k)), bv), add(sub(b, mul(d, k)), bv), b];
  };
  return { A, B, d, n, L, w1, w2, bow, e1: edge(1), e2: edge(-1), wAt: s => lerp(w1, w2, s) };
}
function bez3(c, s) {
  const u = 1 - s;
  return [u * u * u * c[0][0] + 3 * u * u * s * c[1][0] + 3 * u * s * s * c[2][0] + s * s * s * c[3][0],
          u * u * u * c[0][1] + 3 * u * u * s * c[1][1] + 3 * u * s * s * c[2][1] + s * s * s * c[3][1]];
}
function limbPath(g) {
  const { e1, e2, d, w1, w2 } = g;
  const pts = [
    e1[0], e1[1], e1[2], e1[3],
    add(e1[3], mul(d, w2 * 0.55)), add(e2[3], mul(d, w2 * 0.55)), e2[3],
    e2[2], e2[1], e2[0],
    sub(e2[0], mul(d, w1 * 0.55)), sub(e1[0], mul(d, w1 * 0.55)), e1[0],
  ];
  return cubicBezierPath(pts, true);
}
function limbSegment(A, B, w1, w2, bow) { return pathEl(limbPath(limbGeom(A, B, w1, w2, bow)), SW.O, '#fff'); }
// engraver's shading: short fine lines across the segment from the shaded edge
// inward, so the cylinder reads as round. side = +1 (e1) or -1 (e2).
function limbShade(g, side, spacing) {
  const els = [], edge = side > 0 ? g.e1 : g.e2;
  if (g.L < spacing * 3) return els;
  const s0 = Math.min(0.14, 3 / g.L), s1 = 1 - Math.min(0.14, 3 / g.L);
  let i = 0;
  for (let s = s0; s <= s1; s += spacing / g.L, i++) {
    const w = g.wAt(s);
    if (w < 3) continue;
    const base = bez3(edge, s);
    const fr = (i % 2 === 0 ? 0.58 : 0.4) * (0.75 + 0.25 * Math.sin(Math.PI * s));
    const dir = norm(add(mul(g.n, -side), mul(g.d, 0.3)));
    els.push(lineEl(add(base, mul(dir, 0.5)), add(base, mul(dir, w * fr)), SW.F));
  }
  return els;
}
// fixed spines in a row along one edge, leaning distad
function limbSpines(g, side, spacing, len, s0, s1, sw) {
  const els = [], edge = side > 0 ? g.e1 : g.e2;
  for (let s = s0; s <= s1; s += spacing / g.L) {
    const b = bez3(edge, s);
    const tip = add(b, add(mul(g.n, side * len), mul(g.d, len * 0.75)));
    const root = add(b, mul(g.d, -len * 0.25));
    els.push(pathEl(cubicBezierPath([root, lerpP(root, tip, 0.5), lerpP(b, tip, 0.5), tip], false), sw || SW.D));
    els.push(lineEl(tip, add(b, mul(g.d, len * 0.35)), sw || SW.D));
  }
  return els;
}
// chevron (herringbone) muscle pattern on a saltatorial femur
function femurHerringbone(g, side) {
  const els = [], step = Math.max(3.2, g.L / 22);
  const mid = s => lerpP(bez3(g.e1, s), bez3(g.e2, s), 0.5 - side * 0.08);
  const sm = 0.1, sM = 0.9;
  els.push(pathEl(cubicBezierPath([mid(sm), mid(0.35), mid(0.65), mid(sM)], false), SW.D));
  for (let s = sm + 0.05; s < sM; s += step / g.L) {
    const m = mid(s), w = g.wAt(s), ds = (step * 1.1) / g.L;
    const a1 = bez3(g.e1, s - ds), a2 = bez3(g.e2, s - ds);
    els.push(lineEl(m, lerpP(m, a1, 0.82), SW.F));
    els.push(lineEl(m, lerpP(m, a2, 0.82), SW.F));
  }
  return els;
}
// tarsus: n tarsomeres (basitarsus longest) curling by `curl` deg each, then the pretarsus
function tarsusEls(p, dir0, total, w0, n, curl, opts) {
  const els = [];
  const fr = { 3: [0.45, 0.3, 0.25], 4: [0.36, 0.24, 0.21, 0.19], 5: [0.34, 0.2, 0.17, 0.15, 0.14] }[n];
  let a = dir0, w = w0;
  const dw = w0 * 0.12;
  if (opts && opts.basitarsus) {   // bee: broad flat basitarsus with pollen-comb rows
    const q = add(p, mul(dirv(a), total * 0.42));
    const g = limbGeom(p, q, opts.basitarsus[0], opts.basitarsus[1], 0);
    els.push(pathEl(limbPath(g), SW.O, '#fff'));
    for (let s = 0.2; s < 0.95; s += 0.17) els.push(lineEl(lerpP(bez3(g.e1, s), bez3(g.e2, s), 0.12), lerpP(bez3(g.e1, s), bez3(g.e2, s), 0.88), SW.F));
    p = q; a += curl; w = opts.basitarsus[1] * 0.6;
    for (let k = 1; k < n; k++) {
      const q2 = add(p, mul(dirv(a), total * fr[k] * 0.9));
      els.push(limbSegment(p, q2, w, w - dw, 0));
      p = q2; a += curl; w -= dw;
    }
  } else {
    for (let k = 0; k < n; k++) {
      const q = add(p, mul(dirv(a), total * fr[k]));
      els.push(limbSegment(p, q, w, w - dw, 0));
      p = q; a += curl; w -= dw;
    }
  }
  // pretarsus: two curved claws, and an arolium pad (flies: paired pulvilli)
  const d = dirv(a), n_ = perp(d), cl = Math.max(3, w0 * 1.3);
  for (const s of [-1, 1]) {
    const tip = add(p, add(mul(d, cl * 0.8), mul(n_, s * cl * 0.7)));
    els.push(pathEl(cubicBezierPath([p, add(p, mul(d, cl * 0.6)), add(tip, mul(n_, -s * cl * 0.15)), tip], false), SW.D));
  }
  if (opts && opts.pulvilli) {
    for (const s of [-1, 1]) els.push(pathEl(ellipsePath(add(p, add(mul(d, cl * 0.45), mul(n_, s * cl * 0.38))), cl * 0.32, cl * 0.2, Math.atan2(d[1], d[0]) / D2R + s * 30), SW.F, '#fff'));
    els.push(lineEl(p, add(p, mul(d, cl * 0.9)), SW.F));   // empodium bristle
  } else {
    els.push(pathEl(cubicBezierPath([add(p, mul(n_, -cl * 0.22)), add(p, add(mul(d, cl * 0.55), mul(n_, -cl * 0.25))), add(p, add(mul(d, cl * 0.55), mul(n_, cl * 0.25))), add(p, mul(n_, cl * 0.22))], false), SW.F));
  }
  return { els, tip: p };
}

// ---------- eyes: hexagonal ommatidia lattice clipped to the eye outline ----------
// opts: { rot, dent: [angleDeg, depth], highlight: [dx, dy] (fractions of rx/ry), pitch }
function eyeEls(c, rx, ry, opts) {
  opts = opts || {};
  const rot_ = (opts.rot || 0) * D2R;
  const T = p => add(c, rot(p, rot_));
  // outline: ellipse, optionally dented (kidney / notch) at one angle
  const N = 36, pts = [];
  for (let i = 0; i < N; i++) {
    const a = i / N * Math.PI * 2;
    let r = 1;
    if (opts.dent) {
      const da = Math.atan2(Math.sin(a - opts.dent[0] * D2R), Math.cos(a - opts.dent[0] * D2R));
      const k = Math.max(0, 1 - Math.abs(da) / (opts.dent[2] || 0.9));
      r -= opts.dent[1] * k * k;
    }
    pts.push([Math.cos(a) * rx * r, Math.sin(a) * ry * r]);
  }
  const poly = sampleSmooth(pts, true, 1, 3);
  const els = [pathEl(smoothPath(pts.map(T), true, 1), SW.O, '#fff')];
  const hl = opts.highlight || [-0.42, -0.42];
  const hlR = opts.highlightR || 0.36;
  const pitch = opts.pitch || Math.max(1.9, Math.min(3.2, (rx + ry) / 7.5));
  const R = pitch / Math.sqrt(3) * 0.82;   // hex circumradius, shrunk so the cells separate
  const inset = Math.min(0.88, 1 - pitch * 0.55 / Math.min(rx, ry));
  const hex = [];
  for (let k = 0; k < 6; k++) hex.push([R * Math.cos((k * 60 + 30) * D2R), R * Math.sin((k * 60 + 30) * D2R)]);
  const rowH = pitch * 0.866;
  let row = 0;
  for (let y = -ry; y <= ry; y += rowH, row++) {
    for (let x = -rx + (row % 2) * pitch / 2; x <= rx; x += pitch) {
      const q = [x, y];
      if (!pointInPoly([x / inset, y / inset], poly)) continue;
      const hx = (x - hl[0] * rx) / (hlR * rx), hy = (y - hl[1] * ry) / (hlR * ry);
      if (hx * hx + hy * hy < 1) continue;
      els.push(polygonEl(hex.map(h => T(add(q, h))), SW.F));
    }
  }
  return els;
}

// ---------- antennae (right side) ----------
function shaftPoints(base, dirDeg, length, curveDeg, n) {
  const pts = []; let p = base, a = dirDeg;
  for (let i = 0; i <= n; i++) { pts.push(p); p = add(p, mul(dirv(a), length / n)); a += curveDeg / n; }
  return pts;
}
// evenly spaced points along a polyline by arc length (n+1 points incl. ends)
function alongPl(pl, n) {
  const cum = [0];
  for (let i = 1; i < pl.length; i++) cum.push(cum[i - 1] + vlen(sub(pl[i], pl[i - 1])));
  const total = cum[cum.length - 1], out = [];
  let j = 0;
  for (let k = 0; k <= n; k++) {
    const t = total * k / n;
    while (j + 1 < cum.length - 1 && cum[j + 1] < t) j++;
    const seg = cum[j + 1] - cum[j] || 1;
    out.push(lerpP(pl[j], pl[j + 1], (t - cum[j]) / seg));
  }
  return out;
}
function socketEl(base, r) { return circleEl(base, r, SW.D, '#fff'); }
function antennaEls(kind, base, len, headW) {
  const els = [];
  const sr = Math.max(1.1, headW * 0.035);
  const tdir = (pl, i) => norm(sub(pl[Math.min(i + 1, pl.length - 1)], pl[Math.max(i - 1, 0)]));
  if (kind === 'filiform') {
    // thread-like, many short equal segments shown as fine cross-ticks; tapering slightly
    const nSeg = randInt(18, 30);
    const pts = shaftPoints(base, randRange(-68, -48), len, randRange(-50, -8), 14);
    const pl = sampleSmooth(pts, false, 1, 8);
    const w0 = Math.max(1.6, headW * 0.06);
    const L_ = [], R_ = [];
    for (let i = 0; i < pl.length; i++) {

        bot = vein([[xa + skew, topAt(wing, xa + skew, 0.4)], [lerp(xa, px, 0.5) + skew * 0.5, topAt(wing, lerp(xa, px, 0.5), 0.4) + depth * 0.72], [px, topAt(wing, px, 0.4) + depth], [lerp(px, xb, 0.55), topAt(wing, lerp(px, xb, 0.55), 0.4) + depth * 0.72], [xb + skew, topAt(wing, xb + skew, 0.4)]], 8);
      }
      if (lower) for (let k = 0; k <= 16; k++) { const x = lerp(xa + skew, xb + skew, k / 16); bot.push([x, lower(x)]); }
      const closed = top.concat(bot.slice().reverse());
      const els = [];
      const yT = x => topAt(wing, x, 0.4), yB = x => { const y = plYAt(bot, x); return y === null ? yT(x) : y; };
      if (style === 'solid') els.push(polygonEl(closed.map(wing.T), SW.F, '#000'));
      else {
        els.push(polygonEl(closed.map(wing.T), SW.D, '#fff'));
        if (style === 'cross' || style === 'axis') { const n = style === 'cross' ? 4 : 3; for (let k = 1; k <= n; k++) { const t = k / (n + 1), pl = []; for (let x = xa + 0.3; x <= xb - 0.3; x += 1.2) pl.push([x, lerp(yT(x), yB(x), t)]); if (pl.length > 1) els.push(emitLocalPolyline(wing, pl, style === 'cross' ? SW.D : SW.F)); } }
        if (style === 'cross') for (let x = xa + 1; x < xb; x += 1.7) els.push(lineEl(wing.T([x, yT(x)]), wing.T([x, yB(x)]), SW.F));
        if (style === 'stipple') for (let x = xa + 1; x < xb; x += 1.5) for (let y = yT(x) + 1; y < yB(x) - 0.5; y += 1.5) els.push(circleEl(wing.T([x + randRange(-0.3, 0.3), y]), 0.35, SW.F, '#000'));
      }
      extra.unshift(...els);
      return bot;
    },
    emit() {
      const out = extra.slice();
      for (const c of chains) {
        const pl = g.pl(c.vein);
        if (c.taper) { const k = Math.floor(pl.length * 0.6); out.push(emitLocalPolyline(wing, pl.slice(0, k + 1), c.sw), emitLocalPolyline(wing, pl.slice(k), c.taper)); }
        else out.push(emitLocalPolyline(wing, pl, c.sw));
      }
      for (const e of edges) out.push(emitLocalPolyline(wing, bowVein(e.a, e.b, e.bow, 6), e.sw));
      return out;
    },
  };
  return g;
}

function insectName(seed, type, variant) {
  const r = mulberry32((((seed >>> 0) ^ 0x9E3779B9) >>> 0));   // private PRNG: never touches the drawing's rng
  const pk = arr => arr[Math.floor(r() * arr.length)];
  const kind = variant === 'butterfly' ? 'butterfly' : type;
  const tails = NAME_TAIL[kind] || NAME_TAIL.beetle;

  // genus: capitalised prefix + order-appropriate tail; collapse doubled vowels ("Chryso" + "aeschna" -> "Chrysaeschna")
  const pre = pk(NAME_PREFIX);
  const [tail, gender] = pk(tails);
  let genus = pre + tail;
  if (/[aeiou]$/.test(pre) && /^[aeiou]/.test(tail)) genus = pre.slice(0, -1) + tail;
  genus = genus.charAt(0).toUpperCase() + genus.slice(1).toLowerCase();

  // species epithet: either a Latin adjective or one built from the same syllable tables; agree with genus gender
  const decline = (stem, cls) => {
    if (cls === 'A') return stem + (gender === 'm' ? 'us' : gender === 'f' ? 'a' : 'um');
    if (cls === 'B') return stem + (gender === 'n' ? 'e' : 'is');
    if (cls === 'M') return gender === 'n' ? stem.slice(0, -2) + 'us' : stem;   // minor -> minus, major -> majus
    return stem;
  };
  let species;
  if (r() < 0.25) {
    let p2 = pk(NAME_PREFIX);
    if (p2 === pre) p2 = pk(NAME_PREFIX);
    const [t2, cls] = pk(EPITHET_TAIL);
    let stem = p2.toLowerCase();
    if (/[aeiou]$/.test(stem) && /^[aeiou]/.test(t2)) stem = stem.slice(0, -1);
    species = decline(stem + t2, cls);
  } else {
    const [stem, cls] = pk(EPITHET);
    species = decline(stem, cls);
  }

  // common name: <Adjective> <Noun> [<Base>], never repeating a word
  const c = COMMON[kind] || COMMON.beetle;
  const adjs = c.adj || COMMON_ADJ;
  let adj = pk(adjs), noun = pk(c.nouns);
  for (let i = 0; i < 8 && (adj === noun || adj.split(/[ -]/).includes(noun) || noun.split(/[ -]/).includes(adj)); i++) noun = pk(c.nouns);
  const common = [adj, noun, c.base].filter(Boolean).join(' ');

  return { genus, species, common, binomial: genus + ' ' + species };
}

        abdW: 48 * jitter(0.12), abdLen: 170 * jitter(0.15), legScale: 1.15 * jitter(0.1), abdOverlap: 1,
        thoraxAnchors: [[0, 0.55], [0.35, 1], [0.8, 0.9], [1, 0.45]],
        abdAnchors: [[0, 0.12], [0.22, 0.14], [0.4, 0.75], [0.6, 1], [0.82, 0.7], [0.95, 0.3], [1, 0]],
        antenna: 'geniculate', antLen: 80 * jitter(0.15), abdSeg: randInt(5, 7) });
      break;
    case 'damselfly':
      Object.assign(P, { headW: 58 * jitter(0.1), headH: 22 * jitter(0.12), thoraxW: 36 * jitter(0.12), thoraxLen: 62 * jitter(0.12),
        abdW: 13 * jitter(0.15), abdLen: 290 * jitter(0.1), legScale: 0.55 * jitter(0.1),
        thoraxAnchors: [[0, 0.5], [0.4, 1], [0.9, 0.9], [1, 0.6]],
        abdAnchors: [[0, 0.85], [0.1, 1], [0.5, 0.95], [0.9, 0.9], [0.97, 0.8], [1, 0]],
        antenna: 'setaceous', antLen: 8 * jitter(0.2), abdSeg: 8, wingLen: 230 * jitter(0.08) });
      break;
    case 'mayfly':
      Object.assign(P, { headW: 30 * jitter(0.12), headH: 24 * jitter(0.12), thoraxW: 42 * jitter(0.12), thoraxLen: 56 * jitter(0.12),
        abdW: 24 * jitter(0.15), abdLen: 170 * jitter(0.12), legScale: 0.8 * jitter(0.1),
        thoraxAnchors: [[0, 0.5], [0.4, 1], [0.9, 0.9], [1, 0.55]],
        abdAnchors: [[0, 0.85], [0.15, 1], [0.6, 0.85], [0.9, 0.6], [0.98, 0.4], [1, 0]],
        antenna: 'setaceous', antLen: 7 * jitter(0.2), abdSeg: 8 });
      break;
  }
  meta.variant = P.variant;
  meta.antenna = P.antenna;
  // organic irregularity on profiles
  const wobble = a => a.map(([t, f]) => [t, f === 0 ? 0 : f * jitter(0.03)]);
  P.thoraxAnchors = wobble(P.thoraxAnchors);
  P.abdAnchors = wobble(P.abdAnchors);

  // ---------- layout ----------
  const headTop = 0, headCy = P.headH / 2;
  const thorax = bodyPart(P.headH * 0.8, P.thoraxLen, P.thoraxW / 2, P.thoraxAnchors);
  const abdomen = bodyPart(thorax.yBot - P.abdOverlap, P.abdLen, P.abdW / 2, P.abdAnchors);
  const abdHW = P.abdW / 2;
  meta.thorax = { yTop: thorax.yTop, yBot: thorax.yBot };

  // ---------- abdomen + details ----------
  L.abdomen.push(pathEl(abdomen.path, SW.O, '#fff'));
  {
    const n = P.abdSeg, startT = type === 'bee' ? 0.22 : type === 'wasp' ? 0.3 : 0.08;
    const ys = [];
    for (let i = 0; i <= n; i++) ys.push(abdomen.yAt(startT + (1 - startT) * i / n));
    for (let i = 1; i < n; i++) {
      const y = ys[i], hw = abdomen.hwAt(y);
      if (hw < 2) continue;
      L.abdomen.push(bowLine(y, hw - 0.5, hw * 0.18, SW.D));
    }
    // hatching: fine curves parallel to each boundary, plus bee stripes
    for (let i = 0; i < n; i++) {
      const y0 = ys[i], y1 = ys[i + 1], segH = y1 - y0;
      if (type === 'bee' && i % 2 === 1) {
        for (let y = y0 + 3; y < y1 - 2; y += 2.2) { const hw = abdomen.hwAt(y) - 2; if (hw > 2) L.abdomen.push(bowLine(y, hw, hw * 0.18, SW.F)); }
      } else {
        const k = Math.min(3, Math.floor(segH / 4));
        for (let j = 1; j <= k; j++) {
          const y = y1 - j * 3; const hw = abdomen.hwAt(y) - 3;
          if (hw > 3) L.abdomen.push(bowLine(y, hw, hw * 0.18, SW.F));
        }
      }
      // side texture ticks
      if (type !== 'bee') {
        for (let y = y0 + 4; y < y1 - 3; y += 3) {
          const hw = abdomen.hwAt(y);
          if (hw > 6) { L.abdomen.push(lineEl([hw - 1, y], [hw - 5, y + 0.6], SW.F)); L.abdomen.push(lineEl([-hw + 1, y], [-hw + 5, y + 0.6], SW.F)); }
        }
      }
    }
    if (type === 'wasp' && rng() < 0.6) L.abdomen.push(lineEl([0, abdomen.yBot - 2], [0, abdomen.yBot + randRange(30, 70)], SW.D));   // ovipositor
    if (type === 'mayfly') L.abdomen.push(pathEl(smoothPath(shaftPoints([0, abdomen.yBot - 2], 90, P.abdLen * 0.8, 0, 6), false), SW.D));   // middle tail filament
    if (type === 'dragonfly' || type === 'damselfly') {
      L.abdomen.push(lineEl([0, abdomen.yTop + 4], [0, abdomen.yBot - 6], SW.F));
      const tipY = abdomen.yBot;
      L.abdomen.push(lineEl([2, tipY - 4], [5, tipY + 9], SW.D));
      L.abdomen.push(lineEl([-2, tipY - 4], [-5, tipY + 9], SW.D));
    }
    if (type === 'grasshopper') {
      const tipY = abdomen.yBot;
      L.abdomen.push(lineEl([3, tipY - 6], [6, tipY + 6], SW.D));
      L.abdomen.push(lineEl([-3, tipY - 6], [-6, tipY + 6], SW.D));
    }
  }

  // ---------- thorax + head ----------
  L.thoraxHead.push(pathEl(thorax.path, SW.O, '#fff'));
  {
    const sub = P.subSeg, t0 = thorax.yTop, len = thorax.length;
    for (let i = 1; i < sub; i++) { const y = t0 + len * i / sub, hw = thorax.hwAt(y); L.thoraxHead.push(bowLine(y, hw - 0.5, hw * 0.15, SW.D)); }
    if (type === 'beetle') {
      L.thoraxHead.push(lineEl([0, t0 + len * 0.12], [0, t0 + len * 0.95], SW.F));
      const hw1 = thorax.hwAt(t0 + len * 0.3);
      L.thoraxHead.push(pathEl(cubicBezierPath([[-hw1 * 0.55, t0 + len * 0.12], [-hw1 * 0.3, t0 + len * 0.06], [hw1 * 0.3, t0 + len * 0.06], [hw1 * 0.55, t0 + len * 0.12]], false), SW.D));
      for (const s of [-1, 1]) L.thoraxHead.push(pathEl(cubicBezierPath([[s * hw1 * 0.75, t0 + len * 0.25], [s * hw1 * 0.9, t0 + len * 0.5], [s * hw1 * 0.8, t0 + len * 0.75], [s * hw1 * 0.6, t0 + len * 0.9]], false), SW.F));
    } else if (type === 'grasshopper') {
      L.thoraxHead.push(lineEl([0, t0 + len * 0.08], [0, t0 + len * 0.96], SW.D));
      const hwB = thorax.hwAt(t0 + len * 0.9);
      for (const s of [-1, 1]) L.thoraxHead.push(pathEl(cubicBezierPath([[s * hwB * 0.45, t0 + len * 0.5], [s * hwB * 0.6, t0 + len * 0.75], [s * hwB * 0.7, t0 + len * 0.9], [s * hwB * 0.75, t0 + len * 1.0]], false), SW.F));
    } else if (type === 'dragonfly') {
      const hwM = thorax.hwAt(t0 + len * 0.5);
      for (const s of [-1, 1]) {
        L.thoraxHead.push(lineEl([s * hwM * 0.25, t0 + len * 0.3], [s * hwM * 0.85, t0 + len * 0.72], SW.D));
        L.thoraxHead.push(lineEl([s * hwM * 0.35, t0 + len * 0.18], [s * hwM * 0.95, t0 + len * 0.6], SW.F));
      }
      L.thoraxHead.push(bowLine(t0 + len * 0.3, hwM * 0.9, hwM * 0.2, SW.D));
    } else {
      const yA = t0 + len * 0.38, yB = t0 + len * 0.72;
      L.thoraxHead.push(bowLine(yA, thorax.hwAt(yA) - 0.5, thorax.hwAt(yA) * 0.25, SW.D));
      L.thoraxHead.push(bowLine(yB, thorax.hwAt(yB) - 0.5, thorax.hwAt(yB) * 0.2, SW.D));
      // scutellum
      const hwB = thorax.hwAt(yB);
      L.thoraxHead.push(pathEl(cubicBezierPath([[-hwB * 0.3, thorax.yBot - 4], [-hwB * 0.15, thorax.yBot + 6], [hwB * 0.15, thorax.yBot + 6], [hwB * 0.3, thorax.yBot - 4]], false), SW.D));
      if (type === 'moth') {   // fuzzy thorax: ticks around the edge
        for (let y = t0 + 6; y < thorax.yBot - 4; y += 3.2) { const hw = thorax.hwAt(y); for (const s of [-1, 1]) L.thoraxHead.push(lineEl([s * (hw - 0.5), y], [s * (hw - 4), y + 1.2], SW.F)); }
      }
    }
    if (type === 'beetle') {   // scutellum triangle sits over the elytra junction
      L.thoraxHead.push(pathEl(cubicBezierPath([[-7, thorax.yBot - 3], [-3, thorax.yBot + 9], [3, thorax.yBot + 9], [7, thorax.yBot - 3], [4, thorax.yBot - 4], [-4, thorax.yBot - 4], [-7, thorax.yBot - 3]], true), SW.D, '#fff'));
    }
  }
  // head
  const hr = { x: P.headW / 2, y: P.headH / 2 };
  L.thoraxHead.push(pathEl(ellipsePath([0, headCy], hr.x, hr.y, 0), SW.O, '#fff'));
  {
    // [cx/headW, rx/headW, ry/headH, cy offset/headH, opts]  -- see docs/research-legs-eyes-antennae.md
    const E = {
      beetle: [0.36, 0.12, 0.25, -0.02, { dent: [-125, 0.32, 0.8] }],                 // oval, notched at the antennal socket
      moth: [0.33, 0.16, 0.27, -0.03, {}],                                            // large and round
      fly: [0.28, 0.24, 0.42, -0.03, { highlight: [-0.3, -0.5], highlightR: 0.3 }],   // holoptic: nearly meeting on top
      bee: [0.34, 0.14, 0.4, -0.03, { dent: [180, 0.22, 0.75] }],                      // kidney-shaped
      wasp: [0.34, 0.13, 0.38, -0.03, { dent: [180, 0.22, 0.75] }],
      dragonfly: [0.25, 0.25, 0.42, 0.06, { highlight: [-0.25, -0.5], highlightR: 0.3 }], // huge, meeting on the midline
      damselfly: [0.4, 0.11, 0.44, 0, {}],                                            // dumbbell head: eyes at the ends
      grasshopper: [0.32, 0.13, 0.3, -0.08, {}],
      cranefly: [0.33, 0.14, 0.32, -0.03, {}],
      lacewing: [0.34, 0.15, 0.32, -0.03, {}],
      cicada: [0.42, 0.09, 0.3, -0.03, {}],                                           // bulging at the head corners
      mayfly: [0.28, 0.2, 0.4, -0.03, {}],
    }[type];
    for (const s of [-1, 1]) L.thoraxHead.push(...eyeEls([s * P.headW * E[0], headCy + P.headH * E[3]], P.headW * E[1], P.headH * E[2], E[4]));
    if (type !== 'beetle' && type !== 'moth') {   // ocelli
      const oc = type === 'fly' || type === 'dragonfly' || type === 'mayfly' ? [[0, -0.42], [0.06, -0.34]] : [[0, -0.18], [0.09, -0.08]];
      const r = type === 'dragonfly' ? 1.1 : 1.3;
      L.thoraxHead.push(circleEl([0, headCy + P.headH * oc[0][1]], r, SW.D));
      L.thoraxHead.push(circleEl([-P.headW * oc[1][0], headCy + P.headH * oc[1][1]], r, SW.D));
      L.thoraxHead.push(circleEl([P.headW * oc[1][0], headCy + P.headH * oc[1][1]], r, SW.D));
    }
    if (type === 'beetle' || type === 'grasshopper') {   // mandibles
      for (const s of [-1, 1]) L.thoraxHead.push(pathEl(cubicBezierPath([[s * P.headW * 0.16, headTop + 2], [s * P.headW * 0.14, headTop - 4], [s * P.headW * 0.07, headTop - 7], [s * P.headW * 0.02, headTop - 6]], false), SW.D));
    }
    if (type === 'bee' || type === 'fly') {   // clypeus line
      L.thoraxHead.push(bowLine(headCy - P.headH * 0.28, P.headW * 0.16, -P.headH * 0.08, SW.F));
    }
  }

  // ---------- tegulae over the forewing roots ----------
  if (['moth', 'bee', 'wasp', 'lacewing', 'cicada'].includes(type)) {
    const ty = thorax.yAt(type === 'moth' || type === 'lacewing' ? 0.35 : 0.4), tx = thorax.hwAt(ty) * 0.72 + 2;   // sits over the wing root
    L.tegulae.push(pathEl(ellipsePath([tx, ty], 5, 3.5, 30), SW.D, '#fff'));
  }

  // ---------- antennae ----------
  {
    // antennal sockets sit on the front of the head between the eyes
    const AB = { dragonfly: [0.14, 0.12], damselfly: [0.12, 0.25], fly: [0.055, 0.2], bee: [0.16, 0.3], wasp: [0.16, 0.3], moth: [0.16, 0.3], beetle: [0.2, 0.3], grasshopper: [0.13, 0.24], mayfly: [0.08, 0.2], cicada: [0.22, 0.3] }[type] || [0.18, 0.28];
    const base = [P.headW * AB[0], headTop + P.headH * AB[1]];
    L.antennae.push(...antennaEls(P.antenna, base, P.antLen, P.headW));
    if (type === 'mayfly') L.antennae.push(pathEl(smoothPath(shaftPoints([3, abdomen.yBot - 2], 72, P.abdLen * 0.85, 14, 8), false), SW.D));   // outer tail filaments
  }

  // ---------- legs ----------
  {
    const u = P.legScale * (thorax.length / 60);
    // leg thickness follows body size, with slender-legged orders thinned further
    const wk = Math.sqrt(thorax.length / 60) * ({ beetle: 1.15, fly: 0.85, cranefly: 0.42, dragonfly: 0.8, damselfly: 0.62, mayfly: 0.72, moth: 0.85, lacewing: 0.8, grasshopper: 0.95 }[type] || 1);
    const widths = [[6, 5], [7, 5], [5, 3.2], [3, 1.8]].map(w => [w[0] * wk, w[1] * wk]);
    const tarsomeres = { dragonfly: 3, damselfly: 3, grasshopper: 3, cicada: 3, mayfly: 4, beetle: rng() < 0.3 ? 4 : 5 }[type] || 5;
    let specs;
    if (type === 'dragonfly' || type === 'damselfly') {
      specs = [
        { t: 0.16, dirs: [-60, -55, -120, -130], lens: [8, 36, 36, 18] },
        { t: 0.3, dirs: [-30, -25, -95, -105], lens: [8, 42, 42, 20] },
        { t: 0.44, dirs: [-12, -8, -75, -90], lens: [8, 48, 48, 22] },
      ];
    } else {
      specs = [
        { t: 0.25, dirs: [-50, -45, -105, -120], lens: [10, 42, 40, 22] },
        { t: 0.55, dirs: [-10, -5, 50, 70], lens: [10, 48, 46, 24] },
        { t: 0.85, dirs: [25, 35, 85, 100], lens: [10, 55, 55, 26] },
      ];
      if (type === 'grasshopper') specs[2] = { t: 0.85, dirs: [30, 55, 92, 100], lens: [12, 95, 95, 30] };
    }
    const legMeta = [];
    for (let i = specs.length - 1; i >= 0; i--) {     // hind first so front overlaps
      const s = specs[i];
      const y = thorax.yAt(s.t), hw = thorax.hwAt(y);
      const attach = [hw - 5, y];   // coxa starts under the thorax edge
      const dirJ = randRange(-6, 6);
      const spec = {
        dirs: s.dirs.map(d => d + dirJ),
        lens: s.lens.map((l, k) => l * (k === 0 ? 1 : u) * jitter(0.08)),
        widths: widths.map(w => w.slice()),
        curl: randRange(8, 14), spines: null, bowSign: 1, tarsomeres, spurs: 2, spurLen: 1.1,
      };
      const W = (k, a, b) => { spec.widths[k] = [a * wk, b * wk]; };
      switch (type) {
        case 'grasshopper':
          if (i === 2) {   // saltatorial: huge femur with chevron muscles, serrated tibia, two pairs of apical spurs
            W(1, 15, 6); W(2, 5.5, 3.2); spec.lens[0] = 12; spec.herringbone = true; spec.bowSign = -1;
            spec.spines = { tibia: true, side: 'outer', double: true, spacing: 5, len: 0.75 };
            spec.spursOuter = true; spec.spurLen = 1.4;
          } else spec.spurs = 1;
          break;
        case 'bee':
          spec.spurs = 1;
          if (i === 2) {   // corbicula + flat basitarsus; the leg is swung outward so the tibia clears the wing
            W(2, 4.5, 9.5); spec.corbicula = true; spec.basitarsus = [7 * wk, 6 * wk]; spec.spurs = 0;
            spec.dirs = [25 + dirJ, 52 + dirJ, 100 + dirJ, 115 + dirJ]; spec.lens = spec.lens.map((l, k) => k === 0 ? l : l * 1.18);
          }
          break;
        case 'wasp':
          if (i > 0) spec.spines = { tibia: true, side: 'outer', spacing: 7, len: 0.45, sw: SW.F };
          break;
        case 'fly':
          spec.pulvilli = true; spec.spurs = 0;
          spec.spines = { femur: true, tibia: true, side: 'outer', spacing: 7.5, len: 0.5, sw: SW.F };   // bristles
          break;
        case 'cranefly':
          spec.spurs = 1; spec.spurLen = 1.6; spec.shade = false;
          break;
        case 'dragonfly': case 'damselfly':   // spiny legs held forward as a prey basket
          spec.spurs = 0;
          spec.spines = { femur: true, tibia: true, side: 'inner', spacing: 4.5, len: 1.0, sw: SW.F };
          break;
        case 'cicada':
          if (i === 0) { W(1, 9.5, 5); spec.femurTeeth = 3; }   // fore femora armed beneath with strong teeth
          break;
        case 'mayfly':
          spec.spurs = 0;
          if (i === 0) spec.lens = spec.lens.map((l, k) => k === 0 ? l : l * 1.6);
          break;
        case 'lacewing': spec.spurs = 1; break;
        case 'beetle': spec.spurLen = 0.9; break;
      }
      L.legs.push(...legEls(attach, spec, legMeta));
      legMeta[legMeta.length - 1].hw = hw;
      legMeta[legMeta.length - 1].pair = ['front', 'mid', 'hind'][i];
    }
    meta.legs = legMeta;
  }

  // ---------- wings / covers ----------
  if (type === 'moth') {
    const isB = P.variant === 'butterfly';
    const fam = isB ? pick(['nymphalid', 'satyrine', 'pierid', 'lycaenid', 'papilionid']) : pick(['noctuid', 'noctuid', 'geometrid', 'arctiid', 'saturniid', 'sphingid', 'plain']);
    meta.recipe = fam;
    // ---- wing-shape genes. The family biases the silhouette (rounded pierid, angular nymphalid, tailed
    // papilionid, narrow noctuid, broad geometrid, long-winged sphingid); every value is still rolled per seed. ----
    const FS = {   // len/h scale the span; apexY = apex height, sharp = apex pointedness, tornus = termen slant, odds of scallops / tails / falcate margin, hind size
      nymphalid:  { len: 1.0, h: 0.95, apexY: [0.5, 0.66], sharp: [0.3, 0.9], tornus: [0.78, 0.9], scallop: 0.6, tail: 0.1, hind: [0.95, 1.1], concave: 0.5 },
      satyrine:   { len: 0.96, h: 0.95, apexY: [0.48, 0.6], sharp: [0, 0.4], tornus: [0.8, 0.9], scallop: 0.4, tail: 0, hind: [1.0, 1.15], concave: 0.1 },
      pierid:     { len: 1.0, h: 0.92, apexY: [0.5, 0.62], sharp: [0.1, 0.6], tornus: [0.8, 0.92], scallop: 0.1, tail: 0, hind: [0.95, 1.1], concave: 0.1 },
      lycaenid:   { len: 0.9, h: 0.88, apexY: [0.46, 0.58], sharp: [0.2, 0.7], tornus: [0.78, 0.9], scallop: 0.15, tail: 0.35, hind: [0.9, 1.05], concave: 0.1 },
      papilionid: { len: 1.08, h: 1.0, apexY: [0.56, 0.7], sharp: [0.4, 1], tornus: [0.72, 0.86], scallop: 0.5, tail: 0.75, hind: [1.0, 1.15], concave: 0.6 },
      noctuid:    { len: 1.0, h: 0.72, apexY: [0.32, 0.44], sharp: [0.3, 0.9], tornus: [0.7, 0.86], scallop: 0.3, tail: 0, hind: [0.85, 1.0], concave: 0.2 },
      geometrid:  { len: 1.0, h: 0.92, apexY: [0.42, 0.56], sharp: [0.2, 0.8], tornus: [0.78, 0.9], scallop: 0.5, tail: 0.05, hind: [1.0, 1.15], concave: 0.3 },
      arctiid:    { len: 1.0, h: 0.8, apexY: [0.36, 0.48], sharp: [0.1, 0.6], tornus: [0.74, 0.88], scallop: 0.2, tail: 0, hind: [0.85, 1.0], concave: 0.1 },
      saturniid:  { len: 1.05, h: 0.98, apexY: [0.46, 0.6], sharp: [0.4, 1], tornus: [0.72, 0.86], scallop: 0.4, tail: 0.3, hind: [1.0, 1.2], concave: 0.6 },
      sphingid:   { len: 1.15, h: 0.62, apexY: [0.3, 0.4], sharp: [0.6, 1], tornus: [0.62, 0.78], scallop: 0.15, tail: 0, hind: [0.6, 0.75], concave: 0.4 },
      plain:      { len: 1.0, h: 0.8, apexY: [0.36, 0.5], sharp: [0.2, 0.7], tornus: [0.74, 0.88], scallop: 0.3, tail: 0, hind: [0.85, 1.05], concave: 0.2 },
    }[fam];
    const rr = r => randRange(r[0], r[1]);
    const W = P.wingSpan * FS.len, H = P.wingSpan * FS.h;
    const G = {
      apexX: randRange(0.94, 1.04), apexY: rr(FS.apexY), sharp: rr(FS.sharp), tornusX: rr(FS.tornus), tornusY: randRange(0.28, 0.46),
      concave: rng() < FS.concave ? randRange(0.03, 0.08) : 0,                    // falcate: the termen is scooped just below the apex
      scallop: rng() < FS.scallop, tail: rng() < FS.tail ? (fam === 'papilionid' ? randRange(0.14, 0.3) : randRange(0.07, 0.18)) : 0, hindK: rr(FS.hind), hindLobe: randRange(0.62, 0.78),
      // discal cell corners (fractions of W / H), R-branch count and stalking, Sc and 1A endpoints
      fU: [randRange(0.46, 0.6), randRange(0.2, 0.32)], fD: [randRange(0.4, 0.55), randRange(0.0, 0.12)],
      hU: [randRange(0.34, 0.46), randRange(0.08, 0.17)], hD: [randRange(0.3, 0.42), randRange(0.26, 0.36)],
      nR: randInt(3, 5), nRh: randInt(2, 3), stalk: randInt(1, 3), stemL: randRange(0.03, 0.08), scX: randRange(0.56, 0.7), aX: randRange(0.36, 0.5),

    };
    meta.wingSig = ['lep', isB ? 'b' : 'm', fam, G.heavy ? 1 : 0, Math.round(G.sweep / 4), Math.round(G.hindSweep / 4), G.nR, G.nRh, G.stalk, G.scallop ? 1 : 0, G.tail > 0 ? 1 : 0, G.concave > 0 ? 1 : 0, Math.round(G.apexY * 10), Math.round(G.sharp * 2),

    const hRaw = isB
      ? [[W * 0.4 * j(), H * 0.02], [W * 0.68 * j(), H * 0.15 * j()], [W * 0.7 * j(), H * 0.45 * j()], [W * 0.5 * j(), H * (G.hindLobe - 0.06) * j()], [W * 0.28 * j(), H * G.hindLobe], [W * 0.06, H * 0.5]]
      : [[W * 0.4 * j(), -H * 0.02], [W * 0.68 * j(), H * 0.12 * j()], [W * 0.66 * j(), H * 0.42 * j()], [W * 0.45 * j(), H * (G.hindLobe - 0.09) * j()], [W * 0.22 * j(), H * (G.hindLobe - 0.04)], [W * 0.05, H * 0.5]];

    if (G.tail) {
      const root = hwPts[3], dir = norm(sub(root, hO)), tip = add(root, mul(dir, W * G.tail));
      const side = perp(dir);
      hwPts.splice(3, 1, add(root, mul(side, -W * 0.025)), add(lerpP(root, tip, 0.9), mul(side, -W * 0.012)), tip, add(lerpP(root, tip, 0.9), mul(side, W * 0.012)), add(root, mul(side, W * 0.025)));

    const fore = makeWing(base, G.sweep, fwPts, 1), hind = makeWing(base, G.sweep + G.hindSweep, hwPts, 1);

    // Comstock-Needham layout: a closed discal cell near the wing centre; Sc+R1 runs
    // along the costa; R2-R5 fan from the cell's upper corner to the apex; M1-M3 leave

    function lepVeins(wing, b, U, D, nR, scX, aX, xMin, nStalk, stemL) {
      const vs = [];
      const bowed = (p, q, k) => { const n = perp(norm(sub(q, p))); return vein([p, add(lerpP(p, q, 0.5), mul(n, k)), q]); };
      const cellTop = bowed(b, U, -W * randRange(0.005, 0.025)), cellBot = bowed(b, D, W * randRange(0.004, 0.02));
      // discocellular: two or three pieces meeting at obtuse angles (ref lep-agrotis / lep-papilio), concave toward the base

      dcPts.push(D);
      const dcv = []; for (let k = 0; k + 1 < dcPts.length; k++) { const seg = vein([dcPts[k], dcPts[k + 1]], 4); dcv.push(...(k ? seg.slice(1) : seg)); }

      vs.push(bowed(plAt(cellBot, randRange(0.55, 0.75)), tg[nR + 4], W * randRange(0.006, 0.018)));

      if (rng() < 0.6) vs.push(bowed([b[0], b[1] + H * 0.05], [aX * 0.35, botAt(wing, aX * 0.35, 0.5)], W * 0.01));          // 3A, short, at the base

    }

    // ---- venation ----
    const hB = mul([W * 0.01, H * 0.1], hk), hU = [W * G.hU[0] * hk, H * G.hU[1] * hk], hD = [W * G.hD[0] * hk, H * G.hD[1] * hk];
    const fB = [W * 0.01, H * 0.02], fU = [W * G.fU[0], -H * G.fU[1]], fD = [W * G.fD[0], H * G.fD[1]];
    const hVeins = lepVeins(hind, hB, hU, hD, G.nRh, W * 0.42 * hk, W * 0.28 * hk, W * 0.45 * hk, 1, 0.05);
    const nR = G.nR;
    const fVeins = lepVeins(fore, fB, fU, fD, nR, W * G.scX, W * G.aX, W * Math.min(0.62, G.tornusX - 0.06), G.stalk, G.stemL);
    const ends = vs => vs.slice(4).filter(v => v.length > 2).map(v => v[v.length - 1]);   // marginal vein tips, apex -> inner margin
    const SF = lepSpace(fore, [W * 0.1, 0], ends(fVeins), nR + 3);       // cells posterior to M3 start at nR+3
    const SH = lepSpace(hind, hO, ends(hVeins), G.nRh + 3);

    // ---- pattern: a compositional ground plan (docs/research-lepidoptera-wings.md). Every element
    // (basal field, bands, cross-lines, discal element, ocelli, spot rows, submarginal, margin, apical
    // patch, oblique streaks, vein tips, dusting, fringe, hatch geometry) is rolled independently with its
    // own position, tone and shape; the family only biases the odds, so no two seeds share a layout. ----
    const P01 = p => rng() < p;
    const F = {   // ground tone weights [white, light, mid]; element odds; bands = weighted counts
      nymphalid:  { ground: [0.4, 0.45, 0.15], basal: 0.8, bands: [0, 1, 2, 2, 3], lines: 0.2, discal: ['none', 'none', 'dot', 'lunule'], ocelli: 0.6, row: 0.2, submarg: 0.8, margin: 0.9, apical: 0.3, streaks: 0.1, tips: 0.3, cheq: 0.15 },
      satyrine:   { ground: [0.1, 0.5, 0.4], basal: 0.7, bands: [0, 1, 1, 2], lines: 0.1, discal: ['none', 'none', 'dot'], ocelli: 0.95, row: 0.1, submarg: 0.8, margin: 0.9, apical: 0.2, streaks: 0, tips: 0.1, cheq: 0.1 },
      pierid:     { ground: [0.85, 0.15, 0], basal: 0.6, bands: [0, 0, 1], lines: 0.05, discal: ['dot', 'dot', 'none', 'lunule'], ocelli: 0.1, row: 0.15, submarg: 0.3, margin: 0.5, apical: 0.85, streaks: 0, tips: 0.6, cheq: 0.1 },
      lycaenid:   { ground: [0.5, 0.4, 0.1], basal: 0.7, bands: [0, 1, 1], lines: 0.1, discal: ['none', 'dot', 'lunule'], ocelli: 0.3, row: 0.85, submarg: 0.8, margin: 0.9, apical: 0.1, streaks: 0, tips: 0.2, cheq: 0.3 },
      papilionid: { ground: [0.3, 0.5, 0.2], basal: 0.5, bands: [1, 2, 2, 3], lines: 0.1, discal: ['none', 'dot'], ocelli: 0.4, row: 0.3, submarg: 0.9, margin: 0.9, apical: 0.3, streaks: 0.4, tips: 0.4, cheq: 0.2 },
      noctuid:    { ground: [0.1, 0.6, 0.3], basal: 0.6, bands: [0, 1, 1, 2], lines: 0.9, discal: ['stigmata', 'stigmata', 'stigmata', 'lunule'], ocelli: 0.05, row: 0.1, submarg: 0.9, margin: 0.5, apical: 0.2, streaks: 0.2, tips: 0.3, cheq: 0.6 },
      geometrid:  { ground: [0.5, 0.4, 0.1], basal: 0.4, bands: [0, 1, 1, 2], lines: 0.95, discal: ['dot', 'dot', 'none'], ocelli: 0.05, row: 0.05, submarg: 0.7, margin: 0.5, apical: 0.2, streaks: 0.1, tips: 0.3, cheq: 0.4 },
      arctiid:    { ground: [0.7, 0.2, 0.1], basal: 0.4, bands: [2, 3, 3, 4], lines: 0.1, discal: ['none', 'dot'], ocelli: 0.1, row: 0.3, submarg: 0.4, margin: 0.5, apical: 0.2, streaks: 0.3, tips: 0.3, cheq: 0.2 },
      saturniid:  { ground: [0.2, 0.6, 0.2], basal: 0.5, bands: [1, 2, 2], lines: 0.5, discal: ['eyespot', 'eyespot', 'eyespot', 'lunule'], ocelli: 0.1, row: 0.1, submarg: 0.8, margin: 0.7, apical: 0.5, streaks: 0.1, tips: 0.2, cheq: 0.2 },
      sphingid:   { ground: [0.2, 0.6, 0.2], basal: 0.7, bands: [0, 1, 1], lines: 0.3, discal: ['dot', 'none'], ocelli: 0.05, row: 0, submarg: 0.5, margin: 0.6, apical: 0.3, streaks: 0.9, tips: 0.2, cheq: 0.1 },
      plain:      { ground: [0.4, 0.5, 0.1], basal: 0.5, bands: [0, 0, 1], lines: 0.4, discal: ['none', 'dot', 'lunule'], ocelli: 0.05, row: 0.05, submarg: 0.4, margin: 0.5, apical: 0.2, streaks: 0.1, tips: 0.3, cheq: 0.3 },

    const ground = wpick(F.ground);

    const eyeRings = (dark) => {   // concentric rings, innermost first, alternating tone

    const Q = {
      ground,
      basal: P01(F.basal) ? { u: randRange(0.14, 0.4), lv: contrast(randInt(1, 3)), wave: randRange(0, 0.04), amp: randRange(0, 0.04), edge: pick(['fine', null, 'det']) } : null,
      bands: slots(pick(F.bands), 0.28, 0.9).map(u => ({ u, w: randRange(0.03, 0.16), lv: contrast(randInt(0, 4)), wave: randRange(-0.04, 0.04), teeth: randInt(1, 3),
        slope: P01(0.3) ? randRange(-0.2, 0.2) : 0, amp: randRange(0, 0.06), m3x: randRange(0, 0.05), drop: P01(0.3) ? randRange(0.1, 0.35) : 0, edge: pick([null, 'fine', 'fine', 'det']) })),
      lines: P01(F.lines) ? slots(randInt(1, 3), 0.22, 0.8).map(u => ({ u, amp: randRange(0.008, 0.035), teeth: randInt(1, 4), doubled: P01(0.5), amp2: randRange(0, 0.02) })) : [],
      discal: pick(F.discal),
      discalP: { r: randRange(1.6, 3.6), ring: P01(0.4), rEye: W * randRange(0.06, 0.13), rings: eyeRings(), clav: P01(0.5), paleCore: P01(0.6), dash: P01(0.5) },
      ocelli: P01(F.ocelli) ? { u: randRange(0.66, 0.8), r: randRange(3, 7), lo: randInt(-3, 0), hi: randInt(0, 2), p: randRange(0.55, 1), rings: pick([[[0.4, 0], [1, 3]], [[0.28, 0], [0.5, 4], [0.78, 1], [1, 3]], [[0.5, 4], [1, 0]], [[1, 3]], eyeRings(true)]), pupil: P01(0.6), outline: P01(0.7) } : null,

      submarg: P01(F.submarg) ? { kind: pick(['lunules', 'chevrons', 'paleLine', 'shadeLine', 'dots', 'lunules']), u: randRange(0.8, 0.9), lv: contrast(randInt(1, 3)), w: randRange(0.03, 0.07) } : null,
      margin: P01(F.margin) ? { u: randRange(0.9, 0.96), lv: contrast(randInt(1, 3)), white: P01(0.4), wave: randRange(0, 0.02) } : null,

      hatch: { crossF: randRange(125, 155), crossH: randRange(140, 170), focusF: -W * randRange(1.2, 2.4), focusH: -W * randRange(0.4, 0.9), spacing: randRange(2.2, 2.7), xSpacing: randRange(2.4, 3.0), stipple: P01(0.7) },

    meta.patternSig = [Q.ground, Q.basal ? Q.basal.lv : '-', Q.bands.map(b => b.lv + (b.drop ? 'd' : '') + (b.edge || '')).join(''), Q.lines.map(l => l.teeth + (l.doubled ? 'd' : '')).join(''), Q.discal, Q.ocelli ? 'o' + Q.ocelli.lo + Q.ocelli.hi : '', Q.row ? 'r' : '', Q.submarg ? Q.submarg.kind : '', Q.margin ? 'm' + Q.margin.lv + (Q.margin.white ? 'w' : '') : '', Q.apical ? 'a' + Q.apical.cells : '', Q.streaks ? 's' + Q.streaks.n : '', Q.tips ? 't' : '', Q.dust ? 'u' : '', Q.cheq ? 'c' : '', Q.hind.plain ? 'hp' : 'h'].join('|');
    const disl = (S, amp, m3x) => { const a = []; for (let c = 0; c < S.n; c++) a.push(randRange(-amp, amp) + (c >= S.m3 ? (m3x || 0) : 0)); return a; };
    function lepPattern(S, wing, hindW) {

      const curve = (uFn, c0, c1, gap) => lepCurve(wing, S, uFn, c0 === undefined ? 0 : c0, c1 === undefined ? last : c1, gap === undefined ? 0.05 : gap);
      const bandFn = opt => { const d = opt.dis || S.zero, wv = opt.wave || 0, sl = opt.slope || 0, th = opt.teeth || 1; return (c, t) => opt.u + d[c] + sl * (n > 1 ? c / (n - 1) : 0) + wv * Math.sin(Math.PI * th * t); };
      const band = (opt, edge) => {
        const f = bandFn(opt);
        o.elems.push((u, th, c, t) => Math.abs(u - f(c, t)) < opt.w / 2 ? opt.lv : -1);
        if (edge) o[edge].push(...curve((c, t) => f(c, t) - opt.w / 2), ...curve((c, t) => f(c, t) + opt.w / 2));
      };
      const basal = (opt, edge) => { o.elems.push(lepEl.basal(S, opt)); if (edge) { const d = opt.dis || S.zero, wv = opt.wave || 0; o[edge].push(...curve((c, t) => opt.u + d[c] + wv * Math.sin(Math.PI * t))); } };
      const margin = (opt, edge) => { o.elems.push(lepEl.margin(S, opt)); if (edge) { const d = opt.dis || S.zero; o[edge].push(...curve(c => opt.u + d[c])); } };
      const wavy = (u, amp, teeth, d) => (c, t) => u + d[c] + amp * Math.sin(Math.PI * teeth * t);
      const spot = (P, r, rings, opt) => {
        opt = opt || {};
        o.spots.push(lepSpot({ P, r, ry: opt.ry, rot: opt.rot, rings }));
        const deg = (opt.rot || 0) / D2R, ry = opt.ry || r;
        if (opt.outline) o.after.push(pathEl(ellipsePath(wing.T(P), r, ry, deg), SW.D));
        if (opt.pupil) o.after.push(pathEl(ellipsePath(wing.T(P), r * opt.pupil, ry * opt.pupil, deg), SW.D));
      };
      const cellSpot = (c, u, rWant, rings, opt) => {
        if (c < 0 || c > last) return;
        const r = Math.min(rWant, 0.5 * S.cellW(c, u));
        if (r < 1.2) return;
        const P = S.point(S.mid(c), u);
        if (wing.inside(P)) spot(P, r, rings, opt);
      };
      const discal = k => lerpP(B, lerpP(U, Dd, 0.5), k);   // along the discal cell's axis; k = 1 is the discocellular
      const D = Q.discalP;

      if (hindW && Q.hind.plain) {   // plain hindwing: a pale field, maybe a discal lunule, a margin
        if (Q.basal) basal({ u: Q.basal.u + 0.1, lv: Math.min(1, Q.basal.lv), dis: disl(S, Q.basal.amp), wave: Q.basal.wave });
        if (P01(0.6)) cellSpot(S.m3 - 2, 0.5, 3, [[0.55, 0], [1, 2]]);
        if (Q.margin) { margin({ u: Q.margin.u - 0.06, lv: Math.min(2, Q.margin.lv) }); }
        if (Q.bands.length && P01(0.5)) { const b = Q.bands[0]; band({ u: Math.min(0.8, b.u + 0.1), w: b.w, lv: Math.min(2, b.lv), dis: disl(S, b.amp), wave: b.wave }); }
        return o;
      }
      // basal field
      if (Q.basal && keep()) basal({ u: Q.basal.u + sh, lv: Q.basal.lv, dis: disl(S, Q.basal.amp), wave: Q.basal.wave }, Q.basal.edge);
      // costal dusting
      if (Q.dust && !hindW) o.elems.push(lepEl.cells(S, { set: new Set([0]), u0: 0.1, u1: Q.dust.u1, lv: Q.dust.lv }));
      // bands, each dislocated at the veins and optionally dropped from some cells (blotches)
      for (const b of Q.bands) {
        if (!keep()) continue;
        const d = disl(S, b.amp, b.m3x);
        if (b.drop) for (let c = 0; c < n; c++) if (P01(b.drop)) d[c] += 5;
        band({ u: Math.min(0.92, b.u + sh), w: b.w, lv: b.lv, dis: d, wave: b.wave, teeth: b.teeth, slope: b.slope }, b.edge);
      }
      // cross-lines (antemedial / postmedial style), optionally doubled
      for (const ln of Q.lines) {
        if (!keep()) continue;
        const d = disl(S, 0.015);
        o.det.push(...curve(wavy(ln.u + sh, ln.amp, ln.teeth, d)));
        if (ln.doubled) o.det.push(...curve(wavy(ln.u + sh + 0.025, ln.amp + ln.amp2, ln.teeth, d)));
      }
      // oblique streaks (sphingid style)

      // anal: A along the hind edge; cu-a closes the first cubital cell; a second crossvein up to Cu closes the second

  if (type === 'dragonfly' || type === 'damselfly') {
    // ---- Odonata (docs/wing-venation-spec.md; refs odo-dragonfly, odo-anax-ris1921, odo-damsel-ris1921).
    // Longitudinals undulate through the cell rows; cells sit on a row lattice (one row = a ladder of
    // quadrilaterals near the costa and base, several rows = hexagonal mesh toward the margin); the
    // pterostigma is a rounded parallelogram between C and R1 with a thickened crossvein at each end. ----
    const dam = type === 'damselfly';
    const G = {
      nodus: dam ? randRange(0.36, 0.47) : randRange(0.4, 0.52),
      wF: dam ? randRange(0.13, 0.19) : randRange(0.16, 0.23), wH: dam ? randRange(0.95, 1.1) : randRange(1.12, 1.45),
      anal: dam ? 0.05 : randRange(0.2, 0.42), petiole: dam ? randRange(0.12, 0.26) : 0,
      tipY: randRange(-0.2, 0.12), sharp: randRange(0, 1), bulge: randRange(0.9, 1.1),
      nV: randInt(5, 8), pow0: randRange(1.3, 1.9), wig: randRange(-0.06, 0.06), und: randRange(0.0015, 0.005), period: randRange(0.12, 0.24),
      antStep: randRange(0.028, 0.05), postStep: randRange(0.02, 0.036), tilt: randRange(-0.012, 0.012),
      ps0: randRange(0.72, 0.85), psL: randRange(0.05, 0.11), psStyle: pick(['solid', 'solid', 'cross', 'axis']), psSkew: randRange(0.004, 0.014),
      cells: dam ? randRange(0.9, 1.3) : randRange(0.7, 1.3), rows: dam ? 1 : randInt(2, 4),
      triangle: !dam && rng() < 0.8, bridge: rng() < 0.5, subnodus: rng() < 0.85,

    };

    meta.wingSig = ['odo', G.heavy ? 1 : 0, Math.round(G.len * 10), G.nV, G.rows, G.psStyle, G.triangle ? 1 : 0, G.bridge ? 1 : 0, G.subnodus ? 1 : 0, Math.round(G.nodus * 20), Math.round(G.tipY * 5), Math.round(G.sharp * 2),

      const by = thorax.yAt(wd.t), bx = thorax.hwAt(by) * 0.6;
      const w = wd.w, s = G.sharp, bl = G.bulge;
      const apex = [[Lw * lerp(0.88, 0.94, s), -w * lerp(0.38, 0.22, s)], [Lw, w * G.tipY], [Lw * lerp(0.9, 0.95, s), w * lerp(0.33, 0.18, s) * bl]];

      // each undulating with the cell period so it reads as a chain of cell sides rather than a rod

      veins.forEach((v, i) => L.wings.push(emitLocalPolyline(wing, v, i === 1 ? SW.O : (G.heavy && i < 4 ? SW.O : SW.D))));

      // secondary venation: Voronoi of a row lattice in each strip from R1 down to the trailing edge. Rows follow
      // the strip, one row where it is narrow (a ladder), up to G.rows where it is wide (hexagonal mesh);

  }

  if (type === 'beetle') {
    const top = thorax.yBot - 4;
    const elen = P.abdLen * randRange(0.86, 1.0) + 4;
    const eBot = top + elen;
    const ew = abdHW * 1.03;
    L.thoraxHead.push(lineEl([0, thorax.yBot + 10], [0, eBot - 3], SW.D));   // suture, drawn once above the elytra
    if (eBot < abdomen.yBot - 8) {   // hindwing tips peeking out from under the elytra
      const hwT = abdomen.hwAt(eBot + 4) * 0.9;
      const t = [[hwT * 0.1, eBot - 12], [hwT * 0.95, eBot - 8], [hwT * 0.8, eBot + 5], [hwT * 0.15, eBot + 7]];
      L.covers.push(pathEl(smoothPath(t, true, 1), SW.D, '#fff'));
      for (let k = 1; k <= 2; k++) L.covers.push(pathEl(cubicBezierPath([[hwT * 0.2, eBot - 10 + k * 5], [hwT * 0.5, eBot - 9 + k * 5], [hwT * 0.75, eBot - 7 + k * 5], [hwT * 0.85, eBot - 3 + k * 5]], false), SW.F));

    L.covers.push(pathEl(halfShield(outer), SW.O, '#fff'));
    // striae (ridges) converging toward the apex
    const nR = randInt(3, 5);
    for (let k = 1; k <= nR; k++) {
      const f = 1 - k / (nR + 1);
      const pts = [[ew * 0.5 * f, top + 5], [ew * 0.98 * f, top + elen * 0.1], [ew * f, top + elen * 0.45], [ew * 0.74 * f, top + elen * 0.84], [ew * 0.28 * f, top + elen * 0.975]];
      L.covers.push(pathEl(smoothPath(pts, false, 1), SW.F));
    }
    if (rng() < 0.5) {   // puncture rows between striae
      const nPts = randInt(14, 22);
      for (let k = 0; k <= nR; k++) {
        const f = 1 - (k + 0.5) / (nR + 1);
        const pts = [[ew * 0.5 * f, top + 8], [ew * 0.98 * f, top + elen * 0.1], [ew * f, top + elen * 0.45], [ew * 0.74 * f, top + elen * 0.84], [ew * 0.28 * f, top + elen * 0.95]];
        const pl = sampleSmooth(pts, false, 1, 6);
        for (let i = 0; i < nPts; i++) L.covers.push(circleEl(plAt(pl, (i + 0.5) / nPts), 0.8, SW.F));
      }
    }
  }

  if (type === 'grasshopper') {
    const by = thorax.yBot - 6;
    // ---- tegmen genes ----
    const G = { nL: randInt(2, 4), cell: randRange(5, 10), tilt: randRange(0.05, 0.3), subRow: rng() < 0.6, wt: randRange(1.05, 1.28), tipX: randRange(0.1, 0.32), tipY: randRange(0.96, 1.0), fan: rng() < 0.7, rays: randInt(4, 8), bulge: randRange(0.72, 0.82), midX: randRange(0.4, 0.6) };
    meta.wingSig = ['orth', G.nL, G.subRow ? 1 : 0, Math.round(G.tilt * 10), G.fan ? 1 : 0, G.rays, Math.round(G.cell), Math.round(G.wt * 20), Math.round(G.tipX * 10), Math.round(G.bulge * 20), Math.round(G.midX * 10)].join(',');
    const Lt = P.abdLen * randRange(1.05, 1.18), wt = abdHW * G.wt;
    if (G.fan) {   // folded hindwing fan peeking out
      const fan = [[abdHW * 0.25, by + 4], [abdHW * 1.15, by + Lt * 0.25], [abdHW * 1.3, by + Lt * 0.5], [abdHW * 1.0, by + Lt * 0.72], [abdHW * 0.6, by + Lt * 0.82], [abdHW * 0.3, by + Lt * 0.6]];
      L.covers.push(pathEl(smoothPath(fan, true, 1), SW.D, '#fff'));
      for (let k = 1; k <= G.rays; k++) {
        const tg = lerpP([abdHW * 1.3, by + Lt * 0.5], [abdHW * 0.6, by + Lt * 0.82], k / (G.rays + 1));
        L.covers.push(lineEl([abdHW * 0.3, by + 6], tg, SW.F));
      }
    }
    const teg = [[0, by], [wt * 0.55, by + 3], [wt * 0.75, by + Lt * 0.12], [wt * G.bulge, by + Lt * G.midX], [wt * 0.55, by + Lt * 0.85], [wt * G.tipX, by + Lt * G.tipY], [0, by + Lt]];
    L.covers.push(pathEl(halfShield(teg), SW.O, '#fff'));
    const vs = [];
    for (let k = 0; k <= G.nL; k++) {   // k = 0 is the outer edge itself, used only as a strip boundary
      const f = 1 - k / (G.nL + 1);
      const pts = [[wt * 0.55 * f, by + 6], [wt * 0.75 * f, by + Lt * 0.12], [wt * G.bulge * f, by + Lt * G.midX], [wt * 0.55 * f, by + Lt * 0.85], [wt * G.tipX * f, by + Lt * (G.tipY - 0.02)]];
      vs.push(sampleSmooth(pts, false, 1, 8));
      if (k > 0) L.covers.push(pathEl(smoothPath(pts, false, 1), SW.D));
    }
    // archedictyon (ref orth-grasshopper): rows of square-ish cells between consecutive longitudinals, rungs a
    // little tilted and bowed, finer toward the apex; a sub-row splits the strip where it is wider than two cells
    for (let i = 0; i + 1 < vs.length; i++) {
      const a = vs[i], b = vs[i + 1], n = Math.max(2, Math.round(Lt / G.cell));
      const mids = [];
      for (let k = 1; k < n; k++) {
        const t = k / n, ta = Math.min(1, t + G.tilt * jitter(0.5) / n), pa = plAt(a, ta), pb = plAt(b, t);
        L.covers.push(pathEl(smoothPath([pa, add(lerpP(pa, pb, 0.5), mul(perp(norm(sub(pb, pa))), vlen(sub(pb, pa)) * randRange(-0.08, 0.08))), pb], false, 1), SW.F));
        mids.push(lerpP(pa, pb, 0.5));
      }
      if (G.subRow && i % 2 === 0) L.covers.push(pathEl(smoothPath(mids.filter((_, k) => k % 2 === 0), false, 1), SW.F));   // a lighter longitudinal splitting the row
    }
  }

  // ---------- assemble ----------
  const mirrored = k => '<g>' + L[k].join('') + '</g><g transform="scale(-1,1)">' + L[k].join('') + '</g>';
  const single = k => '<g>' + L[k].join('') + '</g>';
  // legs sprout from under the body; wings are dorsal, so they lie over the body with
  // their roots on the thorax, and the tegulae cover the roots
  const order = [mirrored('legs'), single('abdomen'), mirrored('covers'), single('thoraxHead'), mirrored('wings'), mirrored('tegulae'), mirrored('antennae')];

  // symmetric bbox (right half generated, left mirrored)
  const halfW = Math.max(Math.abs(bbox.minX), Math.abs(bbox.maxX));
  const bw = halfW * 2, bh = bbox.maxY - bbox.minY;
  const margin = 24;
  const CAPTION_H = 45;                       // band reserved at the foot of the plate for the caption
  const plateH = 600 - CAPTION_H;             // drawing is centred within the top 555px
  const s = Math.min((600 - 2 * margin) / bw, (plateH - 2 * margin) / bh, 1.3);
  const tx = 300, ty = plateH / 2 - (bbox.minY + bbox.maxY) / 2 * s;
  meta.name = insectName(seed, type, P.variant);
  meta.scale = s;
  meta.bbox = { minX: -halfW, maxX: halfW, minY: bbox.minY, maxY: bbox.maxY };
  meta.fitted = { minX: tx - halfW * s, maxX: tx + halfW * s, minY: ty + bbox.minY * s, maxY: ty + bbox.maxY * s };

  // plate caption: italic binomial and a letter-spaced small-caps common name
  const esc = t => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const nm = meta.name;
  const caption =
    '<text x="300" y="571" text-anchor="middle" font-family="Georgia, \'Times New Roman\', serif" font-size="16" fill="#000">' +
    '<tspan font-style="italic">' + esc(nm.binomial) + '</tspan></text>' +
    '<text x="300" y="587" text-anchor="middle" font-family="Georgia, \'Times New Roman\', serif" font-size="11" font-variant="small-caps" letter-spacing="1.5" fill="#000">' +
    esc(nm.common) + '</text>';

  let svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">' +
    '<rect width="600" height="600" fill="#fff"/>' +
    '<g transform="translate(' + fmt(tx) + ' ' + fmt(ty) + ') scale(' + (Math.round(s * 1000) / 1000) + ')" stroke="#000" stroke-linecap="round" stroke-linejoin="round" fill="none">' +
    order.join('') + '</g>' + caption + '</svg>';
  const sw = v => String(Math.round(v / s * 1000) / 1000);
  svg = svg.replace(/SW_H/g, sw(2.2)).replace(/SW_O/g, sw(1.5)).replace(/SW_D/g, sw(0.8)).replace(/SW_F/g, sw(0.5));
  return { svg, meta };
}

function generateInsect(seed) { return generateInsectDetailed(seed).svg; }

if (typeof module !== 'undefined' && module.exports) {
  module.exports = { generateInsect, generateInsectDetailed, insectName, dailySeed, hashString, mulberry32, TYPES };
}
</script>

<script>
(function () {
  // Two independent panes (A always shown, B behind the Compare toggle), each with its own
  // seed, controls and Back history. The URL hash carries one seed (#123) or both (#123|456).
  const HISTORY_MAX = 100;
  const panesEl = document.getElementById('panes');
  const compareBtn = document.getElementById('compare');
  const panes = [];
  let compare = false;
  let hashLock = false;   // set while we write the hash ourselves (replaceState never fires hashchange, but keep it explicit)

  function makePane(id) {
    const el = document.createElement('div');
    el.className = 'pane';
    el.innerHTML = '<div class="stage"></div><div class="controls">' +
      '<button class="back" disabled>Back</button>' +
      '<label>Seed <input class="seed" type="number" value="1" min="0" step="1"></label>' +
      '<button class="gen">Generate</button><button class="rnd">Random</button><button class="daily">Daily</button></div>';
    panesEl.appendChild(el);
    const q = c => el.querySelector('.' + c);
    const pane = { id, el, stage: q('stage'), seedInput: q('seed'), backBtn: q('back'), history: [], seed: null, meta: null };

    // render(seed) pushes the previously displayed seed onto the pane's history;
    // render(seed, false) renders without recording (used by Back itself).
    pane.render = (seed, push = true) => {
      seed = Number(seed) >>> 0;
      if (push && pane.seed !== null && pane.seed !== seed) {
        pane.history.push(pane.seed);
        if (pane.history.length > HISTORY_MAX) pane.history.shift();
      }
      pane.seed = seed;
      pane.backBtn.disabled = pane.history.length === 0;
      pane.seedInput.value = seed;
      const r = generateInsectDetailed(seed);
      pane.stage.innerHTML = r.svg;
      pane.meta = r.meta;
      syncHash();
    };
    pane.goBack = () => { if (pane.history.length) pane.render(pane.history.pop(), false); };

    pane.backBtn.addEventListener('click', pane.goBack);
    q('gen').addEventListener('click', () => pane.render(pane.seedInput.value));
    pane.seedInput.addEventListener('keydown', e => { if (e.key === 'Enter') pane.render(pane.seedInput.value); });
    q('rnd').addEventListener('click', () => pane.render(Math.floor(Math.random() * 4294967296)));
    q('daily').addEventListener('click', () => pane.render(dailySeed()));
    return pane;
  }

  function syncHash() {
    const shown = panes.filter(p => p.seed !== null && (p.id === 0 || compare));
    if (!shown.length) return;
    hashLock = true;
    history.replaceState(null, '', '#' + shown.map(p => p.seed).join('|'));
    hashLock = false;
    const a = panes[0].meta;
    document.title = (a ? a.name.binomial + ' \u00b7 ' : '') + 'insectdraw #' + shown.map(p => p.seed).join('|');
  }

  function setCompare(on) {
    compare = on;
    document.body.classList.toggle('compare', on);
    compareBtn.classList.toggle('on', on);
    panes[1].el.style.display = on ? '' : 'none';
    if (on && panes[1].seed === null) panes[1].render(Math.floor(Math.random() * 4294967296));
    syncHash();
  }

  // #123 or #123|456 -> [123] / [123, 456]; anything else -> null
  function parseHash() {
    const m = location.hash.slice(1).match(/^(\d+)(?:\|(\d+))?$/);
    return m ? [m[1], m[2]].filter(x => x !== undefined) : null;
  }
  function applyHash(seeds) {
    seeds.forEach((s, i) => { if ((Number(s) >>> 0) !== panes[i].seed) panes[i].render(s); });
    if (seeds.length === 2 && !compare) setCompare(true);
  }

  panes.push(makePane(0), makePane(1));
  panes[1].el.style.display = 'none';
  compareBtn.addEventListener('click', () => setCompare(!compare));
  // External hash edits (a pasted #seed or #a|b) render and are back-able.
  window.addEventListener('hashchange', () => { if (hashLock) return; const s = parseHash(); if (s) applyHash(s); });

  const initial = parseHash();
  if (initial) applyHash(initial); else panes[0].render(dailySeed());
  window.render = panes[0].render;
  window.goBack = panes[0].goBack;
  window.panes = panes;
})();
</script>
